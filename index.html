<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billable — a case</title>
<style>
  :root{--paper:#f4efe4;--paper2:#ebe4d4;--ink:#1e1c19;--ink2:#5a554c;--rule:#cfc6b2;--navy:#22304a;--red:#9a2f2a;--gold:#b8933a;--green:#2f6b45}
  *{box-sizing:border-box}
  html,body{margin:0;background:#171a22;color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
  #app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top, 0px) + 18px) 0 calc(env(safe-area-inset-bottom, 0px) + 28px)}
  header{padding:26px 18px 10px;border-bottom:1px solid var(--rule);background:var(--paper2)}
  header .firm{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  header h1{margin:2px 0 0;font-size:20px;font-weight:400}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 18px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink2)}
  #sticky{position:sticky;top:0;z-index:20;background:var(--paper)}
  .bar b{color:var(--ink);font-weight:600}
  .pressure{grid-column:1/-1;display:flex;align-items:center;gap:10px}
  .track{flex:1;height:10px;background:var(--rule);border-radius:5px;position:relative;overflow:hidden}
  .track .you{position:absolute;left:0;top:0;bottom:0;background:var(--navy);transition:width .5s}
  .track .them{position:absolute;right:0;top:0;bottom:0;background:var(--red);transition:width .5s}
  .team{display:flex;gap:10px;padding:8px 18px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink2);flex-wrap:wrap}
  .burn{display:inline-block;width:44px;height:5px;background:var(--rule);border-radius:3px;vertical-align:middle;margin-left:4px;overflow:hidden}
  .burn i{display:block;height:100%;background:var(--gold)}
  main{flex:1;padding:14px 18px 18px}
  .log p{margin:0 0 10px}
  .log .beathead{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);border-top:1px solid var(--rule);padding-top:10px;margin-top:16px}
  .log .enchead{font-size:22px;font-weight:400;margin:28px 0 4px;color:var(--ink)}
  .log .enchead+.sub{color:var(--ink2);font-style:italic;margin-bottom:8px}
  .log .room{font:14px/1.45 system-ui,sans-serif;color:var(--ink2);border-left:3px solid var(--gold);padding:6px 10px;margin:4px 0 12px;background:rgba(184,147,58,.08)}
  .log .kturn{padding:8px 12px;border-left:3px solid var(--red);background:#fff6}
  .k{color:var(--red)}.good{color:var(--green)}.warn{color:var(--gold)}.note{color:var(--ink2);font-style:italic}
  .beat{margin-top:16px}
  .beat .situation{margin:0 0 12px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;border:1px solid var(--rule);background:#fff9;border-radius:6px;padding:10px 12px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .opt.locked{opacity:.55;border-style:dashed}
  .jr{font:500 10px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:middle}
  .fit{font:500 11px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-left:8px;white-space:nowrap;flex:none}
  .fit.strong{background:var(--navy);color:#fff}
  .fit.fits{border:1px solid var(--navy);color:var(--navy)}
  .opt small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
  .opt.sel{border-color:var(--navy);background:#fff;box-shadow:inset 3px 0 0 var(--navy)}
  .who{margin-top:12px;font-size:14px;color:var(--ink2)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{border:1px solid var(--rule);background:#fff9;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
  .chip.sel{border-color:var(--navy);background:var(--navy);color:#fff}
  .chip small{opacity:.7}
  .go{margin-top:14px;margin-bottom:8px;width:100%;padding:14px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}
  .go:disabled{opacity:.4}
  .end h2{font-weight:400;margin:16px 0 6px}
  .end .stat{font-size:15px;color:var(--ink2)}
  .end button{margin-top:14px;padding:12px 18px;border:1px solid var(--navy);background:transparent;color:var(--navy);font:600 15px system-ui,sans-serif;border-radius:8px}
  .offer{border:1px solid var(--gold);background:#fff8e6;border-radius:8px;padding:12px 14px;margin-top:14px}

  .firm{padding:16px 18px 24px}
  .firm h2{font-weight:400;margin:6px 0 2px;font-size:24px}
  .firm .meta{color:var(--ink2);font-size:14px;margin-bottom:12px}
  .card{border:1px solid var(--rule);background:#fff9;border-radius:8px;padding:10px 12px;margin:8px 0}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card .nm{font-weight:600}
  .card .rar{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
  .card .st{font-size:13px;color:var(--ink2);margin-top:4px}
  .card .st b{color:var(--ink);font-weight:600}
  .card .q{font-size:13.5px;margin-top:6px}
  .card.sel{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy);background:#fff}
  .card.dim{opacity:.55}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .btn{border:1px solid var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:10px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
  .btn.primary{background:var(--navy);color:#fff}
  .btn:disabled{opacity:.4}
  .bar2{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--rule)}
  .bar2 b{color:var(--ink)}
  .bar2.mand{display:block}
  .bar2.mand>span{display:block;margin-bottom:3px}
  .reveal{border:1px solid var(--gold);background:#fff8e6;border-radius:8px;padding:12px 14px;margin:12px 0}
  .lvl{display:inline-block;width:60px;height:5px;background:var(--rule);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
  .lvl i{display:block;height:100%;background:var(--navy)}
  .hide{display:none !important}
  .cast{border:1px solid var(--rule);background:#fff7;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
  .cast div{margin:3px 0}
  .casthead{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
  #castBtn{flex:none;margin-left:12px}
  .hdrrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  header #caseLine,header h1{padding-right:96px}

  /* ---- walkthrough callouts ---- */
  #tutSpot{position:absolute;pointer-events:none;border:2px solid var(--gold);border-radius:10px;box-shadow:0 0 0 9999px rgba(30,28,25,.45);z-index:50;transition:all .25s}
  #tutCard{position:absolute;z-index:51;max-width:min(92vw,420px);background:#fbf7ee;border:1px solid var(--gold);border-radius:10px;padding:12px 14px;font:15px/1.45 Georgia,serif;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.18)}
  #tutCard .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  #tutCard .tbtn{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:7px 12px;font:600 13px system-ui,sans-serif;color:var(--ink2);cursor:pointer}
  #tutCard .tbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  #tutCard .tstep{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
  <div id="firmUI" class="firm hide"></div>
  <header id="hdr" style="position:relative">
    <div class="hdrrow"><div class="firm" id="caseLine">Whitlock, Sterne &amp; Grieve · Vantage Logistics v. Meridian Freight</div><button class="quiet-btn" id="castBtn" style="border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 10px;font:600 12px system-ui,sans-serif;color:var(--ink2)">Who's Who</button></div>
    <h1 id="title">Intake</h1>
  </header>
  <div id="sticky">
  <div class="bars" id="bars">
    <div class="pressure"><span>You <b id="pY">0</b></span><div class="track"><div class="you" id="tY"></div><div class="them" id="tT"></div></div><span><b id="pT">0</b> <span id="ocName">Kessler</span></span></div>
    <div class="bar"><span id="patLbl">Client patience</span> <b id="pat">0</b></div>
    <div class="bar hide" id="pat2Bar"><span id="pat2Lbl">Firm patience</span> <b id="pat2">0</b></div>
    <div class="bar">Budget <b id="hrs">0</b> hrs</div>
    <div class="bar"><span id="recLbl">Record</span> <b id="rec">0</b></div>
  </div>
  <div class="team" id="team"></div>
  </div>
  <div id="castPanel" class="hide" style="padding:0 18px"></div>
  <main id="mainUI">
    <div class="log" id="log"></div>
    <div class="beat" id="beat"></div>
    <div class="end" id="end"></div>
  </main>
</div>

<script>
(() => {
const d = n => Math.floor(Math.random() * n) + 1;
/* ---------------- firm investment (Institutional Knowledge) ---------------- */
const SKILL_KEYS = ["res", "dra", "adv", "cha"];
const NOTCH_FACES = [[1,2,3,4,5,6],[1,2,3,4,6,6],[1,2,3,5,6,6],[1,2,4,5,6,6],[1,3,4,5,6,6],[1,4,5,6,6,6]];
const NOTCH_COST = [40, 190, 260, 380, 800];
const IK_THRESH = [3, 9, 18, 30, 45];
const notchOf = k => (F && F.notch && F.notch[k]) || 0;
const ikOf = k => (F && F.ik && F.ik[k]) || 0;
// rungs the firm has earned the right to buy, 0..5
const ikRungs = k => IK_THRESH.filter(t => ikOf(k) >= t).length;
// rungs unlocked but not yet paid for
const notchesOpen = () => SKILL_KEYS.reduce((n, k) => n + Math.max(0, ikRungs(k) - notchOf(k)), 0);
// the firm's die. the associate's die never changes.
const firmDie = stat => NOTCH_FACES[notchOf(stat)][Math.floor(Math.random() * 6)];
// per-tier difficulty. tier 1 eases the hardest rolls, tier 2 and 3 bite, hardest on the easy ones.
function caseDC(dc) {
  const t = (G && G.client && G.client.tier) || 1;
  if (t <= 1) return dc >= 10 ? dc - 1 : dc;
  if (t === 2) return dc <= 8 ? dc + 2 : dc + 1;
  return dc <= 8 ? dc + 3 : dc + 2;
}
function bumpIK(stat, n) {
  if (!F || !F.ik || SKILL_KEYS.indexOf(stat) < 0) return;
  const before = ikRungs(stat);
  F.ik[stat] = ikOf(stat) + n;
  const after = ikRungs(stat);
  if (after > before) { F.pendingUnlocks = (F.pendingUnlocks || 0) + (after - before); }
  saveFirm();
};
const pick = arr => arr[d(arr.length) - 1];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const STAT = { res: "Research", dra: "Drafting", adv: "Advocacy", cha: "Charm" };

/* ---------------- people ---------------- */
let team = {};   // built per case from the firm roster: team.lead, team.brain, team.junior
const alive = () => Object.values(team).filter(a => !a.out);
const tiredest = () => alive().slice().sort((a, b) => b.burn / b.max - a.burn / a.max)[0];
const targetable = () => alive().filter(a => !(a.hooks && (a.hooks.untargetable || a.hooks.ghost))).sort((a, b) => b.burn / b.max - a.burn / a.max)[0];


/* =====================================================================
   OPPOSING COUNSEL. Five characters, five firms. OC is the one on this case.
   ===================================================================== */
const COUNSEL = {
  kessler: { id: "kessler", first: "Dana", last: "Kessler", name: "Dana Kessler", firm: "Roundup, Padwell &amp; Bill", style: "The Sandbagger", tier: 1,
    read: "She waits. She lets you think you're winning, then plays whatever she's been holding. Watch the face-down stack.",
    tell: "One stack of Kessler's exhibits is face down and she has not touched it.",
    know: "You will see her exhibit coming a beat earlier.",
    end: { win: `Kessler shakes your hand for exactly one second and says "Well tried." She means it, which is the worst part for her.`, lose: `Kessler sends a fruit basket to your office. The card says "Until next time." There is no next time in her mind.` } },
  pruitt: { id: "pruitt", first: "Geraldine", last: "Pruitt", name: "Geraldine Pruitt", firm: "Sixmin &amp; Tenth LLP", style: "The Paper Flood", tier: 1,
    read: "She buries you. Forty requests, nine hundred pages on a Friday, a letter to the court every week. She wins when you're tired and out of hours. Her research is thinner than her briefs.",
    tell: "Pruitt's associate wheels in a second box. Then a third.",
    know: "Your team saves hours against her.",
    end: { win: `Pruitt's closing invoice to her client is rumored to have a page count in the hundreds. She bills the handshake.`, lose: `Pruitt sends a 40-page letter memorializing the outcome. Nobody at your client reads past the caption.` } },
  sayle: { id: "sayle", first: "Barbara", last: "Sayle", name: "Barbara Sayle", firm: "Marchbanks &amp; Overholt", style: "The Old Friend", tier: 2,
    read: "She clerked for Judge Amsel and still has lunch with him. Her objections get sustained on reputation. She is bad with juries and worse on paper: get to trial with a clean record and she comes apart.",
    tell: "Sayle calls the judge \"Warren\" once, on the record, and corrects herself a beat too late.",
    know: "The judge starts a little less in her pocket.",
    end: { win: `Sayle congratulates you in the hallway and mentions she'll "see Warren at the club." She will not be mentioning this case.`, lose: `Sayle sends a handwritten note on Marchbanks stationery. It is gracious. It is also, somehow, condescending.` } },
  voss: { id: "voss", first: "Renata", last: "Achterberg", name: "Renata Achterberg", firm: "Threnody &amp; Rusk", style: "The Bully", tier: 2,
    read: "She picks your weakest associate on day one and goes after them until they break. Her Pressure moves are small. The number of associates she has broken is not. A team that spreads the load, and a judge who sees what she's doing, are how you beat her.",
    tell: "Achterberg learns everyone's first name before the court reporter has set up, and uses them.",
    know: "The first time she targets someone, it doesn't land.",
    end: { win: `Achterberg leaves without a word. Threnody & Rusk's associates look, briefly, hopeful.`, lose: `Achterberg sends a LinkedIn connection request to each of your associates. It reads as a threat.` } },
  ellsworth: { id: "ellsworth", first: "Ruth", last: "Marrable", name: "Ruth Marrable", firm: "the Agency", style: "The Economist", tier: 1, kind: "gov", she: "she", her: "her", hers: "her", She: "She",
    read: "Twenty years at the Agency. She tries every case the same way: a market definition, a concentration number, and an economist who will say the number means what she says it means. She is slow to adjust when the market turns out to be bigger than her definition. Beat the definition and the rest of her case is arithmetic about a market that does not exist.",
    tell: "Marrable says \"the relevant market\" in her first sentence and does not say the companies' names for a full minute.",
    know: "Your team knows where her market definition is weakest.",
    end: { win: `Marrable packs her binders herself. She has lost before, and she will file the next one on schedule.`, lose: `Marrable's statement to the press runs three sentences and uses the phrase "protected consumers" twice.` } },
  obuya: { id: "obuya", first: "Daniel", last: "Obuya", name: "Daniel Obuya", firm: "the Agency", style: "The Hot Document", tier: 2, kind: "gov", she: "he", her: "him", hers: "his", She: "He",
    read: "He does not care about economics. He cares about what your client's executives wrote to each other before the deal, and he reads it aloud, slowly, in every room. His cases are built on six emails. Find the six before he does, and have an answer for each.",
    tell: "Obuya opens his binder to a tab marked in red and does not look at it while he reads from it.",
    know: "Your team has read the same emails he has, and knows what comes after each one.",
    end: { win: `Obuya shakes your hand and says the emails were still bad. He is not wrong.`, lose: `Obuya's closing memo to the Agency's director is one page and attaches the six emails. Nothing else was needed.` } },
  grantham: { id: "grantham", first: "Celeste", last: "Grantham", name: "Celeste Grantham", firm: "the Agency", style: "The Remedy Hawk", tier: 3, kind: "gov", she: "she", her: "her", hers: "her", She: "She",
    read: "She does not want to block your deal. She wants to take a third of it. Every conversation with her is about what your client will sell to get the rest, and she uses the trial date as a clock. She is weakest in front of a judge, because she has spent her career avoiding one.",
    tell: "Grantham's first email asks for a call \"about paths forward\" before she has filed anything.",
    know: "Your client knows what she will ask for before she asks.",
    end: { win: `Grantham calls the next morning to ask what your client would have sold. Nothing, you tell her. She does not believe you.`, lose: `Grantham's consent decree runs ninety pages. Your client will be reporting to her office for ten years.` } },
  ashby: { id: "ashby", first: "Nola", last: "Vauclair", name: "Nola Vauclair", firm: "Lowe, Ball &amp; Settle", style: "The Settlement Shark", tier: 1,
    read: "She offers to settle after every encounter, each offer worse than the last, and she'll pitch your client directly if she can. She barely tries to win. She doesn't have to if you fold. Keep Ostrowski calm and keep going, and she has nothing at trial.",
    tell: "Vauclair asks your client how the kids are. She knows their names.",
    know: "Her first offer comes in higher.",
    end: { win: `Vauclair is genuinely surprised you went the distance. "Most people take the second offer." You did not take the second offer.`, lose: `Vauclair sends Ostrowski a bottle of wine. Ostrowski, to her credit, sends it to you.` } },
};
const DEAL_COUNSEL = {
  ibeh: { id: "ibeh", first: "Constance", last: "Ibeh", name: "Constance Ibeh", firm: "Bellweather Crane", style: "The Redliner", tier: 1, kind: "deal",
    read: "She sends draft eleven at midnight with a hundred and forty changes and marks none of them. Three of them matter. She wins when you stop reading carefully. Her clients hate how long she takes.",
    tell: "Ibeh's first draft arrives with the change-tracking turned off.",
    know: "Your team reads her drafts faster.",
    end: { win: `Ibeh sends a closing set with three typos in it. You do not point them out. That is your victory lap.`, lose: `Ibeh's closing binder is flawless. You find the change she slipped past you on page 61, two weeks later, for no reason.` } },
  tobias: { id: "tobias", first: "Tobias", last: "Fennimore", name: "Tobias Fennimore", firm: "Marchbanks &amp; Overholt", style: "The Relationship", tier: 1, kind: "deal",
    read: "He knows your client's board personally. He never argues with you; he has lunch with your client's CEO and by dessert the point is 'already agreed.' He attacks your client's patience, not your terms. Keep the CEO in the room and away from him.",
    tell: "Fennimore greets your client's CEO by first name and asks about the boat.",
    know: "Your client's patience holds better against him.",
    end: { win: `Fennimore congratulates your CEO warmly and does not look at you. You have been added to a list.`, lose: `Fennimore sends your client's CEO a bottle of something old. Your client mentions it twice, and not to thank you.` } },
  venkat: { id: "venkat", first: "Sunita", last: "Venkataraman", name: "Sunita Venkataraman", firm: "Pryor Knowles", style: "The Technician", tier: 1, kind: "deal",
    read: "The most competent person in any room, and she makes sure you know it. Her drafts are airtight and every position is 'market.' She wins by being right. She cannot adapt when the business people cut a deal over her head, so get the principals talking.",
    tell: "Venkataraman's cover email cites the page number of the precedent for each position.",
    know: "The CEO-to-founder call gets easier.",
    end: { win: `Venkataraman shakes your hand and says "well drafted," which from her is a sonnet.`, lose: `Venkataraman's closing memo to her client is nine pages and every page is right. Yours is one page and it says "closed."` } },
};
Object.assign(COUNSEL, DEAL_COUNSEL);
COUNSEL.blythe = { id: "blythe", first: "Cassius", last: "Blythe", name: "Cassius Blythe", firm: "Hollins, Marrow &amp; Tate", style: "The Student", tier: 2, kind: "lit", requiresNames: 1,
  read: "He has read every case your firm has tried. He knows which of your associates gets tired first and which one talks too much. He does not sandbag or bully; he anticipates. His weakness is that he plans for the group he studied, and groups change.",
  tell: "Blythe greets each of your associates by name and mentions something true about the last case they worked.",
  know: "Your associates' quirks stop working against you.",
  end: { win: `Blythe sends a handwritten note: "Not what I expected. Well done." He has already started a new file on you.`, lose: `Blythe's closing memo to his client is titled with the name of your firm and the word "predictable."` } };
Object.values(COUNSEL).forEach(c => { if (!c.kind) c.kind = "lit"; const m = c.id === "tobias" || c.id === "blythe" || c.id === "obuya"; c.she = m ? "he" : "she"; c.She = m ? "He" : "She"; c.her = m ? "him" : "her"; c.hers = m ? "his" : "her"; });
let OC = COUNSEL.kessler;
const CL = () => CASE.client;
const MED = () => CASE.structure === "merger" ? "the deputy director" : "Feld";
const WIT = () => { const w = (typeof cur !== "undefined" && cur && cur.witness) || (typeof enc !== "undefined" && enc && enc.witness); return w ? (typeof w === "function" ? w() : w) : (CASE.witness || "the witness"); }; // { name, last, title, company, she, her, hers, He, His }
const CLIENT = () => CL().last;
const CL2 = () => SK.cl2 || SK.cl;
function castList() {
  const st = CASE.structure, oc = `<b>${OC.name}</b>, ${OC.firm}${G && G.f && G.f.knowOC ? " (" + OC.style + ")" : ""}. Opposing counsel.`;
  if (st === "commercial") return [`<b>${SK.cl.name}</b>, ${SK.cl.title} of <b>${SK.co}</b>. Your client. ${SK.coShort} is suing.`, `<b>${SK.oppCo}</b>. The other side. Their ${SK.witTitle}, <b>${SK.wit}</b>, is the key witness.`, oc];
  if (st === "acquisition") return [`<b>${SK.cl.name}</b>, CEO of <b>${SK.co}</b>. Your client, the buyer.`, `<b>${SK.cl2.name}</b>, ${SK.co}'s general counsel. Also your client.`, `<b>${SK.oppCo}</b>, the company being bought. Founded and run by <b>${SK.founder}</b>.`, oc];

  if (OC.id === "kessler" && kind === "depo" && lead >= 25) moves.push({ w: (K.count.comeback || 0) >= 1 ? 0 : 3, name: "comeback", run: () => { mood(-2); return ksay("comeback", 2 + d(2)); } });
  if (lead <= 0 && (kind === "depo" || kind === "trial" || kind === "hearing")) moves.push({ w: cap("sit", 2), name: "sit", run: () => ksay("sit", 1 + d(2)) });
  moves.push({ w: [0, 4, 2, 1][G.tier || 1], name: "pass", run: () => ksay(kind === "depo" ? "pass" : kind === "trial" ? "passTrial" : kind === "hearing" ? "passHearing" : kind === "mediation" ? "passMediation" : kind === "deal" || kind === "closing" ? "passDeal" : "passPaper") });
  if (kind === "depo") moves.push({ w: cap("objections", 2), name: "objections", run: () => { G.kObj = true; return ksay("objections"); } });
  if (kind === "trial") moves.push({ w: cap("objectionsTrial", 2), name: "objectionsTrial", run: () => { G.kObj = true; return ksay("objectionsTrial"); } });
  if (kind === "hearing") moves.push({ w: cap("objectionsHearing", 2), name: "objectionsHearing", run: () => { G.kObj = true; return ksay("objectionsHearing"); } });
  if (kind === "depo") moves.push({ w: cap("lead", 2), name: "lead", run: () => ksay("lead", 2 + d(2)) });
  if (kind === "trial") moves.push({ w: OC.id === "sayle" || OC.id === "ashby" ? 3 : 5, name: "trialhit", run: () => ksay("trialhit", (OC.id === "sayle" || OC.id === "ashby" ? 2 : OC.id === "pruitt" ? 3 : 5) + d(5)) });
  if (kind === "deal") moves.push({ w: 4, name: "dealhit", run: () => ksay("dealhit", 3 + d(4)) });
  if (kind === "mediation") moves.push({ w: 4, name: "mediationHit", run: () => ksay("mediationHit", 3 + d(3)) });
  if (kind === "paper") moves.push({ w: OC.id === "sayle" ? 2 : 4, name: "paperhit", run: () => ksay("paperhit", (OC.id === "pruitt" ? 4 : 3) + d(4)) });
  if (kind === "hearing") moves.push({ w: OC.id === "sayle" ? 2 : 4, name: "hearinghit", run: () => ksay("hearinghit", (OC.id === "pruitt" ? 4 : 3) + d(4)) });
  let pool = moves.filter(m => m.w > 0 && m.name !== K.lastMove); if (!pool.length) pool = moves.filter(m => m.w > 0);
  const bag = []; pool.forEach(m => { for (let i = 0; i < m.w; i++) bag.push(m); });
  let txt = null, m = null; const tried = new Set();
  K.strict = true;
  for (let attempt = 0; attempt < 8 && !txt; attempt++) { const cands = bag.filter(x => !tried.has(x.name)); if (!cands.length) break; m = pick(cands); tried.add(m.name); txt = m.run(); }
  K.strict = false;
  if (!txt) { m = moves.find(x => x.name === "pass") || pick(bag); txt = m.run(); }
  K.lastMove = m.name;
  const p = document.createElement("p"); p.className = "kturn"; p.innerHTML = txt; $("log").appendChild(p); KROOM = null;
}
function playExhibit() {
  K.exhibit = false; G.f.exhibitPlayed = true;
  let g = G.f.knowExhibit ? 5 + d(4) : 10 + d(6); if (G.rec >= 22) g = Math.max(3, g - 5); mood(-1);
  const what = SK.doc ? `Exhibit 41. Revised ${SK.doc}, ${SK.date2 || "dated last spring"}, initialed by ${SK.coShort}.` : `Exhibit 41. A document nobody produced, and it helps ${OC.hers} client.`;
  return G.f.knowExhibit
    ? `${OC.last} turns over the face-down stack. ${what} Because ${team.brain.name} already had the witness talking about it, it lands like old news. ${kess(g)}`
    : `${OC.last} turns over the face-down stack. "${what}" ${OC.She} lets the silence do the work. ${kess(g)} <span class="note">${OC.style}, doing the thing.</span>`;
}

const attack = (a, dc, ok, good, great, miss, backfire) => {
  let t = roll(a, "adv", dc, true);
  if (t === 0 && ((a.sig === "footnote" && !a.sigUsed) || (a.hooks.lucky && !a.luckUsed))) { if (a.sig === "footnote") a.sigUsed = true; else a.luckUsed = true; t = 1; LAST.tier = 1; setTimeout(() => log(`<span class="note">${a.name} catches it a half-second before it becomes a disaster.</span>`), 0); }
  if (t === 4) { mood(1); return great(P[4]); }
  if (t === 3) { mood(1); return good(P[3]); }
  if (t === 2) return ok(P[2]);
  if (t === 1) return miss();
  mood(-1); return backfire();
};

/* ---------- 1. Intake ---------- */
const INTAKE = { title: "Intake", kind: "office", room: "Intake is the first meeting with a new client, where you find out what happened, what they have, and what they expect.", intro: () => `Monday. Your office. ${SK.cl.name}, ${SK.cl.title} of ${SK.co}, has brought a cardboard box full of documents and a grievance.`,

      options: [
        { label: "Tell her it's strong", hint: "A confident lawyer calms a nervous client, and a calm client gives you room to work. If the case goes badly later, this is the promise she will remember. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); if (t >= 2) { G.pat += 10; G.f.promised = true; return `${a.name}: "The initials are on the card. That's the case." Your client is reassured. <span class="good">Patience +10.</span> <span class="note">You promised something. She will remember.</span>`; } G.pat += 3; G.f.promised = true; return `${a.name} projects confidence. Your client looks unconvinced but writes it down. <span class="good">Patience +3.</span> <span class="note">Promised, and she is not sure she believes you.</span>`; } },
        { label: "Tell her it's a fight", hint: "Tell her the truth, that the other side has a real argument. Her patience starts lower, but nothing that happens later will feel like a betrayal. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 7); tire(a, 2); G.pat += t >= 2 ? 4 : 0; G.f.honest = true; return `${a.name} walks ${SK.cl.her} through where ${SK.oppShort} will push: "never finalized," the board approval, the revised card they will claim exists. She appreciates it, mostly. ${t >= 2 ? '<span class="good">Patience +4.</span>' : ""} <span class="note">Expectations set low. Good news will land harder.</span>`; } },
        { label: "Ask for the whole file first", hint: "Read everything the client has before you commit to a story. Clients leave out the embarrassing parts, and you want to find those before the other side does. Costs budget. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 4); G.hrs -= 3; if (t >= 2) { G.f.fullFile = true; return `${a.name} spends the afternoon in the box and finds a shared-drive index your client did not know she had. ${rec(6)} Budget −3. <span class="note">You will know where things are before ${OC.last} does.</span>`; } return `${a.name} reads for four hours. The box is what it looked like. Budget −3.`; } },
      ] },
    { title: "The budget", text: () => `Your client: "The board approved sixty hours for this phase. I can get more, but I'd rather not ask." She looks at ${team.junior.name}, who is the youngest person in the room by a decade.`,

        { label: "Agree to sixty", hint: "Sixty hours is tight for a case like this, but agreeing to it tells the client you respect her money. Patience up, budget down.", stat: null, who: null, run: () => { G.pat += 6; return `You say sixty is fine. Your client is relieved. <span class="good">Patience +6.</span>`; } },
        { label: "Ask for eighty", hint: "Ask for the hours the case actually needs. She will pay it, and she will remember that you asked. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 2); if (t >= 2) { G.hrs += 20; G.pat -= 4; return `${a.name} explains what a deposition actually costs. Your client sighs and says she will "make it work." <span class="good">Budget +20.</span> <span class="warn">Patience −4.</span>`; } G.pat -= 8; return `${a.name} asks. Your client: "Sixty." <span class="warn">Patience −8.</span>`; } },
        { label: "Staff it lean", hint: () => `Promise the client that ${team.junior.name}'s hours will not be billed. The budget stretches, and ${team.junior.name} works the same hours for nothing, which wears people down.`, stat: null, who: null, run: () => { G.hrs += 10; G.f.leanStaff = true; tire(team.junior, 10); return `You say the first-year will be "learning, not billing," which your client likes and ${team.junior.name}, standing right there, does not. <span class="good">Budget +10.</span> <span class="warn">${team.junior.name} Burnout +10.</span> <span class="note">He heard that.</span>`; } },

/* ---------- 2. Discovery ---------- */
const DISCOVERY = { title: "Discovery", kind: "paper", room: "Discovery is the phase when each side has to hand over its documents. Most cases are won or lost by what turns up here.", intro: "Six weeks of paper. Each side demands documents, objects to the other side's demands, and argues about the objections on the phone, and sends whatever it is sending late on a Friday night.",

        { label: () => `Have ${team.junior.name} build the review protocol`, hint: () => `Someone has to decide how thousands of documents get sorted. It is dull, careful work, exactly right for the junior, and whoever does it sometimes finds the thing everyone else skims past. ${team.junior.name} only.`, stat: "res", who: "junior", run: a => { const t = roll(a, "res", 9); tire(a, 6); G.hrs -= 2; if (t >= 3) { G.f.fullFile = true; return `${team.junior.name} builds a search protocol that turns up a folder called "${SK.folder}." He is unbothered, because it is exactly what the team hoped to find. ${rec(8)} Budget −2.`; } return `${team.junior.name} builds a sensible protocol. It finds sensible documents. ${rec(3)} Budget −2.`; } },

    { title: "Their production", text: () => `${SK.oppShort}'s documents arrive on a Friday at 11:40 p.m. There are 340 pages and most of them are blacked out. Their list of what they held back as attorney-client secrets is one line: "Communications with counsel."`,
      options: [
        { label: "Demand a real list of what they held back", hint: () => `When the other side holds documents back as secret, they have to list what they held. Make ${OC.last} produce a real list; it tells you what ${OC.she} is protecting. ${OC.She} will drag ${OC.hers} feet. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 6); G.hrs -= 3; if (t >= 2) { G.f.logChallenged = true; return `${a.name} sends a letter with the case law attached. ${OC.last} produces a real list two weeks later. It has 212 entries. ${rec(7)} Budget −3. <span class="note">Three of those entries are going to matter.</span>`; } return `${a.name} sends a letter. ${OC.last}'s reply: "We disagree." Budget −3.`; } },
        { label: "Read every redacted page anyway", hint: () => `Read the blacked-out pages anyway. The shape of what is hidden often tells you what it is, and you may spot the document that decides the case before ${OC.she} plays it. Tedious. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 7); G.hrs -= 3; if (t >= 2) { G.f.knowExhibit = true; return `${a.name} finds, under a redaction that was not quite opaque, a reference to "the ${MO()} revision." ${OC.last} is sitting on something. ${rec(3)} Budget −3. <span class="note">You know what is in the face-down stack.</span>`; } return `${a.name} reads 340 pages of black rectangles. Budget −3.`; } },

const founderMood = () => [[`${SK.founder} is hostile and answering in as few words as possible.`,`${SK.founder} is guarded and giving nothing away.`,`${SK.founder} is still hostile.`],[`${SK.founder} is careful, and checks with her lawyer before every answer.`,`${SK.founder} is careful.`,`${SK.founder} is being careful with every word.`],[`${SK.founder} is composed.`,`${SK.founder} is calm.`,`${SK.founder} is steady.`],[`${SK.founder} is getting comfortable and talking more than she needs to.`,`${SK.founder} is relaxed now, and volunteering things.`,`${SK.founder} is talking freely.`],[`${SK.founder} is rattled.`,`${SK.founder} is nervous and it is affecting her answers.`,`${SK.founder} is flustered.`]][G.mood + 2][G.step % 3];
const dealhit = (a, dc, ok, good, great, miss, backfire) => attackWith(a, "dra", dc, ok, good, great, miss, backfire);
const charmhit = (a, dc, ok, good, great, miss, backfire) => attackWith(a, "cha", dc, ok, good, great, miss, backfire);
function attackWith(a, stat, dc, ok, good, great, miss, backfire) {
  let t = roll(a, stat, dc, true);
  if (t === 0 && ((a.sig === "footnote" && !a.sigUsed) || (a.hooks.lucky && !a.luckUsed))) { if (a.sig === "footnote") a.sigUsed = true; else a.luckUsed = true; t = 1; LAST.tier = 1; setTimeout(() => log(`<span class="note">${a.name} catches it a half-second before it becomes a disaster.</span>`), 0); }
  if (t === 4) { mood(1); return great(P[4]); } if (t === 3) { mood(1); return good(P[3]); } if (t === 2) return ok(P[2]); if (t === 1) return miss(); mood(-1); return backfire();
}
const A_KICKOFF = { title: "Kickoff", kind: "office", room: "Kickoff is the first meeting on a deal, where you learn who the buyer is, what they want, and what they are afraid of.", intro: () => `Tuesday. ${SK.co}'s boardroom, forty floors up. ${SK.cl.name} wants to buy ${SK.oppCo}, ${SK.pitch}.`,

        { label: () => `Tell him $${PR().mid} million`, hint: "Give the client a price and stand behind it. A confident number calms a board and gives you something to negotiate toward. It also becomes the number they hold you to. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); G.f.promised = true; G.pat += t >= 2 ? 10 : 3; return `${a.name}: "${PR().mid} million, and more later if the ${SK.product} sells." Your client writes it down. ${SK.cl2.last} writes something else down. <span class="good">Patience +${t >= 2 ? 10 : 3}.</span> <span class="note">You named a number. He will remember it.</span>`; } },
        { label: "Tell him it depends on what is in the files", hint: "Tell him the price depends on what the team finds in the seller's files. Honest, and less satisfying than a number; his patience starts lower, but nothing you find later will feel like you hid it. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 7); tire(a, 2); G.f.honest = true; G.pat += t >= 2 ? 4 : 0; return `${a.name} explains that a founder-run ${SK.product} company has either a clean set of files or an interesting one, and the price should follow. ${SK.cl2.last} nods. Your client does not. ${t >= 2 ? '<span class="good">Patience +4.</span>' : ""} <span class="note">Expectations set low. Good news will land harder.</span>`; } },
        { label: "Ask what he actually wants", hint: "Before talking price, find out why he wants this company at all. Buyers who want a brand negotiate differently from buyers who want a factory, and knowing which tells you what to fight for. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 3); if (t >= 2) { G.f.knowsWhy = true; return `${a.name} asks three questions and your client, who has not been asked a question in this building in years, answers all of them. He does not want the ${SK.product}. He wants the ${SK.contracts}. <span class="note">Now you know what actually matters. Terms fights about the ${SK.product} are noise.</span>`; } return `${a.name} asks. Your client says "synergies." ${SK.cl2.last} looks at the ceiling.`; } },
      ] },
    { title: "The fee", text: () => `${SK.cl2.last}: "The board approved a fee cap. Sixty hours through signing." He says this like someone who has been told to say it. Your client says nothing, because the fee is not his fight, and he has left it to his general counsel, so whatever you say now, you are saying to the person who has to defend the number to the board.`,
      options: [
        { label: "Take the cap", hint: "Agree to the hours he offered. It is tight for a deal this size, but accepting it tells him you respect his money. Patience up, budget tight.", stat: null, who: null, run: () => { G.pat += 6; return `You say sixty is fine. ${SK.cl2.last} relaxes. <span class="good">Patience +6.</span>`; } },
        { label: "Ask for eighty", hint: "Ask for the hours the deal actually needs. Reading a company's files properly takes time, and he would rather pay for it now than discover the problem after closing. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 2); if (t >= 2) { G.hrs += 20; G.pat -= 4; return `${a.name} explains what a real diligence pass costs and what a fake one costs later. ${SK.cl2.last} sighs and says eighty. <span class="good">Budget +20.</span> <span class="warn">Patience −4.</span>`; } G.pat -= 8; return `${a.name} asks. ${SK.cl2.last}: "Sixty." <span class="warn">Patience −8.</span>`; } },
        { label: "Staff it lean", hint: "Keep the junior's hours off the bill. The budget stretches and the junior works for free, which wears on people.", stat: null, who: null, run: () => { G.hrs += 10; G.f.leanStaff = true; tire(team.junior, 10); return `You say the junior will be "learning, not billing." ${SK.cl2.last} likes that. ${team.junior.name} does not. <span class="good">Budget +10.</span> <span class="warn">${team.junior.name} Burnout +10.</span>`; } },
      ] },
    { title: "The other side", text: () => `${SK.oppShort}'s counsel is ${OC.firm}. ${OC.name}. ${counselIntroLine()}`,
      options: [
        { label: () => `Brief the team on ${OC.her}`, hint: () => `Every opposing lawyer has habits. An hour spent learning them means ${OC.hers} favorite trick lands softer when ${OC.she} uses it. Research.`, stat: "res", who: "any", run: a => { tire(a, 3); G.f.knowOC = true; if (OC.id === "kessler") G.f.knowKessler = true; if (OC.id === "pruitt") G.hrs += 4; if (OC.id === "sayle") G.judge = (G.judge || 0) + 1; if (OC.id === "voss") Object.values(team).forEach(x => x.hooks.battle = true); if (OC.id === "ibeh") Object.values(team).forEach(x => x.hooks["+res"] = true); if (OC.id === "tobias") Object.values(team).forEach(x => x.hooks.patience = true); if (OC.id === "venkat") G.f.principalsEasy = true; return `${a.name} walks the team through ${OC.last}'s last three deals. <span class="note">${OC.style}. ${OC.know}</span>`; } },
        { label: () => `Send ${OC.her} a friendly note`, hint: () => `Send opposing counsel a short, civil note. Deals close on trust between the lawyers, and a good relationship now makes ${OC.her} quicker to split differences later. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 1); if (t >= 3) { G.f.civil = true; return `${a.name} sends two lines. ${OC.last} replies in one: "Let's get this done." <span class="note">That is a door left slightly open. ${OC.hers.charAt(0).toUpperCase() + OC.hers.slice(1)} client will be quicker to split differences.</span>`; } return `${a.name} sends two friendly lines. ${OC.last}'s reply is ${OC.hers} signature block.`; } },
        { label: "Get to work", hint: "Skip the courtesies and start on the documents. Saves the hour; the other side's habits stay a surprise.", stat: null, who: null, run: () => `You put ${OC.hers} letter in the file and open the seller's document index. It is 41 pages long.` },
      ] },
  ] };
const A_TERMSHEET = { title: "Term sheet", kind: "deal", room: "The term sheet is the one-page handshake before the long contract, covering price, how it is paid, and who bears the risk if something is wrong.", intro: "Two weeks of edits going back and forth. The term sheet is the one-page handshake before the ninety-page contract, and every line on it is somebody's money.",
  beats: () => [
    { title: () => `How ${SK.cl.last} pays`, text: () => `${OC.last}'s first draft has your client paying $${PR().high} million, all of it on closing day, with no money back if anything turns out to be wrong. Your client wants to know why you're not signing it.`,
      options: [
        { label: "Pay part of it later, only if sales hold up", hint: () => `If the ${SK.product} sells like ${SK.founderFirst} says, ${fshe()} gets the rest. If not, your client keeps it. Shifts risk to ${fher()}. Drafting.`, stat: "dra", who: "any", run: a => { tire(a, 6); G.f.later = true; return dealhit(a, 9,
          p => `${a.name} proposes $${PR().earnBase} million on closing day and $${PR().earnRest} million more later, only if ${SK.oppShort} hits its sales numbers. ${OC.last} argues about how the numbers are counted. You are now arguing about the right thing. ${press(p)}`,
          p => `${a.name} ties the later payment to the ${SK.contracts} your client actually cares about. ${OC.last} does not know that yet. ${press(p)}`,
          p => `${a.name} drafts the later-payment terms so cleanly that ${OC.last} calls to ask who wrote it. ${press(p)} <span class="note">${SK.oppShort}'s banker is annoyed. The terms are tight.</span>`,
          () => `${a.name} proposes paying part later. ${OC.last}: "My client doesn't do that." ${OC.hers.charAt(0).toUpperCase() + OC.hers.slice(1)} client does that. Nothing moves yet.`,
          () => `${a.name}'s sales targets are written loosely, and ${OC.last} redrafts them in ${OC.hers} client's favor before anyone notices. ${kess(6)}`); } },
        { label: "Argue the price down with numbers", hint: "Find what comparable companies actually sold for and show the seller the numbers. A price argument with data behind it is hard to dismiss as haggling. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); const p = [0, 3, 7, 11, 15][t]; press(p); return `${a.name} pulls up what other ${SK.product} companies sold for. There are more than you'd think. ${SK.oppShort}'s asking price is ${t >= 2 ? "hard to defend once the comparisons are on the table" : "high, but not absurd, and " + OC.last + " knows it"}. <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
        { label: "Accept how they want to pay, fight later", hint: "Let the seller have his payment structure. You save your leverage for the fight that matters more: how much money the client can claw back if the company turns out to be broken. Patience up.", stat: null, who: null, run: () => { G.pat += 5; kess(4); G.f.conceded = true; return `You accept all cash at their number as a starting point, which thrills your client and makes ${OC.last} wonder what you are saving your strength for. <span class="k">${OC.last} +4.</span> <span class="good">Patience +5.</span> <span class="note">Everything now rides on the money-back terms and what you find in diligence.</span>`; } },
      ] },
    { title: "The lock-up", text: () => `${OC.last} wants your client to promise not to talk to any other seller for sixty days. Your client wants to know why that's bad. ${SK.cl2.last} knows why that's bad. For sixty days, ${SK.oppShort} can drag its feet and your client can't walk.`,
      options: [
        { label: () => `Thirty days, and your client can walk if he finds something bad`, hint: "Thirty days to look at the books, with the right to walk if something bad turns up. The normal deal, and enough time if the team is quick. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); const p = [0, 2, 5, 8, 10][t]; press(p); return `${a.name} cuts it to thirty days with an exit if diligence turns up something serious. ${OC.last} tries to define "serious" narrowly. ${a.name} defines it back. <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
        { label: "Give the sixty days, get something back", hint: "Give the seller his longer timeline but make him open every file on the first day. More time to find problems, and it costs nothing but a concession he wanted anyway. Charm.", stat: "cha", who: "any", run: a => { tire(a, 4); return charmhit(a, 9,
          p => { G.f.fullRoom = true; return `${a.name} gives sixty days and gets every file in the data room opened on day one. ${press(p)} <span class="note">Diligence just got easier.</span>`; },
          p => { G.f.fullRoom = true; return `${a.name}: "Sixty days, if we see everything by Friday." ${OC.last}: "Define everything." "Everything." ${press(p)} <span class="note">Diligence just got easier.</span>`; },
          p => { G.f.fullRoom = true; return `${a.name} trades sixty days for full access, a management presentation, and the founder's cell number. ${OC.last} laughs, then agrees. ${press(p)} <span class="note">Diligence just got a lot easier.</span>`; },
          () => `${a.name} gives sixty days and asks for the files. ${OC.last}: "In due course." Nothing yet.`,
          () => `${a.name} gives sixty days and gets a thank-you email. ${kess(6)}`); } },
      ] },
    { title: "Money back if something's wrong", text: () => `The real fight. If your client buys the company and then finds a lawsuit nobody mentioned, how much does ${SK.oppShort} pay back? ${OC.last} proposes a limit of 5% of the price, and nothing at all unless the problem costs more than $1 million.`,
      options: [
        { label: "Up to 15% back, with 10% parked in a locked account", hint: "Cap what the seller must pay back at fifteen percent of the price, and park ten percent in an account neither side can touch. If the company has problems, the money is there instead of in the seller's boat. Aggressive but normal. Drafting.", stat: "dra", who: "any", run: a => { tire(a, 7); return dealhit(a, 10,
          p => `${a.name} asks for up to 15% back, with 10% of the price held in a locked account for eighteen months. ${OC.last} comes back at 8 and 5. You are somewhere in the middle and the middle is fine. ${press(p)}`,
          p => `${a.name} attaches a memo showing what other buyers got on deals this size. ${OC.last} does not argue with the memo. ${OC.She} knows it is right. ${press(p)} ${rec(4)}`,
          p => `${a.name}: "Fifteen back, ten locked up, eighteen months, and ${SK.oppShort} pays for anything we find in diligence, dollar for dollar." ${OC.last}: "Anything you find?" "Anything." Long pause. ${press(p)} <span class="note">${OC.She} just told you there is something to find.</span>`,
          () => `${a.name} proposes 15 and 10. ${OC.last} proposes 5 and 3 again, with the same cover email. Neither side moves.`,
          () => `${a.name} asks for too much and ${OC.last} uses it to reopen the price. ${kess(7)}`); } },
        { label: "Take less money back, but for a longer time", hint: "Take a smaller cap on what the seller pays back, but make the protection last three years instead of one. Problems in a business like this surface slowly, and a promise that expires in a year is worth little. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); const p = [0, 2, 5, 8, 11][t]; press(p); if (t >= 2) G.f.longSurvival = true; return `${a.name} accepts a lower cap on the money back but gets the promises to last three years instead of one. ${t >= 2 ? `Things go wrong in ${SK.product} slowly.` : OC.last + " cuts it to eighteen months in the next turn."} <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
        { label: () => `Let your client call ${SK.founderFirst} himself`, hint: "Step back and let the two owners talk to each other directly. Founders often say yes to each other when they will not say yes to counsel. It can also blow up, so prepare the client well. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", G.f.principalsEasy ? 8 : 10); tire(a, 3); if (t >= 3) { press(12); mood(1); return `${a.name} preps your client for eleven minutes. Your client and ${SK.founder} talk for forty. They agree the money-back terms over the phone and ${OC.last} finds out by email. <span class="good">${CASE.lbl.you} +12.</span> <span class="note">${SK.founderFirst} liked him. That will matter.</span>`; } if (t >= 2) { press(3); return `Your client calls ${SK.founderFirst}. It is pleasant and nothing is decided. <span class="good">${CASE.lbl.you} +3.</span>`; } kess(8); G.pat -= 5; return `Your client calls ${SK.founderFirst} and agrees to something he does not understand. ${a.name} spends the afternoon unwinding it. <span class="k">${OC.last} +8.</span> <span class="warn">Patience −5.</span>`; } },
      ] },
    { title: "Signing the term sheet", text: () => `The one-page handshake is ready. ${OC.last} wants it signed today. ${SK.cl2.last} wants to sleep on it. Your client has already told his board it's done.`,
      options: [
        { label: "Sign", hint: "Sign the term sheet as it stands. The board gets its announcement tonight, patience goes up, and every fight you skipped comes back at the purchase agreement with the other side holding a signed page.", stat: null, who: null, run: () => { G.pat += 8; return `It is signed. Your client sends a one-word email to his board: "Done." The ninety-page contract has not been written yet. <span class="good">Patience +8.</span>`; } },
        { label: "One more read", hint: "Read the term sheet once more before anyone signs. Something is always wrong in a document six people have edited, and finding it now is cheap. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); G.hrs -= 1; if (t >= 3) { press(6); return `${a.name} finds that the way the contract counts the cash already sitting in the company would have cost your client four million on closing day. ${OC.last}: "Typo." <span class="good">${CASE.lbl.you} +6.</span> Budget −1.`; } if (t >= 2) { press(2); return `${a.name} finds two typos and one thing that was not a typo. Fixed. <span class="good">${CASE.lbl.you} +2.</span> Budget −1.`; } G.pat -= 3; return `${a.name} reads it again and it is fine, and your client asks why that took a day. <span class="warn">Patience −3.</span> Budget −1.`; } },
      ] },
  ] };
const A_DILIGENCE = { title: "Due diligence", kind: "deal", room: "Due diligence is reading everything about the company being bought, in an online folder of the seller's own files called the data room. The point is to find the problems before you pay for them.", intro: () => `The data room holds four thousand of ${SK.oppShort}'s documents in an online folder. Somewhere in there is the reason ${SK.oppShort} is for sale.`,
  beats: () => [
    { title: "The index", text: () => `Forty-one pages of folder names. "Legal," "Legal (old)," "Legal_FINAL," and one named "Misc" with 900 files in it. ${G.f.fullRoom ? "Everything is open, at least." : "Half the folders are still locked."}`,
      options: [
        { label: "Read Misc first", hint: "Start with the folder labeled Miscellaneous. Sellers file the awkward documents where nobody looks, and that folder is usually where the problem lives. Slow. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", G.f.fullRoom ? 8 : 10); tire(a, 7); G.hrs -= 3; if (t >= 3) { if (!live("sk_recall")) return `${a.name} looks hard. There is nothing left to find that you have not already found.`; G.f.sk_recall = true; return `${a.name} finds a PDF named "${SK.recallFile}." ${SK.recallText || `It is a notice pulling the ${SK.line} off shelves, dated last spring. It was never sent.`} ${rec(10)} <span class="note">Nobody outside ${SK.oppShort} knows about this. Now you do.</span> Budget −3.`; } if (t >= 2) return `${a.name} maps Misc. Three folders in it should have been in Legal. ${rec(5)} Budget −3.`; return `${a.name} reads Misc for six hours. It is mostly menus. Budget −3.`; } },
        { label: "Have the junior build the question list", hint: "Have the junior draft the list of questions for the seller. Cheap hours, and a thorough list forces the seller to answer things in writing that he would rather say vaguely on a call. Junior.", stat: "res", who: "junior", run: a => { const t = roll(a, "res", 9); tire(a, 6); if (t >= 3) { if (!live("sk_customer")) return `${a.name} looks hard. There is nothing left to find that you have not already found.`; G.f.sk_customer = true; return `${a.name}'s list is 212 questions and number 140 asks whether any big customer can cancel its contract if ${SK.oppShort} is sold. Two can. ${rec(9)} <span class="note">The ${SK.contracts} your client wants can walk out the door the day he buys the company. Now you know.</span>`; } if (t >= 2) return `${a.name}'s list is thorough. ${OC.last} answers it, slowly. ${rec(5)}`; return `${a.name} builds a list. ${OC.last} refuses half of it as "not normal." Some of it was not normal.`; } },
        { label: "Skim the numbers, move on", hint: "Take the banker's summary of the company at face value and move on. Saves hours of reading, and the banker is paid by the seller to make the company look like the summary.", stat: null, who: null, run: () => { G.hrs += 3; return `You read the banker's slides. They are good slides. <span class="good">Budget +3.</span> <span class="note">You have no idea what is in Misc.</span>`; } },
      ] },
    { title: "Management presentation", text: () => `${SK.founder} presents to your client's team for two hours. ${fShe()} is charming, exact about the ${SK.product}, and vague about everything else. ${founderMood()}`,
      options: [
        { label: () => `Ask about the ${SK.vendorType}`, hint: "A supplier keeps showing up in the numbers and nobody has mentioned it. Ask what the relationship is. Quiet suppliers sometimes turn out to be where the real business lives. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { if (!live("sk_copacker")) return `${a.name} asks. There is nothing left to find that you have not already found.`; G.f.sk_copacker = true; mood(1); return `${a.name}: "Who is ${SK.vendor}?" A pause. "A former partner." "Former since?" "There's a dispute." The dispute is a letter demanding $3.2 million, which nobody put in the files. ${rec(9)}`; } mood(-1); return `${a.name} asks about the ${SK.vendorType}. ${SK.founderFirst}: "Standard supplier relationship." ${OC.last} moves the presentation along.`; } },
        { label: () => `Let ${fher()} talk about the ${SK.product}`, hint: "Let the seller's people talk about the product they love. People who are proud of their work tell you things about it that a data room never would. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); if (t >= 3) { mood(2); G.f.founderLikes = true; return `${a.name} asks about the ${SK.ip} and ${SK.founderFirst} talks for twenty minutes. Somewhere in minute fourteen ${fshe()} mentions "the year we almost had to pull ${SK.line}." ${rec(6)} <span class="note">${fShe()} likes ${a.name}. ${fShe()} will keep talking.</span>`; } if (t >= 2) { mood(1); return `${a.name} gets ${SK.founderFirst} talking. Nothing damaging, but ${fshe()} is relaxed now.`; } return `${a.name} asks about the ${SK.product}. ${SK.founderFirst} gives the investor version.`; } },
        { label: "Ask about the factory", hint: "Ask about the buildings and the machinery: permits, inspections, and whether anything has ever leaked. The dullest part of diligence, and the one that costs the most when it is wrong. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 4); if (t >= 2) { if (!live("sk_plant")) return `${a.name} asks. There is nothing left to find that you have not already found.`; G.f.sk_plant = true; return `${a.name} asks about the ${SK.plant}'s ${SK.permit}. ${SK.founderFirst} looks at ${OC.last}. ${OC.last}: "We'll get you the file." The file, when it comes, has a government violation notice in it. ${rec(8)}`; } return `${a.name} asks about permits. "All current."`; } },
      ] },
    { title: "The founder's cell", text: () => `${G.f.founderLikes ? `${SK.founderFirst} texts ` + team.brain.name + " directly: 'Can we talk without the lawyers?'" : `${SK.founderFirst}'s assistant calls to set up a 'quick chat' with your client, no lawyers.`} ${OC.last} would not approve. ${OC.last} does not know.`,
      options: [
        { label: "Take the call, carefully", hint: "Take the seller's call yourself. A direct conversation can move things faster than a week of drafts, as long as you say nothing your client has not approved. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 3) { if (!live("sk_ip")) return `${a.name} asks. There is nothing left to find that you have not already found.`; G.f.sk_ip = true; mood(1); return `${a.name} takes the call with ${SK.cl2.last} on the line. ${SK.founderFirst}, tired, says the thing ${fshe()} has been not saying: ${SK.ipText || `${fhers()} brother wrote the ${SK.ip} and never signed them over to the company.`} ${rec(11)} <span class="note">${SK.oppShort} may not own its own ${SK.ip}. That is a price conversation.</span>`; } if (t >= 2) { press(4); return `${a.name} takes the call. ${SK.founderFirst} wants to know if your client will keep the ${SK.plant} open. ${a.name} says the right thing. <span class="good">${CASE.lbl.you} +4.</span>`; } kess(5); return `${a.name} takes the call and ${SK.founderFirst}, later, tells ${OC.last} what was said. ${OC.last}'s next email is about "appropriate channels." <span class="k">${OC.last} +5.</span>`; } },
        { label: "Send it back through the lawyers", hint: "Route the seller back through the lawyers on the other side. Slower by days, and nothing gets said on the phone that your client has not approved and cannot take back.", stat: null, who: null, run: () => { press(2); return `You forward it to ${OC.last} with "Happy to set up a call with everyone." ${OC.She} replies within the minute. <span class="good">${CASE.lbl.you} +2.</span> <span class="note">Whatever ${SK.founderFirst} wanted to say, ${fshe()} won't now.</span>`; } },
      ] },
    { title: "The diligence memo", text: () => `${SK.cl2.last} wants the memo by Friday. Your client wants it to say "clean." It ${["sk_recall", "sk_copacker", "sk_customer", "sk_plant", "sk_ip"].filter(k => G.f[k]).length >= 3 ? "is not going to say clean." : "might."}`,
      options: [
        { label: "Write it straight", hint: () => `Everything you found, ranked by dollars. Your client may not like it. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 6); G.hrs -= 2; const found = ["sk_recall", "sk_copacker", "sk_customer", "sk_plant", "sk_ip"].filter(k => G.f[k]).length; G.f.memoStraight = true; if (found >= 2) { G.pat -= 6; press(6); return `${a.name} writes it straight. ${found} problems, ranked by what they'd cost. Your client reads it in silence and then says "so what's it worth now." <span class="warn">Patience −6.</span> <span class="good">${CASE.lbl.you} +6.</span>`; } G.pat += 5; return `${a.name} writes it straight. There is not much in it. Either the company is clean or the team did not dig far enough. <span class="good">Patience +5.</span>`; } },
        { label: "Write it optimistic", hint: () => `Give your client what he wants. Patience up now, risk later.`, stat: null, who: null, run: () => { G.pat += 10; G.f.memoSoft = true; return `The memo says "manageable" four times. Your client forwards it to the board. <span class="good">Patience +10.</span> <span class="note">If any of this goes wrong at closing, it will be your memo they read aloud.</span>`; } },
      ] },
  ] };
const A_PA = { title: "The contract", kind: "deal", room: "The purchase agreement is the long contract. Every clause is about who pays when something you cannot predict goes wrong after closing.", intro: "Ninety pages. Every one of them is a fight about who pays when something you can't predict goes wrong.",
  beats: () => [
    { title: "The seller's promises", text: () => `The contract has ${SK.oppShort} promise things about the business, that there are no lawsuits, no ${SK.recallWord}s, and that they own their ${SK.ip}. ${OC.last}'s draft puts "as far as we know" in front of every one of them. If the seller genuinely did not know, your client is the one who pays for it. There is a lawsuit, and the seller knows about it.`,
      options: [

          p => `${a.name} sends the marked-up contract with the diligence memo attached, unprompted. ${OC.last} calls. "You've been thorough." "We have." ${press(p + bonus)} <span class="note">${OC.She} knows you know.</span>`,
          () => `${a.name} strikes "as far as we know" everywhere. ${OC.last} puts it all back with a note: "Not normal." Some of it was normal.`,
          () => `${a.name}'s changes are too aggressive and ${OC.last} uses it to slow the deal a week. ${kess(6)} Your client asks what the holdup is.`); } },
        { label: () => `Make ${SK.oppShort} pay dollar for dollar on the known problems`, hint: "Let the seller keep the soft promises, but make the specific problems you found the seller's responsibility dollar for dollar, with no cap. You give up the general fight to win the one you can prove. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); const found = ["sk_recall", "sk_copacker", "sk_customer", "sk_plant", "sk_ip"].filter(k => G.f[k]); if (found.length && t >= 2) { G.f.specialIndem = true; const p = 5 + found.length * 3; press(p); return `${a.name} drafts a clause for ${found.length === 1 ? "the one thing" : "the " + found.length + " things"} you found, under which ${SK.oppShort} pays every dollar, with no cap and no minimum. ${OC.last} negotiates the wording, not the idea. <span class="good">${CASE.lbl.you} +${p}.</span> <span class="note">Anything you found is now ${SK.oppShort}'s problem, not your client's.</span>`; } return `${a.name} proposes it. Without a specific problem to point at, ${OC.last} declines. <span class="note">You needed to find something first.</span>`; } },
      ] },
    { title: "The list of exceptions", text: () => `Every promise comes with a list of exceptions: "no lawsuits, except the ones on this list." Anything on the list is your client's problem after closing. ${OC.id === "kessler" ? OC.last + " has not sent the list. \"In process.\" It is Thursday." : OC.last + " sends the list, 60 pages of it, with a dozen items that just say \"see attached\" and nothing attached."}`,
      options: [
        { label: () => OC.id === "kessler" ? "Refuse to trade another draft until you have the list" : "Send it back and refuse to trade drafts until the gaps are filled", hint: () => OC.id === "kessler" ? "Refuse to exchange another draft until the seller produces the list you asked for. A hard line costs a few days and tells the other side the lists matter. Drafting." : "Refuse to exchange another draft until the seller fills in every item that says \"see attached.\" A hard line costs a few days and tells the other side the lists matter. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); G.hrs -= 2; if (t >= 2) { G.f.schedulesEarly = true; press(5); return `${a.name} stops the clock and sends nothing back until the ${OC.id === "kessler" ? "list" : "complete list"} arrives. ${OC.last} sends ${OC.id === "kessler" ? "it" : "the missing pages"} Monday. Item 3.12 is ${G.f.sk_copacker ? `the ${SK.vendorType} dispute you already knew about` : `a ${SK.vendorType} dispute nobody mentioned`}. <span class="good">${CASE.lbl.you} +5.</span> ${rec(6)} Budget −2.`; } G.pat -= 4; return `${a.name} stops the clock. Your client calls to ask why. Budget −2. <span class="warn">Patience −4.</span>`; } },
        { label: () => OC.id === "kessler" ? "Build your own list while you wait" : `Read every line of what ${OC.she} sent`, hint: () => OC.id === "kessler" ? "Pull the exception list from a comparable deal and mark what you expect to see. When hers finally arrives, anything missing or oddly worded will stand out. Research." : "Anything listed is your client's problem after closing, so read all sixty pages and find what is hiding in them. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 6); if (t >= 3) { G.f.schedulesRead = true; press(8); return `${OC.id === "kessler" ? `When the list finally arrives, ${a.name} knows exactly where to look and finds` : `${a.name} finds`}, on page 41, one line: "a potential product quality matter, resolved." That is a ${SK.recallWord}. ${OC.last} listed it in the fewest words that would still count as listing it. <span class="good">${CASE.lbl.you} +8.</span> ${rec(7)}`; } if (t >= 2) return `${a.name} reads all sixty pages. Nothing surprising, or nothing found. ${rec(3)}`; kess(5); return `${a.name} skims. Something on page 41 goes unread. <span class="k">${OC.last} +5.</span>`; } },
      ] },
    { title: "What happens if the government objects", text: () => `Big deals get reviewed by antitrust regulators, the government lawyers who decide whether a sale leaves customers with too few choices. ${OC.last} wants your client to promise to close no matter what the government says. Your client's antitrust lawyer, on the phone, makes a noise.`,

        { label: () => `Refuse. Offer a fee if your client walks instead`, hint: () => `Your client pays them a few percent if he backs out. Normal. Drafting.`, stat: "dra", who: "any", run: a => { tire(a, 5); return dealhit(a, 9,
          p => `${a.name} strikes the promise and offers a 3% walk-away fee. ${OC.last} asks for 6. You land at 4. ${press(p)}`,

        { label: "Accept it. The deal is small enough", hint: "Accept the promise to close regardless. The deal is small enough that regulators probably will not look, and if they do, your client is bound to close anyway and finds out what that costs after he owns it. Patience up.", stat: null, who: null, run: () => { G.pat += 5; G.f.hohw = true; return `You accept. Your client's antitrust lawyer makes the noise again. <span class="good">Patience +5.</span> <span class="note">If a regulator so much as sneezes, your client is stuck.</span>`; } },
      ] },
    { title: "The last draft", text: () => `Draft 11. ${OC.last} sends it at 11:52 p.m. with "clean, I think."`,
      options: [
        { label: "Compare it against draft 10, line by line", hint: "Compare the signing draft against the last one you approved, line by line. Tedious, and the only way to know what changed at midnight. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", OC.id === "ibeh" && !G.f.knowOC ? 10 : 8); tire(a, 6); if (t >= 3) { press(8); return `${a.name} runs the comparison and finds that the definition of what the seller has to pay for no longer covers the profits your client would have made. It did in draft 10. ${OC.last}: "Oversight." <span class="good">${CASE.lbl.you} +8.</span>`; } if (t >= 2) { press(3); return `${a.name} finds two changes that were not flagged. Both fixed. <span class="good">${CASE.lbl.you} +3.</span>`; } kess(7); return `${a.name} skims the comparison. Something in the definitions has changed. <span class="k">${OC.last} +7.</span> <span class="note">You will find out what at closing.</span>`; } },
        { label: () => `Trust it, send it to ${SK.cl2.last}`, hint: "Trust that the other side made only the changes they said they made. Saves the hour at 1 a.m., and whoever edited the draft was as tired as you are, so anything else in there is the deal now.", stat: null, who: null, run: () => { alive().forEach(a => a.burn = Math.max(0, a.burn - 5)); kess(5); return `You send the draft on without reading it again and everyone gets a night's sleep. What that costs, you will not see until later. <span class="k">${OC.last} +5.</span> <span class="good">Team Burnout −5.</span>`; } },
      ] },
  ] };
const A_CLOSING = { title: "Signing and closing", kind: "closing", room: "Closing is the day the money moves. Everything has to be true and signed at once, and anything left unfinished shows up here.", intro: "A conference room with too many people in it, a bank transfer that has not landed, and a piece of paper nobody wants to sign.",

      { title: "Still true today?", text: () => `${OC.last} sends the last document, the one ${SK.oppShort} signs to say every promise in the contract is still true as of this morning. ${G.f.specialIndem ? "The dollar-for-dollar clauses are in. Whatever you found is priced." : ""} ${G.f.memoSoft ? `${SK.cl2.last} has your memo open on his laptop. The word 'manageable' is highlighted.` : ""}`,
        options: [

          { label: "Sign", hint: "Sign. Everyone in the room is waiting for it, the client gets his company, and whatever is in the document is the deal, whether or not anyone read it.", stat: null, who: null, run: () => `Everyone signs and everyone is relieved. The money has still not landed.` },
        ] },
      { title: "What was in the room", text: () => hit && !G.f[hit] ? `Forty minutes before the money moves, ${SK.cl2.last} gets a call. From a reporter. About ${sk[hit][0]}. ${OC.last} does not look surprised. You did not find it.` : `Nothing surfaces. ${unfound.length ? "Not because there was nothing there: because you found it." : `You found all of it. ${SK.founderFirst} looks almost relieved.`} ${OC.last} looks like someone who expected a different afternoon.`,
        options: hit && !G.f[hit] ? [
          { label: "Renegotiate on the spot", hint: "Use the last-minute surprise as leverage and reopen the price on the spot. Sellers who want to close today will give up money to do it. Drafting.", stat: "dra", who: "any", run: a => { tire(a, 6); G.f.lateHit = sk[hit][1]; return dealhit(a, 10,
            p => `${a.name} drafts a clause in the hallway making ${SK.oppShort} pay for it, dollar for dollar. ${OC.last} has no room to argue and knows it. ${press(p)} <span class="note">It is still bad, but now it has a price.</span>`,
            p => `${a.name}: "Price comes down or we walk." ${OC.last} makes a call. Price comes down. ${press(p)}`,
            p => `${a.name} produces a term sheet amendment so fast ${OC.last} suspects it was pre-drafted. It was not. ${press(p + 4)}`,
            () => { kess(sk[hit][1]); return `${a.name} tries to renegotiate. ${OC.last}: "You had sixty days." ${kess(0)}<span class="k">${OC.last} +${sk[hit][1]}.</span>`; },
            () => { kess(sk[hit][1] + 4); G.pat -= 8; return `${a.name} tries and your client, panicking, waves it off: "Just close it." ${kess(0)}<span class="k">${OC.last} +${sk[hit][1] + 4}.</span> <span class="warn">Patience −8.</span>`; }); } },
          { label: () => `Advise your client to walk`, hint: "Tell the client not to sign. The firm loses the closing fee and the client keeps his money. The kind of advice clients remember. Reputation.", stat: null, who: null, run: () => { G.f.walked = true; return `You tell your client, in front of everyone, that he should not sign today. Everyone at the table is uncomfortable. ${SK.cl2.last} agrees with you. <span class="note">This will cost you the closing fee.</span>`; } },
          { label: "Close anyway", hint: () => `Your client wants his ${SK.product} company. Patience up, exposure later.`, stat: null, who: null, run: () => { kess(sk[hit][1] + 6); G.pat += 6; G.f.closedDirty = true; return `You close. ${kess(0)}<span class="k">${OC.last} +${sk[hit][1] + 6}.</span> <span class="good">Patience +6.</span> <span class="note">Your client owns ${sk[hit][0]} now.</span>`; } },

          { label: "Squeeze one more point", hint: "Ask for one more concession at the table. Greedy, and the other side is as tired as you are and wants to go home. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "cha", 11); tire(a, 3); if (t >= 3) { press(8); return `${a.name} asks for the locked-up money to be released two months sooner in exchange for closing today. ${OC.last}, exhausted, says fine. ${press(0)}<span class="good">${CASE.lbl.you} +8.</span>`; } if (t >= 2) return `${a.name} asks. ${OC.last} laughs. You close anyway.`; kess(5); G.pat -= 4; return `${a.name} asks and ${OC.last}, offended, pushes the release date the other way. ${kess(0)}<span class="k">${OC.last} +5.</span> <span class="warn">Patience −4.</span>`; } },

const hallMood = () => [`${SK.cl.last} is answering every question with a shorter question.`, `${SK.cl.last} is clipped and precise.`, `${SK.cl.last} is composed.`, `${SK.cl.last} has started explaining things nobody asked about.`, `${SK.cl.last} is talking like she is still on the ${SK.desk} and everyone else is slow.`][G.mood + 2];
