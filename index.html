const SQ_INTAKE = { title: "Intake", kind: "office", room: "Intake for a family fight, brought by a shareholder who owns part of the company and is being frozen out by the people who run it.", intro: () => `She comes to your office. ${SK.cl.name} owns ${PCT()} of ${SK.co}, the family company. ${ucf(KH())} own the rest and run it. Her dividend checks stopped eighteen months ago. ${ucf(KP())} salaries did not.`,
  beats: () => [
    { title: () => `The ${SIS()}`, text: () => `Your client has a folder of dividend statements and ${SK.photo || "a photograph of her father cutting a ribbon"}. "I don't want to destroy the company," she says. "I want what's mine." She has said this to three lawyers before you.`,
      options: [
        { label: "Tell her it's a strong case", hint: "Tell her she has a strong case. Squeezed-out shareholders usually do, and hearing it calms her. It also becomes the thing she remembers if the numbers come back smaller than she hoped. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); G.f.promised = true; G.pat += t >= 2 ? 10 : 3; return `${a.name}: "${ucf(PCTW())} is ${PCTW()}. The law is on your side." She cries, briefly. <span class="good">Patience +${t >= 2 ? 10 : 3}.</span> <span class="note">You promised. Family cases have a way of testing promises.</span>`; } },
        { label: "Tell her it will get ugly", hint: () => `Tell her the truth, that family cases get personal and ${KH()} will use everything. Her patience starts lower, but nothing they do later will surprise her. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 7); tire(a, 2); G.f.honest = true; G.pat += t >= 2 ? 4 : 0; return `${a.name} explains what a family lawsuit does to Thanksgiving. Your client: "Thanksgiving is already gone." ${t >= 2 ? '<span class="good">Patience +4.</span>' : ""} <span class="note">Expectations set low. Good news will land harder.</span>`; } },
        { label: "Ask what she actually wants", hint: "Before talking strategy, find out what she actually wants, whether that is money, a seat at the table, or an apology. Each one is a different case, and you want to be trying the right one. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 3); if (t >= 2) { G.f.knowsWhy = true; return `${a.name} asks three questions. She does not want dividends. She wants out, at a fair price, and she wants ${KH()} to have to say the number out loud. <span class="note">A buyout is the target. Mediation is where that happens.</span>`; } return `${a.name} asks. Your client says "fairness" four times but never says a number.`; } },
      ] },
    { title: "The budget", text: () => `Your client is paying this herself. ${SK.payLine || `She has savings and a husband who is "supportive, within reason."`} Sixty hours. She says it like a question.`,
      options: [
        { label: "Sixty is fine", hint: "Accept the hours she offered. Not quite enough for a case built on reading the company's books, but agreeing tells her you respect her money. Patience up, budget tight.", stat: null, who: null, run: () => { G.pat += 6; return `You say sixty is fine. <span class="good">Patience +6.</span>`; } },
        { label: "Ask the company to advance her fees", hint: () => `Ask the company itself to pay her legal fees, which minority shareholders can sometimes demand. It buys hours out of ${KP()} pockets, and they will fight it. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 3); if (t >= 2) { G.hrs += 15; kess(4); return `${a.name} finds the clause in the shareholder agreement. The company advances fees, under protest, in a letter with four exclamation points. <span class="good">Budget +15.</span> <span class="k">${OC.last} +4.</span>`; } G.pat -= 5; return `${a.name} asks the company to advance her fees and ${KTH()} refuse by return email, which embarrasses your client more than it should. <span class="warn">Patience −5.</span>`; } },
        { label: "Staff it lean", hint: "Keep the junior's hours off the bill. The budget stretches and the junior works for free, which wears on people.", stat: null, who: null, run: () => { G.hrs += 10; G.f.leanStaff = true; tire(team.junior, 10); return `You say the junior will be "learning, not billing." <span class="good">Budget +10.</span> <span class="warn">${team.junior.name} Burnout +10.</span>`; } },
      ] },
    { title: () => `${ucf(KP())} counsel`, text: () => `${ucf(KTH())} have hired ${OC.name} of ${OC.firm}. ${counselIntroLine()}`,
      options: [
        { label: () => `Brief the team on ${OC.her}`, hint: () => `Every opposing lawyer has habits. An hour spent learning them means ${OC.hers} favorite trick lands softer when ${OC.she} uses it. Research.`, stat: "res", who: "any", run: a => { tire(a, 3); G.f.knowOC = true; if (OC.id === "kessler") G.f.knowKessler = true; if (OC.id === "pruitt") G.hrs += 4; if (OC.id === "sayle") G.judge = (G.judge || 0) + 1; if (OC.id === "voss") Object.values(team).forEach(x => x.hooks.battle = true); return `${a.name} walks the team through ${OC.last}'s last three of these. <span class="note">${OC.style}. ${OC.know}</span>`; } },
        { label: () => `Send ${OC.her} a note proposing early mediation`, hint: "Propose mediation before anyone files anything. Family cases almost always settle, and the side that suggests it first looks reasonable to the mediator and the judge. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 1); if (t >= 3) { G.f.civil = true; press(3); return `${a.name} proposes mediation before anyone spends real money. ${OC.last}: "My clients are open to it." <span class="good">${CASE.lbl.you} +3.</span> <span class="note">The mediation will start warmer.</span>`; } return `${a.name} proposes mediation. ${OC.last}: "Premature."`; } },
        { label: "Get to work", hint: "Skip the courtesies and start on the documents. Saves the hour; the other side's habits stay a surprise.", stat: null, who: null, run: () => `You put ${OC.hers} letter in the file and ask your client for every financial statement she has ever received. There are not many.` },

const SQ_BOOKS = { title: "The books", kind: "paper", room: "The books are the company's financial records, covering what it owns, what it owes, what it earns, and what it spends, down to individual payments. A shareholder has a legal right to inspect them. You are looking for money that left the company sideways, through salaries, rent, and perks, instead of reaching the owners as dividends.", intro: () => `Your client asks for the books. ${ucf(KTH())} refuse. A judge orders them to hand everything over in three weeks. They take five.`,

      options: [
        { label: "Prove the salaries are disguised dividends", hint: () => `Show that ${KP()} salaries jumped exactly when the dividends stopped. If pay replaced dividends, it was a way of taking her share, and that is the whole case. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", G.f.goodAcct ? 8 : 10); tire(a, 5); if (!live("sq_salary")) return `${a.name} runs the numbers. The raises track what people in those jobs are paid elsewhere. There is nothing unusual in them.`; if (t >= 2) { G.f.sq_salary = true; press(9); return `${a.name} lines up the raises against comparable companies. ${ucf(KTH())} are paid like executives at a company four times the size. <span class="good">${CASE.lbl.you} +9.</span> ${rec(8)}`; } return `${a.name} lines the raises up against pay at similar companies. ${OC.last} has a better set of companies to line them up against.`; } },
        { label: "Demand the board minutes approving the raises", hint: "Demand the board minutes that approved the raises. Companies are supposed to record decisions like that. If there are none, the raises were never properly approved, which is its own problem for them. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); if (t >= 2) { press(6); G.f.noMinutes = true; return `There are no minutes. The raises were approved by ${KTH()}, in a hallway, to each other. <span class="good">${CASE.lbl.you} +6.</span> ${rec(6)}`; } return `${OC.last} produces minutes. They are dated last week. ${a.name} notes the font.`; } },
      ] },
    { title: "The building", text: () => `${SK.co} pays rent on its headquarters to a separate company, an LLC. The state paperwork for that LLC lists ${SK.bro} as its contact. The rent went up 40% the year the dividends stopped.`,
      options: [
        { label: "Get a market appraisal of the building", hint: () => `Get an independent appraisal of the building the company rents from ${KTH()}. If the rent is far above market, it is another way money left the company without reaching her. Costs budget. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); G.hrs -= 3; if (!live("sq_lease")) return `The appraisal comes back and the rent is defensible. The building is nicer than it looks. Budget −3.`; if (t >= 2) { G.f.sq_lease = true; press(8); return `The appraisal says a building like that rents for 60% of what ${SK.co} pays. The difference goes to ${SK.bro}'s LLC. <span class="good">${CASE.lbl.you} +8.</span> ${rec(7)} Budget −3.`; } return `The appraiser is cautious and the report is a range. Budget −3.`; } },
        { label: "Trace the LLC's owners", hint: () => `Trace who owns the company the rent goes to. It is public records work, cheap and dull, and the answer is probably ${KH()}. Junior.`, stat: "res", who: "junior", run: a => { const t = roll(a, "res", 8); tire(a, 4); if (!live("sq_lease")) return `${a.name} traces it. ${SK.llcShared || "The LLC is owned by all three siblings equally, from the father's estate."} Your client had forgotten. There is nothing here.`; if (t >= 2) { G.f.sq_lease = true; press(6); return `${a.name} pulls the filings. The LLC is 100% ${SK.bro}. He is his own landlord and he charges himself a lot. <span class="good">${CASE.lbl.you} +6.</span> ${rec(5)}`; } return `${a.name} pulls the filings. The LLC is owned by another LLC. That one is in Delaware.`; } },
      ] },
    { title: "The airplane", text: () => `There is a line item for "corporate aircraft." ${SK.co} makes ${SK.product}. Nobody can think of a reason it needs a plane.`,
      options: [
        { label: "Subpoena the flight logs", hint: "Get a court order (a subpoena) for the company plane's flight logs. Where the plane went says who used it and for what, and business travel to ski towns is hard to explain. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); if (!live("sq_plane")) return `The logs show trade shows, supplier visits, and one funeral, all of it boring and all of it legitimate. There is nothing in the plane.`; if (t >= 2) { G.f.sq_plane = true; press(8); return `The logs: Aspen eleven times, Cabo four, and one trade show. <span class="good">${CASE.lbl.you} +8.</span> ${rec(7)} <span class="note">The mediator will want to see this, and so would a judge.</span>`; } return `${OC.last} produces logs with the destinations redacted "for security."`; } },
        { label: () => `Ask the ${SIS()} where the plane goes`, hint: "Ask your client where the plane goes. Family members know things the logs do not say. Cheaper than a subpoena, and the judge will only hear it if she is willing to say it under oath. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); if (!live("sq_plane")) return `Your client: "Trade shows, mostly. I flew on it once." There is nothing in the plane.`; if (t >= 2) { G.f.sq_plane = true; press(5); return `Your client: "${SK.bro}'s son's lacrosse tournaments." She has photos. From Instagram. <span class="good">${CASE.lbl.you} +5.</span> ${rec(4)}`; } return `Your client does not want to talk about the plane.`; } },
      ] },
  ] };
const SQ_DEPO = { title: () => `Deposition of ${SK.bro}`, kind: "depo", room: () => `A deposition of the ${KIN()} who runs the company, under oath, with his ${SIS()} in the room.`, intro: () => `Conference room 6A. ${SK.bro}, who runs the company, has brought his own coffee and a legal pad he will not write on.`,
  beats: () => [
    { title: () => `The ${KIN()}`, text: () => `${SK.bro} is sworn in. He looks at your client, who is sitting in, for a long second. Then at you. ${broMood()}`,
      options: [
        { label: () => SK.elderLabel || "Start with the father", hint: () => `${SK.elderHint || "Open the deposition with his father, the man who built the company. He loved him too"}, and a witness who is remembering is not a witness who is defending himself. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 3); if (t >= 2) { mood(1); press(3); return `${a.name} asks about ${SK.photoShort || "the ribbon-cutting photograph"}. ${SK.bro} talks for six minutes and stops looking at his lawyer. <span class="good">${CASE.lbl.you} +3.</span> <span class="note">He is talking freely.</span>`; } return `${a.name} asks about ${SK.elderShort || "the father"}. ${SK.bro}: "What does that have to do with anything." Nothing has moved yet.`; } },
        { label: "Start with the salary", hint: "Go straight at the salary. He has an answer ready and will dig in, but you get his defense on the record early, where it can be checked. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 8); G.f.hostile = true; return attack(a, 9, p => `${a.name} asks what he made last year. He says a number. It is not the number in the returns. ${press(p)} <span class="note">The room is hostile from here.</span>`, p => `${a.name} asks about the raise. ${SK.bro}: "I earned it." "From whom?" ${press(p)}`, p => `${a.name} reads the number. ${SK.bro}: "That includes bonus." "Who approved the bonus?" A pause. ${press(p)}`, () => `${SK.bro}: "I don't recall." He says it four times. The room is hostile and you have nothing to show for it.`, () => `${a.name} pushes and ${SK.bro} delivers a speech about carrying the company on his back while his ${SIS()} "did whatever she does." It is ugly and it is on the record, and ${OC.last} is not unhappy. ${kess(6)}`); } },
        { label: "Ask about the day the dividends stopped", hint: "Make him say exactly when the dividends stopped and why. Once the date is fixed on the record, every explanation that does not fit it looks like a story. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { G.f.timeline = true; return `${a.name} gets him to commit to a month, a meeting, and who was in the room. Your client was not. ${rec(8)} <span class="note">The dates are fixed on the record now.</span>`; } return `${SK.bro} is vague about dates. ${OC.last} lets him be.`; } },
      ] },
    { title: "The offer nobody mentioned", text: () => `Your client heard a rumor: a competitor offered to buy ${SK.co} last year. ${ucf(KTH())} said no. They also did not tell her, and the price would have valued her shares at three times what they offered her. ${broMood()}`,
      options: [
        { label: "Ask him directly", hint: "Ask him point blank whether anyone has offered to buy the company. If there is an offer, the company is worth more than he says, and he has to answer under oath. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 6); if (!live("sq_offer")) return `${a.name} asks. ${SK.bro}: "There was a conversation. Nothing in writing. We weren't interested." It appears to be true. There was no offer to find.`; return attack(a, 9, p => { G.f.sq_offer = true; return `${SK.bro}: "We got a letter." "From whom?" "I'd have to check." ${a.name}: "Please do." ${press(p)} ${rec(6)}`; }, p => { G.f.sq_offer = true; return `${SK.bro} admits there was an offer. He does not remember the number. His lawyer does. ${press(p)} ${rec(6)}`; }, p => { G.f.sq_offer = true; mood(1); return `${SK.bro}, cornered: "We didn't tell her because she would have wanted to sell." "Yes," says ${a.name}. "She would have." ${press(p + 5)} ${rec(9)}`; }, () => `${SK.bro}: "Nothing serious." ${OC.last} moves on quickly, which means there is something there.`, () => `${a.name} asks and ${SK.bro} says, calmly, that his ${SIS()} "wouldn't understand a valuation if you drew it for her." The reporter takes it down. ${kess(5)}`); } },
        { label: "Leave it unasked; subpoena the competitor after", hint: () => `Do not ask him about the offer, so he does not learn you care about it. After the deposition, serve a subpoena on the competitor for its side of the paper. Slower and costs budget, and a third party's documents are harder to explain away than a ${KIN()}'s memory. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 4); G.hrs -= 3; if (!live("sq_offer")) return `The competitor's counsel confirms: informal conversation, no offer. Budget −3. There was no offer to find.`; if (t >= 2) { G.f.sq_offer = true; press(8); return `The competitor produces a two-page letter with a number on it. The number is large. <span class="good">${CASE.lbl.you} +8.</span> ${rec(8)} Budget −3.`; } return `The competitor's counsel produces nothing and cites a confidentiality agreement. Budget −3.`; } },
      ] },
    { title: "Lunch", text: () => `${OC.last} calls lunch. In the hallway, ${SK.bro} and your client end up at the same elevator. Nobody says anything for nine floors.`,
      options: [
        { label: "Let them ride alone", hint: () => `Let ${KIN()} and ${SIS()} ride the elevator alone. Families say things to each other that they never say to lawyers. It could settle the case or wreck it.`, stat: null, who: null, run: () => { if (d(2) === 1) { G.pat += 8; mood(1); G.f.elevator = true; return `Your client comes back with wet eyes. "He asked about my kids." <span class="good">Patience +8.</span> <span class="note">He is softer this afternoon. Whatever happens in mediation will be easier.</span>`; } G.pat -= 6; mood(-1); return `Your client comes back furious. "${SK.cruelLine || "He said Dad would be ashamed."}" <span class="warn">Patience −6.</span> <span class="note">He is harder this afternoon.</span>`; } },
        { label: "Take the stairs with her", hint: () => `Take the stairs with her. She does not talk to her ${KIN()} without you in the room. Nothing gained, nothing said that hurts her. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); G.pat += [0, 2, 4, 6, 8][t]; return `${a.name} steers your client toward the stairs and talks about nothing for nine flights. <span class="good">Patience +${[0, 2, 4, 6, 8][t]}.</span>`; } },
      ] },
    { title: "The afternoon", text: () => `${broMood()} ${G.f.sq_plane ? "The flight logs are on the table." : ""} ${G.f.sq_lease ? "So is the appraisal." : ""}`,
      options: [
        { label: "Walk him through everything you found", hint: "Walk him through everything the books showed, the salaries, the rent and the plane. Make him explain each one under oath, on a record the judge will read. Stronger the more you found. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 8); const found = ["sq_salary", "sq_lease", "sq_plane", "sq_offer"].filter(k => G.f[k]).length; const bonus = found * 3; return attack(a, 9, p => `${a.name} goes item by item. ${SK.bro} has an explanation for each. The explanations get shorter. ${press(p + bonus)}`, p => `${a.name}: "Aspen, eleven times." ${SK.bro}: "Client development." "Which clients?" ${press(p + bonus)}`, p => `By the end ${SK.bro} is answering "yes" to questions that used to get a paragraph. ${OC.last} is rattled and asks for a break that is not granted, because nobody moves. ${press(p + bonus + 3)} ${rec(5)}`, () => `${SK.bro} holds up. He has been prepped well.`, () => `${a.name} pushes too hard and ${SK.bro}, provoked, says something true about the company's debt that helps his side. ${kess(6)}`); } },
        { label: "Save it for mediation", hint: () => `Hold back what you found. ${ucf(KTH())} do not know how much you have, and uncertainty makes them nervous at the table. A smaller gain now for leverage later.`, stat: null, who: null, run: () => { press(3); G.f.savedForMediation = true; return `${team.lead.name} asks about the weather in Aspen and moves on. ${OC.last} relaxes. <span class="good">${CASE.lbl.you} +3.</span> <span class="note">The mediator will hear it first. That is worth something.</span>`; } },
      ] },
  ] };
const SQ_MEDIATION = { title: "Mediation", kind: "mediation", room: "In mediation, a retired judge shuttles between two rooms trying to get the family to a buyout number. Most of these cases end here.", intro: () => `Judge Feld, retired, in a conference room with two doors. ${ucf(KTH())} are behind one. ${SK.cl.last} is behind the other. Feld is the only one who walks between them; you stay with your client.`,
  beats: () => [
    { title: "Feld's opening", text: () => `Feld has read the file. He asks each side for "a number and a reason." ${OC.last} goes first with a number that values your client's shares at ${SK.lowball}. The reason is "family discount."`,
      options: [
        { label: "Answer with the competitor's letter", hint: () => `Put the competitor's offer on the table in front of the mediator. It is a valuation ${KTH()} cannot argue with, because someone else wrote it and they hid it. Only available if you found it, and once shown, it is spent.`, stat: null, who: null, when: () => G.f.sq_offer, lock: "You did not find the competitor's offer in the books.", run: () => { press(12); return `${team.lead.name} hands Feld the competitor's letter without a word. Feld reads it. Feld reads it again. Feld says "I'll be right back" and goes through ${KP()} door. <span class="good">${CASE.lbl.you} +12.</span>`; } },
        { label: "Answer with the numbers", hint: () => `Answer ${KP()} lowball with your own valuation and every adjustment behind it, ranked by size. Numbers with reasons beat numbers alone. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); const found = ["sq_salary", "sq_lease", "sq_plane", "sq_offer"].filter(k => G.f[k]).length; const p = [0, 2, 5, 8, 11][t] + found * 2; press(p); return `${a.name} gives Feld one page covering the salaries, the rent and the plane. Feld nods at each line. <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
        { label: "Let her speak", hint: () => `Let your client speak to ${KH()} directly. She has wanted to say it to their faces for years, and mediators know a family member's voice moves a room more than a lawyer's. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 3) { press(9); G.pat += 8; return `Your client speaks for two minutes about ${SK.speechAbout || "the ribbon-cutting and her father"} and what "family" used to mean. Feld does not interrupt. ${OC.last} looks at the table. <span class="good">${CASE.lbl.you} +9, Patience +8.</span>`; } if (t >= 2) { press(3); G.pat += 3; return `Your client speaks. It is heartfelt and a little long. <span class="good">${CASE.lbl.you} +3, Patience +3.</span>`; } G.pat -= 5; kess(4); return `Your client speaks and, halfway through, says the word "greedy." ${OC.last} writes it down. <span class="k">${OC.last} +4.</span> <span class="warn">Patience −5.</span>`; } },
      ] },
    { title: "The shuttle", text: () => `Feld goes back and forth for three hours. Each time he comes through your door ${KP()} number is a little bigger and his tie is a little looser.`,
      options: [
        { label: "Hold firm, let Feld work", hint: () => `Do not move off your number. The mediator has your figures and is in the other room telling ${KTH()} what a judge will do with them; a side that moves first tells him it did not believe its own math. Costs an hour of everyone's patience.`, stat: null, who: null, run: () => { press(4); G.pat -= 3; return `You give Feld nothing to bring back. He sighs and goes. <span class="good">${CASE.lbl.you} +4.</span> <span class="warn">Patience −3.</span>`; } },
        { label: "Move a little, ask for the buyout structure", hint: () => `Concede a little on price and ask how the buyout would be paid. Cash now is worth more than the same number over five years, and the structure is where ${KTH()} may give. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 3); if (t >= 2) { press(6); G.f.structured = true; return `${a.name} proposes half now, half over three years, secured by the building. Feld likes it enough to sell it. <span class="good">${CASE.lbl.you} +6.</span>`; } return `${a.name} proposes a structure. Feld says ${KTH()} "aren't there yet."`; } },
        { label: () => `Have the ${SIS()} call her ${KIN()}`, hint: () => `Have your client call her ${KIN()} tonight, just the two of them. Families settle things their lawyers cannot, and say things their lawyers cannot take back. Prepare her carefully. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 10 - (G.f.elevator ? 2 : 0)); tire(a, 3); if (t >= 3) { press(10); mood(1); return `Fifteen minutes on the phone. Neither lawyer hears it. Your client comes back and says "He'll do it." <span class="good">${CASE.lbl.you} +10.</span>`; } if (t >= 2) return `They talk. Nobody cries. Nothing moves, but nothing breaks.`; G.pat -= 8; kess(5); return `They talk for four minutes and your client hangs up. Feld hears the phone hit the table through the wall. <span class="warn">Patience −8.</span> <span class="k">${OC.last} +5.</span>`; } },
      ] },
    { title: "Feld's number", text: () => `5:40 p.m. Feld comes through the door without knocking and says a number. It is ${KP()} best, and Feld says he thinks it is fair.`,
      options: [
        { label: "Take it to the client", hint: () => `Bring the offer to your client as it stands. It is her decision to make, and seeing the actual number tells her where ${KTH()} really are, even if she turns it down. Nothing spent.`, stat: null, who: null, run: () => { const lead = G.you - G.them; const found = ["sq_salary", "sq_lease", "sq_plane", "sq_offer"].filter(k => G.f[k]).length; G.pendingOffer = Math.max(20, Math.round((55 + lead * 1.5 + found * 8 + (G.f.structured ? 6 : 0)) * (G.client ? G.client.mult : 1))); G.f.mediationOffer = true; return `Feld's number, on paper, in your client's hands. She is tempted. <span class="note">An offer is on the table.</span>`; } },
        { label: "Reject it before it reaches her", hint: "Turn it down without showing her. The number is not close, and a tired client who sees a bad offer sometimes takes it just to be done; keeping it from her protects the case and takes a decision that was hers. Feld is disappointed, and so, a little, is she when she finds out.", stat: null, who: null, run: () => { G.pat -= 6; press(3); return `You tell Feld no before your client sees it. Feld: "Your call, counsel." He does not sound convinced. <span class="warn">Patience −6.</span> <span class="good">${CASE.lbl.you} +3.</span>`; } },
      ] },
  ] };
const SQ_TRIAL = { title: "Trial", kind: "hearing", room: () => `A trial with no jury. The judge decides what the shares are worth and whether ${KTH()} have to buy them.`, intro: () => `This is a bench trial. There is no jury in this kind of case; Judge Amsel decides alone, and he has seen a hundred of these.`,
  beats: () => [
    { title: "The valuation experts", text: () => `Your expert says your client's shares are worth ${SK.highval}. Theirs says ${SK.lowball}. The judge asks how two accountants looking at the same company got numbers that far apart.`,
      options: [
        { label: "Let your expert explain the adjustments", hint: "Let your expert explain to the judge how each adjustment works: put the excess salaries, the excess rent, and the plane back into the company's earnings, and it is worth what it should have been worth all along. Stronger the more you found. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); const found = ["sq_salary", "sq_lease", "sq_plane", "sq_offer"].filter(k => G.f[k]).length; const p = [0, 3, 6, 9, 12][t] + found * 3; press(p); return `The expert walks the judge through every dollar that left the company sideways. ${found >= 3 ? "The judge is persuaded and stops taking notes." : "The judge writes steadily."} <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
        { label: "Cross their expert on his fee", hint: "Ask their expert how much he is being paid and how often he testifies for the side paying him. The oldest cross-examination in the book, because it works. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 4); if (t >= 3) { press(8); return `"And who is paying you?" "The company." "Which ${KTH()} control." "Yes." "Thank you." <span class="good">${CASE.lbl.you} +8.</span>`; } if (t >= 2) { press(3); return `The fee comes in. The judge has seen this before. <span class="good">${CASE.lbl.you} +3.</span>`; } return `The expert has a graceful answer about independence.`; } },
      ] },
    { title: () => `${SK.bro} on the stand`, text: () => `${SK.bro} testifies for his side. ${OC.last} questions him first, about sacrifice and hard work and a father's legacy. Then you cross-examine him.`,
      options: [
        { label: "Aspen, eleven times", hint: () => `Read the ${KIN()} the flight logs, destination by destination. Let the judge count. Only if you have the logs. Advocacy.`, stat: "adv", who: "any", when: () => G.f.sq_plane, lock: "You did not pull the flight logs.", run: a => { tire(a, 7); return attack(a, 8, p => `${a.name} reads the flight log. The judge, who flies commercial, writes something down. ${press(p + 4)}`, p => `"Which client is in Aspen, Mr. ${SK.broLast}?" A long pause. ${press(p + 4)}`, p => `${a.name} puts the Instagram photo on the screen: ${SK.bro}, the plane, a lacrosse stick. ${OC.last} objects. "To what?" asks the judge. ${press(p + 8)}`, () => `${SK.bro}: "Client development." He has practiced it. It almost works.`, () => `${a.name} overplays the plane and the judge says "I get it, counsel." ${kess(5)}`); } },
        { label: "The offer he didn't mention", hint: "Confront him with the offer he swore under oath did not exist. A witness caught in one lie loses the judge on everything else. Only if you found it. Advocacy.", stat: "adv", who: "any", when: () => G.f.sq_offer, lock: "You did not find the competitor's offer in the books.", run: a => { tire(a, 7); return attack(a, 8, p => `"You received an offer for the company and did not tell your ${SIS()}." "It wasn't serious." "It was in writing." ${press(p + 5)}`, p => `${a.name} reads the number from the letter, then the number ${KTH()} offered your client. The judge does the math without a calculator. ${press(p + 5)}`, p => `${SK.bro}, asked why he hid it: "She would have wanted to sell." The judge: "Was that her right?" Silence. ${press(p + 9)}`, () => `${SK.bro} has an answer about his duties to the company that his lawyer wrote for him. It holds.`, () => `${a.name} asks and ${SK.bro} produces a reason the offer was bad for the company that sounds, unfortunately, correct. ${kess(6)}`); } },
        { label: "Three questions and sit down", hint: "Ask him three short questions, one each about the salary, the rent, and the dividends, and sit down before he can explain any of them. Nothing risked, and the judge already has the numbers.", stat: null, who: null, run: () => { press(4); return `You ask three questions, one each about the salary, the rent, and the dividends, and sit down before the witness can explain any of them. <span class="good">${CASE.lbl.you} +4.</span>`; } },
      ] },
    { title: "Closing", text: () => `Judge Amsel: "I'll hear you briefly." He means it.`,
      options: [
        { label: "Close", hint: "Have the associate give the closing: walk the judge through the adjustments once more, in order, and ask for the buyout at your number. The associate grows, and a bench trial forgives a nervous closer more than a jury would. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 7); return attack(a, 9, p => `${a.name}: "${ucf(PCTW())} of a company should be worth ${PCTW()} of the company. Not ${PCTW()} of what's left after ${KTH()} are done." ${press(p)}`, p => `${a.name} closes in four minutes and sits down. The judge is satisfied. ${press(p)}`, p => `${a.name} ends on ${SK.photoShort || "the ribbon-cutting photograph"}. "${SK.builtLine || "He built it for three children."}" ${SK.bro} looks at the floor. ${press(p + 5)}`, () => `It is a competent closing for a judge who has already decided.`, () => `${a.name} goes long. The judge looks at the clock. ${kess(5)}`); } },
        { label: "You close", hint: "The partner closes. Steady and familiar, and the associates learn nothing from watching.", stat: null, who: null, run: () => { press(7); G.pat += 3; const lead = G.you - G.them; return `${lead > 8 ? "You close, and you do a great job." : lead < -8 ? "You close, but not well enough." : "You close just well enough."} Your client likes seeing the partner up there. <span class="good">${CASE.lbl.you} +7, Patience +3.</span>`; } },
      ] },
  ] };

/* =====================================================================
   STRUCTURE 5: the Series B. You represent the founder. Winning too hard costs the relationship.
   Investor's diligence finds problems in YOUR client's house (3 of 4 live): sb_captable, sb_ipgap, sb_contractor, sb_data.
   ===================================================================== */
const SB_KICKOFF = { title: "Kickoff", kind: "office", room: () => `Kickoff for a financing, where a founder raises money from an investor ${SK.cl.she} will be in business with for a decade.`, intro: () => `${SK.co}'s office, which is a converted dentist's suite. ${SK.cl.name}, founder and CEO, has fourteen months of cash left before the company runs out, and a term sheet from ${SK.investor} that ${SK.cl.she} is holding like it might bite.`,
  beats: () => [
    { title: "The term sheet", text: () => `${SK.investor} offers ${SK.raise} at a valuation of ${SK.valuation}. It all looks standard. Your client: "Is it good?" It is fine. Whether it is good depends on the next forty pages.`,
      options: [
        { label: () => `Tell ${SK.cl.her} it's a good start`, hint: () => `Tell ${SK.cl.her} the term sheet is a good start. Founders hear a lot of bad news in a financing, and a confident first read keeps ${SK.cl.her} steady. It also sets the bar for what ${SK.cl.she} expects you to win back. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); G.f.promised = true; G.pat += t >= 2 ? 10 : 3; return `${a.name}: "It's a real offer from a real fund. We'll make it better." ${SK.cl.He} is relieved. <span class="good">Patience +${t >= 2 ? 10 : 3}.</span>`; } },
        { label: () => `Tell ${SK.cl.her} what the fine print costs`, hint: () => `Walk ${SK.cl.her} through what the fine print actually costs ${SK.cl.her}, which is control, upside and the right to be fired. ${SK.cl.His} patience starts lower, and nothing that happens later feels like a surprise. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 7); tire(a, 2); G.f.honest = true; G.pat += t >= 2 ? 4 : 0; return `${a.name} explains that the number on page one is the least important number in the document. ${SK.cl.He} writes that down. ${t >= 2 ? '<span class="good">Patience +4.</span>' : ""} <span class="note">Expectations set. ${SK.cl.He} will not be surprised by page 30.</span>`; } },
        { label: () => `Ask what ${SK.cl.she} wants from these people`, hint: () => `Ask what ${SK.cl.she} wants from these investors besides money. Founders who want a partner negotiate different terms from founders who want to be left alone, and you should know which ${SK.cl.she} is. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 3); if (t >= 2) { G.f.knowsWhy = true; return `${a.name} asks. ${SK.cl.He} wants ${SK.partnerName}, the partner at ${SK.investor}, on ${SK.cl.hers} board. ${SK.cl.He} has wanted that since ${SK.cl.she} read his book. <span class="note">${SK.cl.He} wants a partner, not just a check. That changes how hard to push.</span>`; } return `Your client: "Runway." That is an answer, and not much of one.`; } },
      ] },
    { title: "The budget", text: () => `Your client has a budget for legal. It is small and it is coming out of the money ${SK.cl.she} has not raised yet. "Fifty hours?" ${SK.cl.she} says. "Is that a lot?"`,
      options: [
        { label: "Fifty, and we'll be efficient", hint: () => `Accept the hours ${SK.cl.she} offered. Tight for a financing with this much paper, but agreeing tells ${SK.cl.her} you respect how little cash ${SK.cl.she} has. Patience up, budget tight.`, stat: null, who: null, run: () => { G.hrs -= 10; G.pat += 8; return `You say fifty. <span class="good">Patience +8.</span> <span class="warn">Budget −10.</span>`; } },
        { label: "Defer half the fee to closing", hint: "Take half the fee only if the deal closes. The firm carries risk it usually does not, and in exchange you get the hours the deal needs. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 2); if (t >= 2) { G.hrs += 10; G.pat += 4; return `${a.name} puts it in writing, half the fee now and half when the money lands. Your client looks like someone lifted something off ${SK.cl.her}. <span class="good">Budget +10, Patience +4.</span>`; } return `The firm's finance committee says no. You say sixty.`; } },
        { label: "Staff it lean", hint: "Keep the junior's hours off the bill. The budget stretches and the junior works for free, which wears on people.", stat: null, who: null, run: () => { G.hrs += 10; G.f.leanStaff = true; tire(team.junior, 10); return `The junior is "learning, not billing." <span class="good">Budget +10.</span> <span class="warn">${team.junior.name} Burnout +10.</span>`; } },
      ] },
    { title: "The investor's counsel", text: () => `${SK.investor} uses ${OC.name} of ${OC.firm}. ${counselIntroLine()} <span class="note">Remember that your client will be in a boardroom with these people for the next ten years.</span>`,
      options: [
        { label: () => `Brief the team on ${OC.her}`, hint: () => `Every opposing lawyer has habits. An hour learning ${OC.hers} means ${OC.hers} favorite move lands softer when ${OC.she} uses it. Research.`, stat: "res", who: "any", run: a => { tire(a, 3); G.f.knowOC = true; if (OC.id === "ibeh") Object.values(team).forEach(x => x.hooks["+res"] = true); if (OC.id === "tobias") Object.values(team).forEach(x => x.hooks.patience = true); if (OC.id === "venkat") G.f.principalsEasy = true; return `${a.name} walks the team through ${OC.last}'s last three financings. <span class="note">${OC.style}. ${OC.know}</span>`; } },
        { label: () => `Call ${OC.her} and set a tone`, hint: "Call the investors' lawyer before the first draft. A financing is the start of a long relationship, and lawyers who like each other close faster and fight less. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 1); if (t >= 3) { G.f.civil = true; G.pat += 3; return `${a.name} and ${OC.last} agree on the phone to "keep the lawyers boring." <span class="good">Patience +3.</span> <span class="note">Differences will split easier.</span>`; } return `${a.name} calls. ${OC.last} is pleasant and gives nothing.`; } },
        { label: "Get to work", hint: "Skip the courtesies and open the term sheet. Saves the hour; the other side's habits stay a surprise.", stat: null, who: null, run: () => `You open the term sheet to page two.` },
      ] },
  ] };
const SB_TERMS = { title: "The term sheet", kind: "deal", room: "The term sheet for an investment sets how much the company is worth, who controls what, and who gets paid first if it ends badly.", intro: () => `Four pages that decide who controls ${SK.co} for the next decade. Every point you win is a point ${SK.partnerName} remembers.`,
  beats: () => [
    { title: "The valuation", text: () => `${SK.investor} says ${SK.co} is worth ${SK.valuation}. Your client has a spreadsheet that says more, which is true of every founder in this position.`,
      options: [
        { label: "Push the number up with comparables", hint: "Push the valuation up with real numbers, meaning what similar companies raised at, and at what price, in the last year. Investors respect data more than founders' hopes. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); const p = [0, 3, 6, 9, 12][t]; press(p); return `${a.name} finds four recent rounds at companies like ${SK.cl.hers}. ${OC.last} finds two that went the other way. You land 10% higher. <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
        { label: "Accept the number, fight the terms", hint: "Take the valuation they offered and spend your leverage on the terms instead. The headline number is what founders brag about; the fine print is what costs them the company.", stat: null, who: null, run: () => { G.f.conceded = true; G.pat -= 3; press(2); return `You accept. Your client is quietly disappointed. ${OC.last} is quietly surprised. <span class="good">${CASE.lbl.you} +2.</span> <span class="warn">Patience −3.</span> <span class="note">Everything now rides on control.</span>`; } },
        { label: () => `Let your client pitch ${SK.partnerName} directly`, hint: () => `Step back and let the founder pitch the investor in person. Investors back people, and hearing it from ${SK.cl.her} can move a number that ${SK.cl.hers} lawyer cannot. Prepare ${SK.cl.her} well. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", G.f.principalsEasy ? 8 : 10); tire(a, 3); if (t >= 3) { press(10); G.pat += 5; return `Your client pitches for twenty minutes. ${SK.partnerName} raises the number himself and tells ${OC.last} afterward. <span class="good">${CASE.lbl.you} +10, Patience +5.</span>`; } if (t >= 2) { press(3); return `A good conversation, and nothing in the document changes because of it. <span class="good">${CASE.lbl.you} +3.</span>`; } kess(6); G.pat -= 5; return `Your client mentions the fourteen months of cash. ${SK.partnerName} did not know it was fourteen. ${OC.last}'s next draft is firmer. <span class="k">${OC.last} +6.</span> <span class="warn">Patience −5.</span>`; } },
      ] },
    { title: "Who gets paid first", text: () => `If ${SK.co} sells cheaply someday, ${SK.investor} wants its money back first, times two, before anyone else sees a dollar. Your client would see a dollar last.`,
      options: [
        { label: "One times, not two", hint: "Insist the investors get their money back once before anyone else is paid, not twice. Once is market; twice means they take everything in a modest sale. Drafting.", stat: "dra", who: "any", run: a => { tire(a, 5); return dealhit(a, 9, p => `${a.name} strikes the "times two." ${OC.last} puts it back at one and a half. You land at one. ${press(p)}`, p => `${a.name} attaches a memo: nobody does two times anymore. ${OC.last} does not argue with the memo. ${press(p)}`, p => `${a.name}: "Money back once, then they share like everyone else, and we're done with this section." ${OC.last} checks with ${SK.partnerName}, who says fine. ${press(p)}`, () => `The standoff holds at one and a half.`, () => `${a.name} overreaches and ${OC.last} reopens the valuation. ${kess(6)}`); } },
        { label: "Trade it for something the founder cares about", hint: () => `Let the investors keep the money-first term but make them give up a board seat for it. Trade something ${SK.cl.she} does not understand for something ${SK.cl.she} will feel every quarter. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 2) { press(6); G.f.boardWon = true; return `${a.name} gives them a bit more downside protection and gets your client an extra board seat ${SK.cl.she} picks. ${SK.cl.He} cares about that more. <span class="good">${CASE.lbl.you} +6.</span>`; } return `${OC.last}: "We don't trade getting paid first for board seats." Not today.`; } },
      ] },
    { title: "What they can veto", text: () => `${SK.investor} wants a veto over raising money, selling the company, hiring executives, changing the budget by more than 10%, and "any other material decision." The last one means everything.`,
      options: [
        { label: "Strike 'any other material decision'", hint: "Strike the investors' veto over 'any other material decision.' Every specific veto on the list is negotiable; the vague one gives them control of everything. Drafting.", stat: "dra", who: "any", run: a => { tire(a, 4); return dealhit(a, 8, p => `${a.name} strikes the catch-all. ${OC.last} accepts without a fight. ${OC.She} expected to lose that one. ${press(p)}`, p => `${a.name} replaces "any other material decision" with a list of six. ${OC.last} adds a seventh, and it is one you can live with. ${press(p)}`, p => `${a.name} strikes it and the budget veto too. ${OC.last} takes it to ${SK.partnerName}, who says he "doesn't want to run the company, just fund it." ${press(p + 3)}`, () => `${OC.last} defends the catch-all as "standard." It is not, quite.`, () => `${a.name} strikes everything and ${OC.last} puts everything back with a note about "founder-friendly" being a two-way street. ${kess(5)}`); } },
        { label: "Accept the list, cap the founder's exposure", hint: () => `Accept the veto list but make sure none of it can be used to remove ${SK.cl.her} as CEO. Investors get their protections, the founder keeps ${SK.cl.hers} job. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { press(6); G.f.founderProtected = true; return `${a.name} accepts the vetoes and adds one line: the vetoes cannot be used to remove the CEO. ${OC.last} reads it twice and lets it go. <span class="good">${CASE.lbl.you} +6.</span> ${rec(5)}`; } return `${a.name} accepts the list. The protection language does not make it in.`; } },
      ] },
    { title: "Signing the term sheet", text: () => `${SK.partnerName} wants to sign by Friday. Your client wants to sign tonight. ${SK.cl.He} has been carrying this for six weeks.`,
      options: [
        { label: "Sign", hint: "Sign the term sheet now. Momentum matters in a financing, and the fights you skipped come back in the long documents. Patience up.", stat: null, who: null, run: () => { G.pat += 8; return `Signed. Your client goes home and sleeps for eleven hours. <span class="good">Patience +8.</span>`; } },
        { label: "One more read", hint: "Read the term sheet once more before anyone signs. Something is always wrong in a document six people have edited, and now is when fixing it is free. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); G.hrs -= 1; if (t >= 3) { press(6); return `${a.name} finds that the ownership math counts a block of shares set aside for future employees that does not exist yet. Counting it would have quietly cost your client four points of ownership. ${OC.last}: "Standard." Removed. <span class="good">${CASE.lbl.you} +6.</span> Budget −1.`; } if (t >= 2) { press(2); return `Two typos and one thing that was not a typo. <span class="good">${CASE.lbl.you} +2.</span> Budget −1.`; } G.pat -= 3; return `${a.name} reads it again and it is fine, and your client asks why that took a day. <span class="warn">Patience −3.</span> Budget −1.`; } },
      ] },
  ] };
const SB_DILIGENCE = { title: "Their diligence", kind: "deal", room: "The investor's lawyers go through your client's company. Every problem they find is yours to fix before they price it.", intro: () => `${SK.investor} sends a 140-item list. It is about ${SK.co}. Everything in it is your client's problem to fix, and some of it your client does not know is a problem.`,
  beats: () => [
    { title: "Who owns what", text: () => `Who owns what slice of ${SK.co}? Your client has a spreadsheet of every shareholder. ${OC.last} has questions about row 14, an advisor who was promised "one percent" over dinner in 2022.`,
      options: [
        { label: "Track down the advisor and paper it", hint: "Find the advisor who was promised equity on a handshake and get the promise in writing. Investors will not close with an unwritten claim on a piece of the company. Costs hours. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 4); G.hrs -= 2; if (!live("sb_captable")) return `The advisor signed a proper grant in 2023. Row 14 was nothing. Budget −2.`; if (t >= 2) { G.f.sb_captable = true; return `${a.name} finds the advisor in Lisbon. He signs a real grant for half a percent and is thrilled. ${rec(8)} Budget −2. <span class="note">Fixed before ${OC.last} could price it.</span>`; } kess(5); return `The advisor wants the full percent and a seat at board meetings without a vote. ${OC.last} hears about it. <span class="k">${OC.last} +5.</span> Budget −2.`; } },
        { label: "Disclose it and price it", hint: "Tell the investors about the handshake promise and let it be priced into the deal. It costs a little on the number, and an investor who learns you disclose the awkward things trusts the rest. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 3); if (!live("sb_captable")) return `${a.name} looks into row 14. The advisor was paid properly at the time.`; G.f.sb_captable = true; kess(3); G.pat += 3; return `${a.name} tells ${OC.last} about the dinner promise before ${OC.she} asks. The valuation absorbs it. <span class="k">${OC.last} +3.</span> <span class="good">Patience +3.</span> ${rec(5)} <span class="note">${SK.partnerName} noticed the candor.</span>`; } },
      ] },
    { title: "The co-founder who left", text: () => `${SK.co} had a second founder for eight months. He left in 2022 to "pursue other things." Nobody can find the document where he assigned his work to the company.`,
      options: [
        { label: "Find him, get the signature", hint: "Track down the former co-founder and get him to sign over his code. A company does not own work that was never formally signed over to it. Research to find him, Charm to get the signature. Costs hours.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 5); G.hrs -= 3; if (!live("sb_ipgap")) return `The signed paperwork turns up in an old lawyer's files, dated 2022. The gap was never a gap. Budget −3.`; if (t >= 2) { G.f.sb_ipgap = true; return `${a.name} finds the co-founder teaching yoga in Vermont. He signs the papers for a thank-you and a small check. ${rec(10)} Budget −3. <span class="note">${SK.co} owns its own work again.</span>`; } kess(6); return `The co-founder has a lawyer now. The lawyer wants to "discuss compensation." ${OC.last} puts a hold on the timeline. <span class="k">${OC.last} +6.</span> Budget −3.`; } },
        { label: "Argue the company owns it anyway", hint: "Argue the company already owns the code because he wrote it as an employee. Often true, and investors' lawyers hate 'often.' Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 10); tire(a, 4); if (!live("sb_ipgap")) return `No need; it is already signed.`; if (t >= 3) { G.f.sb_ipgap = true; press(4); return `${a.name} writes a memo saying the co-founder was an employee, the work was in scope, and the company owns it. ${OC.last} accepts the memo, provided your client personally promises to cover it if the co-founder ever turns up with a claim. <span class="good">${CASE.lbl.you} +4.</span> ${rec(5)}`; } kess(5); return `${OC.last} does not accept the memo. The gap stays open. <span class="k">${OC.last} +5.</span>`; } },
      ] },
    { title: "The contractor", text: () => `A developer in Kyiv built ${SK.co}'s first version for equity that was never issued. He has emailed twice. Your client has not answered because ${SK.cl.she} "didn't know what to say."`,
      options: [
        { label: "Answer him today, with a real offer", hint: "Reply to the developer today with a real offer. He is owed something, and a claim settled for a small number now is cheaper than one that surfaces at closing. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 3); if (!live("sb_contractor")) return `${a.name} writes to him. He was paid in cash, it turns out, and has the invoices. He just wanted a reference. He was paid years ago.`; if (t >= 2) { G.f.sb_contractor = true; return `${a.name} drafts a grant of shares and a release, a signed promise not to come back later and sue. The developer signs the same day and sends a photo of his dog. ${rec(8)}`; } kess(4); return `The developer replies to ${a.name}'s email by cc'ing ${SK.investor}. <span class="k">${OC.last} +4.</span>`; } },
        { label: "Leave it alone until after closing", hint: "Leave the developer alone until after the money is in. If he does not raise it, nobody has to. If he does, it is at the worst possible time.", stat: null, who: null, run: () => { if (!live("sb_contractor")) return `Nothing happens. He was paid in cash, it turns out.`; if (d(3) === 1) { kess(8); return `The developer emails ${SK.investor} directly. ${OC.last} adds it to the list. <span class="k">${OC.last} +8.</span>`; } return `Nothing happens. Yet.`; } },
      ] },
    { title: "The data", text: () => `${SK.investor}'s technical diligence wants to see the ${SK.dataWord}. Your client says it is "strong," in a way that means it is not.`,
      options: [
        { label: "Look at it yourself first", hint: "Look at the company's own technical weaknesses before the investors' expert does. Whatever he finds, you want to have found first and have an answer for. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); if (!live("sb_data")) return `${a.name} reads the ${SK.dataWord}. It is, in fact, strong. It holds up.`; if (t >= 2) { G.f.sb_data = true; press(3); return `${a.name} reads it and finds one ${SK.dataFlaw}. ${a.name} has your client explain it in a footnote before ${SK.investor}'s expert can make it a headline. <span class="good">${CASE.lbl.you} +3.</span> ${rec(7)}`; } return `${a.name} reads it and does not know what a good one looks like.`; } },
        { label: "Let their expert find whatever there is", hint: "Let the investors' expert do the technical review on their dime. Saves your hours; whatever he finds, you hear about it when they do.", stat: null, who: null, run: () => { G.hrs += 2; if (!live("sb_data")) return `Their expert calls it "solid." <span class="good">Budget +2.</span>`; kess(7); G.pat -= 4; return `Their expert finds the ${SK.dataFlaw} and writes a memo about it that ${SK.partnerName} reads on a plane. <span class="k">${OC.last} +7.</span> <span class="warn">Patience −4.</span> <span class="good">Budget +2.</span>`; } },
      ] },
  ] };
const SB_DOCS = { title: "The long documents", kind: "deal", room: "The long documents. The investor's lawyers wrote them, so every default favors the investor until you change it.", intro: () => `The term sheet was four pages. The real documents are two hundred. ${OC.last} drafted them, so every position in them starts out where ${OC.hers} client wants it, and anything you do not change stays that way.`,
  beats: () => [
    { title: "The forced sale", text: () => `A clause says that if ${SK.investor} and a majority of investors want to sell ${SK.co}, your client has to sell too, at whatever price they like.`,
      options: [
        { label: "Add a floor price", hint: () => `Add a minimum price below which the investors cannot force a sale. Without it, this forced-sale clause lets them sell the company out from under ${SK.cl.her} at any number. Drafting.`, stat: "dra", who: "any", run: a => { tire(a, 5); return dealhit(a, 9, p => `${a.name} adds a minimum price before the clause kicks in. ${OC.last} lowers it. You land somewhere your client can live with. ${press(p)}`, p => `${a.name} ties the floor to the current valuation. ${OC.last}: "Fair." ${press(p)}`, p => `${a.name} adds a floor and a founder veto on sales to competitors. ${OC.last} gives the veto to get the floor down. ${press(p + 3)}`, () => `${OC.last}: "Every deal has this." ${OC.She} is right, and nothing moves.`, () => `${a.name} strikes the whole clause. ${OC.last} treats it as a sign you are not serious. ${kess(6)}`); } },
        { label: "Accept it, get something back", hint: () => `Accept the forced-sale clause, which is normal in these deals, and trade your agreement for something else on the list. You give up protecting ${SK.cl.her} from a forced sale and gain a term ${SK.cl.she} will feel sooner. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 3); if (t >= 2) { press(5); G.pat += 3; return `${a.name} accepts the clause and gets your client a bigger block of shares set aside for hiring, which ${SK.cl.she} cares about more. <span class="good">${CASE.lbl.you} +5, Patience +3.</span>`; } return `You accept it and get nothing back.`; } },
      ] },
    { title: () => `${SK.cl.His} own shares`, text: () => `${SK.investor} wants your client to re-earn a quarter of the company ${SK.cl.she} founded, over four years, in case ${SK.cl.she} leaves. Your client: "Leave? It's my company."`,
      options: [
        { label: "Cut the re-earning to a year", hint: () => `Cut the founder's re-earning of ${SK.cl.hers} own shares to one year. ${SK.cl.He} has already built the company for five; asking ${SK.cl.her} to earn it again for four more is a demand, not a protection. Drafting.`, stat: "dra", who: "any", run: a => { tire(a, 5); return dealhit(a, 9, p => `${a.name} argues five years of work already counts. ${OC.last} agrees to eighteen months. ${press(p)}`, p => `${a.name} gets it down to a year, and ${SK.cl.she} keeps all of it immediately if ${SK.cl.she} is fired without cause. ${press(p)}`, p => `${a.name} gets a year, the same protection if ${SK.cl.she} is fired, and and a clause saying that disagreeing with the board is not a reason to fire ${SK.cl.her} and keep the shares. ${OC.last} looks at that one for a while and lets it go. ${press(p + 3)} ${rec(5)}`, () => `${OC.last}: "Four years is standard." Two years is standard. Nothing moves yet.`, () => `${a.name} refuses any re-earning and ${OC.last} asks, in writing, whether your client "intends to stay." Your client reads the email. ${kess(6)} <span class="warn">Patience −4.</span>`); } },
        { label: () => `Explain it to ${SK.cl.her}, accept two years`, hint: () => `Explain to ${SK.cl.her} why re-earning over two years is not an insult: if a co-founder walks out next year, the same term stops him leaving with a quarter of ${SK.cl.hers} company. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); if (t >= 2) { press(3); G.pat += 5; return `${a.name} explains that the same clause would have saved ${SK.cl.her} the co-founder mess. ${SK.cl.He} gets it, and they settle on two years. <span class="good">${CASE.lbl.you} +3, Patience +5.</span>`; } G.pat -= 4; return `${a.name} explains. Your client: "So I'm an employee now." <span class="warn">Patience −4.</span>`; } },
      ] },
    { title: "The last draft", text: () => `Draft 9. ${OC.last} sends it at 11:40 p.m. with "final, hopefully." Your client wants to sign before the wire date. ${SK.cl.His} bank account wants it more.`,
      options: [

        { label: () => `Send it to ${SK.cl.her}`, hint: "Trust that the other side made only the changes they said they made. Everyone is tired, including whoever edited the draft.", stat: null, who: null, run: () => { alive().forEach(a => a.burn = Math.max(0, a.burn - 5)); kess(5); return `You send the draft on without reading it again and everyone gets a night's sleep. What that costs, you will not see until later. <span class="k">${OC.last} +5.</span> <span class="good">Team Burnout −5.</span>`; } },
      ] },
  ] };
const SB_CLOSING = { title: "Closing", kind: "closing", room: "Closing a financing means the money moves when every condition is met. Anything unfinished is a reason not to fund.", intro: () => `A conference call, because nobody does these in person anymore. ${SK.cl.last} is calling from ${SK.cl.hers} car in a parking garage, engine off, laptop on the wheel. ${SK.partnerName} is somewhere with good light.`,
  beats: () => {
    const fixes = ["sb_captable", "sb_ipgap", "sb_contractor", "sb_data"].filter(k => live(k));

    const names = { sb_captable: "the advisor's one percent", sb_ipgap: "the co-founder's unsigned paperwork", sb_contractor: "the developer in Kyiv", sb_data: "the " + SK.dataFlaw };

    return [
      { title: "The condition", text: () => hit ? `${OC.last} speaks on the call, before the wire. ${SK.investor} will fund, but not until ${names[hit]} is resolved. Your client has eleven days of cash.` : `${OC.last} confirms every condition is met. ${unfixed.length ? "" : "You fixed everything before they could price it."} ${SK.partnerName} says "nice work" to nobody in particular.`,
        options: hit ? [
          { label: "Fix it in eleven days", hint: "Put everyone on the problem and fix it before closing, inside the eleven days. The money waits and the team does not sleep. Drafting. Tiring.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); alive().forEach(x => tire(x, 6)); if (t >= 2) { press(6); G.f[hit] = true; return `${a.name} runs the room for a week. ${names[hit].charAt(0).toUpperCase() + names[hit].slice(1)} is resolved on day nine. Your client does not sleep for any of them. <span class="good">${CASE.lbl.you} +6.</span> <span class="warn">Everyone Burnout +6.</span>`; } kess(8); G.pat -= 6; return `Nine days later it is not resolved, and ${SK.investor} funds half now and half "upon resolution," which is a phrase that will need its own lawyer. <span class="k">${OC.last} +8.</span> <span class="warn">Patience −6.</span>`; } },
          { label: "Ask them to fund and fix after", hint: "Ask the investors to fund now and let you fix the problem after. It works if they trust you, and a financing is a relationship built on exactly that. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 10); tire(a, 3); if (t >= 3) { press(8); G.pat += 5; return `${a.name} asks ${SK.partnerName} directly. He says "fund it" on the call, over ${OC.last}'s visible objection. <span class="good">${CASE.lbl.you} +8, Patience +5.</span>`; } if (t >= 2) { kess(3); return `${SK.partnerName} agrees to fund most of it now. <span class="k">${OC.last} +3.</span>`; } kess(9); return `${OC.last}: "Our fund doesn't do that." ${SK.partnerName} says nothing. <span class="k">${OC.last} +9.</span>`; } },
        ] : [
          { label: "Close", hint: "Close as it stands. The money moves, the founder has the cash to keep going, and whatever is in the documents is the relationship with these investors for the next five years.", stat: null, who: null, run: () => { press(5); return `The wire lands at 3:52. Your client screenshots the bank balance and sends it to nobody, just to look at it. <span class="good">${CASE.lbl.you} +5.</span>`; } },
          { label: "Ask for one more thing", hint: "Ask for one more concession at closing. Greedy, and the investors are as tired as you are and want it done. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 11); tire(a, 3); if (t >= 3) { press(6); return `${a.name} asks for the seat without a vote to become a real one, for your client's pick. ${OC.last} sighs and says yes. <span class="good">${CASE.lbl.you} +6.</span>`; } if (t >= 2) return `${OC.last} laughs. You close anyway.`; kess(5); G.pat -= 4; return `${OC.last}, offended, reopens something small in return, and ${SK.partnerName} files the moment away for the next board meeting. <span class="k">${OC.last} +5.</span> <span class="warn">Patience −4.</span>`; } },
        ] },
      { title: "The agreement on the side", text: () => `After the wire, ${OC.last} sends a one-page agreement on the side, giving ${SK.investor} more reporting than the other investors get and the right to put money into the next round before anyone else. It was not in the term sheet.`,
        options: [
          { label: "Sign the reporting half, strike the rest", hint: "Sign the part that gives investors information about the company and strike the rest. Reasonable people can agree to be kept informed. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 3); if (t >= 2) { press(4); return `${a.name} signs the harmless half and strikes the half that would tie your client's hands next round. ${OC.last} accepts. <span class="good">${CASE.lbl.you} +4.</span>`; } kess(4); return `${a.name} strikes. ${OC.last} pushes. You sign most of it. <span class="k">${OC.last} +4.</span>`; } },
          { label: "Sign it, keep the peace", hint: "Sign it all and keep the peace. The money is in, and a small fight now costs more than the term is worth. Patience up.", stat: null, who: null, run: () => { kess(6); G.pat += 4; return `You sign it all, because your client does not have another fight in ${SK.cl.her} this month. <span class="k">${OC.last} +6.</span> <span class="good">Patience +4.</span>`; } },
        ] },
