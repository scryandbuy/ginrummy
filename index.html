    { title: "Who pays", text: () => `${SK.co} is bigger. ${SK.co2} has the thing that makes the venture work. ${SK.cl.last} assumes they split fees 50/50. ${SK.cl2.last} assumed ${SK.cl.last} was paying.`,
      options: [
        { label: "Split it by ownership", hint: "Split the fees by ownership share. The bigger partner pays more, which is fair, and the smaller partner has less say over the bill. Drafting.", stat: "dra", who: "any", run: a => { tire(a, 2); G.pat -= 3; G.pat2 += 6; G.hrs += 6; return `${a.name} proposes 65/35, like the venture. ${SK.cl.last} grumbles and agrees. <span class="warn">${SK.cl.last} −3.</span> <span class="good">${SK.cl2.last} +6, Budget +6.</span>`; } },
        { label: "Split it evenly", hint: "Split the fees evenly. Simple, and the smaller partner pays a larger share of what it has.", stat: null, who: null, run: () => { G.pat += 4; G.pat2 -= 5; return `50/50. ${SK.cl2.last} writes the number down slowly. <span class="good">${SK.cl.last} +4.</span> <span class="warn">${SK.cl2.last} −5.</span>`; } },
        { label: "Bill the venture, not the partners", hint: "Bill the joint venture itself, so neither partner pays out of pocket. Clever, and the venture does not exist yet, so someone still has to fund the bill. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 3); if (t >= 2) { G.hrs += 10; G.pat += 3; G.pat2 += 3; return `${a.name} structures the fee as a venture expense, paid at closing. Nobody pays today, which everyone likes. <span class="good">Budget +10, both +3.</span>`; } return `The firm's finance committee has questions. Split evenly for now.`; } },
      ] },
    { title: "The third party", text: () => `The venture needs ${/^[aeiou]/i.test(SK.thirdWhat) ? "an" : "a"} ${SK.thirdWhat} from ${SK.third}. ${ucf(SK.third)}'s counsel is ${OC.name} of ${OC.firm}. ${counselIntroLine()}`,
      options: [
        { label: () => `Brief the team on ${OC.her}`, hint: () => `Every opposing lawyer has habits. An hour learning ${OC.hers} means ${OC.hers} favorite move lands softer when ${OC.she} uses it. Research.`, stat: "res", who: "any", run: a => { tire(a, 3); G.f.knowOC = true; if (OC.id === "ibeh") Object.values(team).forEach(x => x.hooks["+res"] = true); if (OC.id === "tobias") Object.values(team).forEach(x => x.hooks.patience = true); if (OC.id === "venkat") G.f.principalsEasy = true; return `${a.name} walks the team through ${OC.last}'s last three deals. <span class="note">${OC.style}. ${OC.know}</span>`; } },
        { label: () => `Send ${OC.her} a friendly note`, hint: () => `Send the ${TROLE()}'s lawyer a short, civil note before the first draft. Deals close on trust between the lawyers, and a good relationship now makes ${OC.her} quicker to split differences later. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 1); if (t >= 3) { G.f.civil = true; return `${a.name} sends two lines. ${OC.last}: "Let's get this done." <span class="note">Differences will split easier.</span>`; } return `${OC.last}'s reply is ${OC.hers} signature block.`; } },
        { label: "Get to work", hint: "Skip the courtesies and start on the documents. Saves the hour; the other side's habits stay a surprise.", stat: null, who: null, run: () => `You open ${SK.third}'s first draft. It is long.` },
      ] },
  ] };
const JV_THIRD = { title: () => `The ${SK.thirdWhat}`, kind: "deal", room: "Negotiating with the outside party the venture depends on. This is the part where you are on one side of the table.", intro: () => `${SK.third} holds the one thing the venture cannot build itself. ${OC.last} knows it.`,
  beats: () => [
    { title: "The term", text: () => `${ucf(SK.third)} offers ${/^[aeiou]/i.test(SK.thirdWhat) ? "an" : "a"} ${SK.thirdWhat} for ten years. The venture's business plan needs twenty-five. ${OC.last}: "Ten is generous."`,
      options: [
        { label: "Push for twenty-five with renewal rights", hint: () => `Push for the twenty-five-year ${SK.thirdWhat} with rights to renew. The venture's whole plan depends on it, and a short term means the ${TROLE()} owns the business. Drafting.`, stat: "dra", who: "any", run: a => { tire(a, 5); return dealhit(a, 10, p => `${a.name} gets fifteen with two five-year renewals. Not twenty-five. Enough. ${press(p)}`, p => `${a.name} attaches the business plan. ${OC.last} reads it and comes back at twenty. ${press(p)}`, p => `${a.name}: "Ten years and ${SK.cl.last} owns a half-built ${SK.venture}. Twenty-five and it owns a partner." ${OC.last} takes it upstairs. Twenty-five, with conditions. ${press(p + 3)}`, () => `${OC.last}: "Ten." Nothing moves.`, () => { G.hrs -= 2; return `${a.name} overreaches on renewals and ${OC.last} pulls the offer to "reconsider." Two weeks lost. ${kess(6)} Budget −2.`; }); } },
        { label: "Take ten, build in an option to buy", hint: () => `Take the shorter term but build in the right to buy the ${SK.thirdWhat} outright later. Less certainty now, and a path to owning it. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); const p = [0, 3, 6, 9, 12][t]; press(p); return `${a.name} takes the ten years and adds a right to buy ${SK.thirdWhat} outright at year eight, at a formula price. ${OC.last} agrees to the option and fights the formula. <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
      ] },
    { title: "Who guarantees", text: () => `${ucf(SK.third)} wants a guarantee: if the venture fails, someone with real money pays ${TFEE()}. ${SK.co} has real money. ${SK.cl.last} has noticed that ${SK.cl2.last} has gone quiet.`,
      options: [
        { label: "Both partners guarantee, in proportion", hint: () => `Both partners guarantee the ${SK.thirdWhat} in proportion to their ownership. Fair on paper, and the smaller partner may not have the balance sheet to back its share. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 4); if (t >= 2) { press(6); G.pat2 -= 4; return `${a.name} drafts a 65/35 guarantee. ${OC.last} accepts. ${SK.cl2.last} signs and looks at ${SK.cl.last} the whole time. <span class="good">${CASE.lbl.you} +6.</span> <span class="warn">${SK.cl2.last} −4.</span>`; } kess(5); return `${OC.last} wants a single guarantor, and nothing moves. <span class="k">${OC.last} +5.</span>`; } },
        { label: () => `${SK.co} guarantees, ${SK.co2} owes ${SK.cl.last}`, hint: "The big partner guarantees everything and the small partner owes it back. The other side is satisfied, and the relationship between your two clients tilts.", stat: null, who: null, run: () => { press(5); G.pat -= 6; G.pat2 += 4; G.f.bigGuarantees = true; return `${SK.cl.last} signs the guarantee alone. ${SK.cl2.last} signs a separate promise to cover ${SK.cl2.hers} share. ${SK.cl.last} does not love it. <span class="good">${CASE.lbl.you} +5.</span> <span class="warn">${SK.cl.last} −6.</span> <span class="good">${SK.cl2.last} +4.</span> <span class="note">${SK.cl.He} is now carrying ${SK.cl2.her}, and both of them know it.</span>`; } },
        { label: "Offer a cash deposit instead", hint: () => `Offer the ${TROLE()} a cash deposit instead of personal guarantees. Money in an account satisfies a ${TROLE()} faster than a promise, and it keeps both partners' balance sheets clean. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { press(7); return `${a.name} proposes eighteen months of ${TFEE()} in a locked account instead of a guarantee. ${OC.last} likes money more than promises. <span class="good">${CASE.lbl.you} +7.</span>`; } return `${OC.last}: "Our client prefers a guarantee." Nothing moves.`; } },
      ] },
    { title: "The last draft", text: () => `${OC.last} sends the final ${SK.thirdWhat} agreement at 11:50 p.m. with "clean," which is what everyone writes at that hour whether it is true or not.`,
      options: [
        { label: "Compare it line by line", hint: "Compare the new draft against the last one you approved, line by line. Tedious, and the only way to know what changed. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", OC.id === "ibeh" && !G.f.knowOC ? 10 : 8); tire(a, 6); if (t >= 3) { press(8); return `${a.name} finds that "the venture" is now defined to include both parent companies, which would make ${SK.co} liable for everything. ${OC.last}: "Oversight." <span class="good">${CASE.lbl.you} +8.</span>`; } if (t >= 2) { press(3); return `Two unflagged changes, both fixed. <span class="good">${CASE.lbl.you} +3.</span>`; } kess(7); return `${a.name} skims. Something in the definitions has changed. <span class="k">${OC.last} +7.</span>`; } },
        { label: "Send it to both clients", hint: "Trust the draft and send it to both clients. Everyone is tired, including whoever made the changes.", stat: null, who: null, run: () => { alive().forEach(a => a.burn = Math.max(0, a.burn - 5)); kess(5); return `You send the draft on without reading it again and everyone gets a night's sleep. What that costs, you will not see until later. <span class="k">${OC.last} +5.</span> <span class="good">Team Burnout −5.</span>`; } },
      ] },
  ] };
const JV_GOVERN = { title: "Between the partners", kind: "office", noCounsel: true, room: "The agreement between your two clients covers who controls what, who pays when money is needed, and how either one gets out. Every clause favors one of them over the other.", intro: () => `The third party is handled. Now the hard part: the agreement between ${SK.co} and ${SK.co2}. Every clause favors one of your clients over the other, and you wrote it.`,
  beats: () => [
    { title: "Control", text: () => `65/35 ownership. ${SK.cl.last} assumes 65% means ${SK.cl.she} decides. ${SK.cl2.last} assumed "partners" meant partners.`,
      options: [
        { label: "Majority rules, with a short list of vetoes for the minority", hint: "The majority owner controls the board, and the minority gets a short list of decisions it can block. The standard structure, because it usually works. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); if (t >= 2) { G.pat += 4; G.pat2 += 2; return `${a.name} gives ${SK.cl.last} the wheel and ${SK.cl2.last} the brakes, meaning no selling, no new debt and no changing the business without ${SK.cl2.her}. Both can live with it. <span class="good">${SK.cl.last} +4, ${SK.cl2.last} +2.</span> ${rec(4)}`; } G.pat2 -= 4; return `${a.name} drafts majority rule. The veto list is short. ${SK.cl2.last} notices. <span class="warn">${SK.cl2.last} −4.</span>`; } },
        { label: "50/50 on the board regardless of ownership", hint: "Split the board evenly regardless of who owns more. The smaller partner will love it, the bigger one will not, and a tied board cannot decide anything.", stat: null, who: null, run: () => { G.pat -= 7; G.pat2 += 9; G.f.deadlockRisk = true; return `Equal board seats. ${SK.cl2.last} beams, ${SK.cl.last} asks what happens in a tie, and it turns out nobody in the room has a good answer. <span class="warn">${SK.cl.last} −7.</span> <span class="good">${SK.cl2.last} +9.</span>`; } },
        { label: "Put in a tiebreaker: an independent director", hint: "Add an independent director to break ties. Someone neither partner controls, so a deadlock has a way out that is not a lawsuit. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { G.pat += 3; G.pat2 += 4; return `${a.name} finds a retired ${SK.industryPerson} both CEOs respect. An independent seat, and the vote that breaks a tie. <span class="good">${SK.cl.last} +3, ${SK.cl2.last} +4.</span> ${rec(5)}`; } return `Nobody can agree on who is independent enough.`; } },
      ] },
    { title: "Money later", text: () => `If the venture needs more cash, who puts it in? ${SK.cl.last} can. ${SK.cl2.last} cannot, and if ${SK.cl2.she} doesn't match, ${SK.cl2.hers} 35% shrinks.`,
      options: [
        { label: () => `Dilute ${SK.cl2.her} if ${SK.cl2.she} can't pay`, hint: () => `If a partner cannot fund ${SK.cl2.hers} share, ${SK.cl2.hers} ownership shrinks. Standard, brutal, and it means the partner with money eventually owns the venture. Drafting.`, stat: "dra", who: "any", run: a => { tire(a, 3); G.pat += 5; G.pat2 -= 7; return `${a.name} drafts it the normal way: pay or shrink. ${SK.cl2.last} reads the clause twice. <span class="good">${SK.cl.last} +5.</span> <span class="warn">${SK.cl2.last} −7.</span>`; } },
        { label: () => `Let ${SK.cl2.her} contribute in kind`, hint: () => `Let the smaller partner contribute expertise instead of cash and count it as capital. It keeps ${SK.cl2.her} in, and someone has to put a number on what ${SK.cl2.hers} knowledge is worth. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { G.pat -= 2; G.pat2 += 7; return `${a.name} builds a formula: ${SK.co2}'s ${SK.contribution} counts toward ${SK.cl2.hers} share whenever the venture needs more money, at an agreed rate. ${SK.cl.last} grumbles at the rate and accepts. <span class="warn">${SK.cl.last} −2.</span> <span class="good">${SK.cl2.last} +7.</span> ${rec(4)}`; } G.pat -= 4; return `The valuation of ${SK.cl2.hers} contribution becomes a fight. ${SK.cl.last} wins it. <span class="warn">${SK.cl.last} −4.</span>`; } },
        { label: "Cap the total anyone can be asked for", hint: "Cap how much either partner can be asked to contribute. Protects both from an open-ended demand, and limits what the venture can raise from its owners. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 3); if (t >= 2) { G.pat += 2; G.pat2 += 4; return `${a.name} caps future calls at a number both can stomach. <span class="good">${SK.cl.last} +2, ${SK.cl2.last} +4.</span>`; } return `A cap. ${SK.cl.last} wants it higher, ${SK.cl2.last} lower. You land somewhere.`; } },
      ] },
    { title: "Getting out", text: () => `What if one of them wants to leave? ${SK.cl.last} wants a right to buy ${SK.cl2.her} out at a formula. ${SK.cl2.last} wants a right to sell to anyone. They discover this in front of you.`,
      options: [
        { label: "Right of first refusal", hint: "If either partner wants to sell, the other gets to match the offer first. Standard, and it keeps strangers out of the venture. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 3); if (t >= 2) { G.pat += 3; G.pat2 += 3; return `${a.name} drafts it so ${SK.cl2.she} can sell to anyone and ${SK.cl.she} gets to match the price. Both hear what they wanted. <span class="good">Both +3.</span> ${rec(4)}`; } G.pat -= 2; G.pat2 -= 2; return `The draft is fine. The conversation about it is not. <span class="warn">Both −2.</span>`; } },
        { label: "Tell them the truth about exits", hint: "Tell both clients plainly that most ventures end, and that the exit terms matter more than anything else in the document. They will not enjoy hearing it. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 3) { G.pat += 6; G.pat2 += 6; return `${a.name}: "Most of these end in five years. Let's write down how, while you still like each other." Silence. Then both laugh. <span class="good">Both +6.</span>`; } if (t >= 2) return `${a.name} says it gently. They hear it.`; G.pat -= 4; G.pat2 -= 4; return `${a.name} says it and ${SK.cl.last} says "we're not most people." <span class="warn">Both −4.</span>`; } },
      ] },
  ] };
const JV_SPLIT = { title: "The call", kind: "office", noCounsel: true, room: "Your two clients' interests have split. What you do next is an ethics question as much as a legal one.", intro: () => `${SK.cl2.last} calls you. Alone. ${SK.cl2.He} wants to talk about ${SK.cl.last}, and ${SK.cl2.she} wants you not to tell ${SK.cl.her}.`,
  beats: () => [
    { title: () => `What ${SK.cl2.she} says`, text: () => `${SK.cl2.last} has had an approach from ${SK.rival}, who would fund ${SK.cl2.hers} share and take ${SK.cl.last}'s place. ${SK.cl2.He} hasn't said no. "You're my lawyer too," ${SK.cl2.she} says. "Aren't you?"`,
      options: [
        { label: () => `Stop the call. Tell ${SK.cl2.her} ${SK.cl2.she} needs ${SK.cl2.hers} own lawyer.`, hint: () => `Stop the call and tell ${SK.cl2.her} ${SK.cl2.she} needs ${SK.cl2.hers} own lawyer. ${SK.cl2.He} is about to tell you something you cannot keep from the other client. The right answer, and it costs you a client. Reputation.`, stat: null, who: null, run: () => { G.f.separated = true; G.f.repBonus = (G.f.repBonus || 0) + 6; G.pat2 = 40; G.hrs -= 4; return `You stop ${SK.cl2.her} before ${SK.cl2.she} says more. "I represent both of you. I can't hear this without telling ${SK.cl.her}. You need your own lawyer for this conversation, and probably for the rest of the deal." ${SK.cl2.He} is upset. Then: "Okay." <span class="note">You just lost a third of the fee and did the right thing. The state bar, which decides who keeps a law license, would agree. So would ${SK.cl.last}, if ${SK.cl.she} knew.</span> <span class="warn">Budget −4.</span>`; } },
        { label: "Listen, then tell them both", hint: () => `Hear ${SK.cl2.her} out, then tell both clients what ${SK.cl2.she} said, because the waiver you drafted requires it. Charm to keep either of them from firing you.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 10 - (G.f.waiver ? 2 : 0)); tire(a, 4); if (t >= 3) { G.pat -= 5; G.pat2 -= 8; G.f.disclosed = true; return `You hear ${SK.cl2.her} out and then, because the document they signed says you must, tell ${SK.cl.last}. The next meeting is very quiet. It is also honest, and by the end of it they have agreed on a price for ${SK.cl2.her} to stay. <span class="warn">${SK.cl.last} −5, ${SK.cl2.last} −8.</span> <span class="note">Awkward. Survivable. Legal.</span>`; } if (t >= 2) { G.pat -= 8; G.pat2 -= 12; G.f.disclosed = true; return `You tell both. ${SK.cl2.last} feels betrayed. ${SK.cl.last} feels lied to. Both are right. <span class="warn">${SK.cl.last} −8, ${SK.cl2.last} −12.</span>`; } G.pat -= 12; G.pat2 -= 15; G.f.disclosed = true; return `You tell both, badly. ${SK.cl.last} asks whether you're "even on ${SK.cl.hers} side." ${SK.cl2.last} asks the same thing. <span class="warn">${SK.cl.last} −12, ${SK.cl2.last} −15.</span>`; } },
        { label: "Keep it to yourself", hint: () => `Keep what ${SK.cl2.she} said to yourself. Cheaper today, and it is the kind of secret that ends careers when it comes out.`, stat: null, who: null, run: () => { G.pat2 += 8; G.f.secret = true; return `You say nothing to ${SK.cl.last}. ${SK.cl2.last} is grateful. <span class="good">${SK.cl2.last} +8.</span> <span class="note">You now know something one client hid from the other, and you are keeping it. If this surfaces, it is not a business problem. It is a bar complaint.</span>`; } },
      ] },
    { title: "The next morning", text: () => G.f.separated ? `${SK.cl2.last} has hired ${SK.rivalFirm}. ${SK.cl2.His} new lawyer calls you. He is professional, brisk, and has questions about every clause you wrote.` : G.f.secret ? `${SK.cl.last} calls. ${SK.cl.He} heard something about ${SK.rival} at a dinner. "Did you know about this?"` : `${SK.cl.last} and ${SK.cl2.last} arrive separately. They sit at opposite ends of the table. You sit in the middle, which is where you have been the whole time.`,
      options: G.f.secret ? [
        { label: () => `Tell ${SK.cl.her} now`, hint: "Tell the other client now. Late is better than never, barely, and you have to explain why it is late.", stat: null, who: null, run: () => { G.pat -= 15; G.f.secret = false; G.f.disclosed = true; return `You tell ${SK.cl.her}. ${SK.cl.He} is furious, and says only two words: "You knew." <span class="warn">${SK.cl.last} −15.</span> <span class="note">You kept your license. You may not keep the client.</span>`; } },
        { label: "Deny it", hint: "Tell the other client you knew nothing. It ends the conversation and keeps the peace today, and it is a lie to a client, which is the kind that ends careers when it comes out.", stat: null, who: null, run: () => { G.f.lied = true; G.pat += 3; return `"No." ${SK.cl.He} believes you. <span class="good">${SK.cl.last} +3.</span> <span class="warn">You lied to a client, and only you know it.</span>`; } },
      ] : G.f.separated ? [
        { label: "Answer every question, clause by clause", hint: () => `Walk ${SK.cl2.last}'s new lawyer through every clause you wrote and why. Slow, and it shows there was nothing hidden in the drafting. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 5); if (t >= 2) { press(6); G.pat2 += 6; return `${a.name} spends a day on the phone with ${SK.cl2.last}'s lawyer, clause by clause. He finds nothing to object to and says so to his client. <span class="good">${CASE.lbl.you} +6, ${SK.cl2.last} +6.</span> ${rec(5)}`; } G.pat2 -= 4; return `${a.name} answers most of the questions. The ones left over come back as changes to the draft. <span class="warn">${SK.cl2.last} −4.</span>`; } },
        { label: () => `Get ${SK.cl.last} to signing before the changes land`, hint: () => `Push your remaining client to sign on the current draft before the new lawyer has finished reading it. Fast, and ${SK.cl2.last} will remember being rushed. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 10); tire(a, 3); if (t >= 3) { press(8); G.pat += 6; G.pat2 -= 6; return `${SK.cl.last} signs on Thursday. ${SK.cl2.last}'s lawyer sends a letter about it on Friday. <span class="good">${CASE.lbl.you} +8, ${SK.cl.last} +6.</span> <span class="warn">${SK.cl2.last} −6.</span>`; } G.pat2 -= 8; return `${SK.cl2.last}'s lawyer hears about the push and slows everything down on purpose. <span class="warn">${SK.cl2.last} −8.</span>`; } },
      ] : [
        { label: () => `Renegotiate ${SK.cl2.hers} exit price`, hint: () => `Turn ${SK.cl2.hers} problem into a term by renegotiating what ${SK.cl2.she} gets if ${SK.cl2.she} exits, and put it in writing. A crisis becomes a clause. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 5); if (t >= 2) { press(6); G.pat += 4; G.pat2 += 4; return `${a.name} drafts a buyout formula both can point to when this happens again, because it will. <span class="good">${CASE.lbl.you} +6, both +4.</span> ${rec(5)}`; } return `The formula is fine and nobody is happy with it.`; } },
        { label: "Step out and let the two of them talk", hint: "Leave the two CEOs alone in the room and wait outside. The two of them will settle things their lawyer cannot, and say things their lawyer cannot unsay. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 10); tire(a, 3); if (t >= 3) { G.pat += 10; G.pat2 += 10; press(4); return `Forty minutes. Nobody knows what was said. They come out and ${SK.cl.last} has ${SK.cl.hers} hand on ${SK.cl2.hers} shoulder. <span class="good">Both +10, ${CASE.lbl.you} +4.</span>`; } if (t >= 2) return `Forty minutes. They come out civil.`; G.pat -= 6; G.pat2 -= 6; return `Fifteen minutes. A door closes hard. <span class="warn">Both −6.</span>`; } },
      ] },
  ] };
const JV_CLOSING = { title: "Signing", kind: "closing", noCounsel: true, room: "Signing: three signature pages, and both of your clients have to sign for any of it to count.", intro: () => `Three signature pages. ${ucf(SK.third)} has already signed. The other two are on the table.`,
  beats: () => [
    { title: "The room", text: () => (G.pat < 35 || G.pat2 < 35) ? `One of them is not going to sign. You can see it from the door. ${G.pat < G.pat2 ? SK.cl.last : SK.cl2.last} has a lawyer's letter in a folder and has not taken off ${G.pat < G.pat2 ? SK.cl.hers : SK.cl2.hers} coat.` : `Both partners are here. Both pens are out. Someone has sent a fruit basket, and nobody will admit to it.`,
      options: (G.pat < 35 || G.pat2 < 35) ? [
        { label: "One last concession", hint: "Give the unhappy partner one last concession to get to signing. Cheap if it is small, and it teaches them that unhappiness pays. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 5); const who = G.pat < G.pat2 ? "pat" : "pat2"; if (t >= 2) { G[who] += 20; kess(4); return `${a.name} redrafts one clause on the spot. It costs the other partner a little. The coat comes off. <span class="good">${G.pat < G.pat2 ? SK.cl.last : SK.cl2.last} +20.</span>`; } return `${a.name} offers. It is not enough. The coat stays on.`; } },
        { label: "Let them walk", hint: "Tell them the deal should not close as it stands and let them walk. The right advice for two partners who cannot agree on the exit, and the firm loses the closing fee for giving it. Reputation.", stat: null, who: null, run: () => { G.f.walked = true; return `You say, to the room, that nobody should sign something they don't believe in. Nobody speaks for a while. <span class="note">The venture dies today, and that was the right advice.</span>`; } },
      ] : [
        { label: "Sign", hint: "Sign. The venture exists, both clients get what they came for, and the document is now the relationship, whatever is in it.", stat: null, who: null, run: () => { press(6); return `Three signatures go down. ${SK.cl.last} and ${SK.cl2.last} shake hands and then, after a second, hug. The basket has good pears. <span class="good">${CASE.lbl.you} +6.</span>`; } },
        { label: "Read the signature pages one more time", hint: "Read the signature pages one more time. Paranoid, and the version of paranoid that has caught a wrong date on a page nobody else looked at. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 3); if (t >= 3) { press(8); return `${a.name} notices ${SK.third}'s signature page references draft 11. You are on draft 12. ${ucf(SK.third)} re-signs by courier. <span class="good">${CASE.lbl.you} +8.</span>`; } press(3); return `The pages are right. Everyone signs. <span class="good">${CASE.lbl.you} +3.</span>`; } },
      ] },
  ] };

/* =====================================================================
   STRUCTURE 7: the appeal. Short. All paper. Someone else lost the trial. Three judges, no jury, no witnesses.
   Findings (2 of 3 live): ap_instruction, ap_evidence, ap_statute. One hazard always live: ap_waiver (was the issue preserved?).
   ===================================================================== */
const AP_RECORD = { title: "The record", kind: "paper", room: "An appeal is a second look by higher judges at whether the trial was run correctly. The first job is reading the record to find the mistake.", intro: () => `${SK.cl.name} lost at trial. ${SK.priorFirm} tried the case and has stopped returning ${SK.cl.her} calls, which is what firms do after they lose. Twelve boxes of transcript arrive at your office. You have thirty days to find what went wrong.`,
  beats: () => [
    { title: "The transcript", text: () => `Nine days of trial came to 2,400 pages. Somewhere in there is the mistake that gets a new trial. Or there isn't.`,
      options: [
        { label: "Read it all", hint: "The whole team reads the entire trial record, every ruling, every witness and every objection. Exhausting, and it finds everything the trial lawyer missed. Research. Tiring.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); alive().forEach(x => tire(x, 6)); G.hrs -= 4; let out = `Three people spend three days on it, working in a shared document of page cites.`; if (live("ap_instruction") && t >= 2) { G.f.ap_instruction = true; out += ` The jury was told the wrong rule about how sure they had to be before finding against your client. Nobody objected at the time. <span class="note">It is a bad instruction. Whether it counts depends on whether anyone said so at the time.</span> ${rec(8)}`; } if (live("ap_evidence") && t >= 3) { G.f.ap_evidence = true; out += ` The judge kept out ${SK.excluded} on a ruling that reads worse each time you read it. ${rec(7)}`; } return out + ` <span class="warn">Everyone Burnout +6.</span> Budget −4.`; } },
        { label: "Read the rulings, skip the testimony", hint: "Read only the judge's rulings and skip the testimony. Faster, and appeals are about what the judge did, not what witnesses said. Unless the error is in what a witness was allowed to say. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 5); G.hrs -= 2; let out = `${a.name} reads every ruling from the bench.`; if (live("ap_evidence") && t >= 2) { G.f.ap_evidence = true; out += ` One of them excluded ${SK.excluded} for a reason that does not survive a second reading. ${rec(7)}`; } else out += ` They are mostly right.`; return out + ` Budget −2.`; } },
        { label: "Read the jury instructions and the statute", hint: "Have the junior read the jury instructions and the statute. Appeals are won on law, and the junior can check whether the jury was told the right law. Junior. Research.", stat: "res", who: "junior", run: a => { const t = roll(a, "res", 9); tire(a, 5); let out = `${a.name} reads the instructions against the statute, line by line.`; if (live("ap_statute") && t >= 2) { G.f.ap_statute = true; out += ` The trial judge read "${SK.statuteWord}" to mean something the legislature almost certainly did not. ${rec(9)} <span class="note">A pure question of law. Appellate courts love those.</span>`; } if (live("ap_instruction") && t >= 3) { G.f.ap_instruction = true; out += ` And the instruction about how sure the jury had to be is wrong too. ${rec(6)}`; } return out; } },
      ] },
    { title: "Was it preserved?", text: () => `An appeals court only fixes mistakes someone complained about at the time. ${SK.priorFirm}'s trial lawyer objected to some things and not others. You need to know which.`,
      options: [
        { label: "Find every objection", hint: "Find every objection the trial lawyer made. An appeals court will only fix errors someone objected to at the time; if nobody objected, the error is gone. Tedious and decisive. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); if (t >= 2) { G.f.preservedChecked = true; const lost = d(3) === 1; if (lost) { G.f.ap_waiver = true; return `${a.name} finds them all. The instruction issue was never raised. The trial lawyer sat there. <span class="warn">One of your best arguments may be gone.</span> ${rec(3)}`; } return `${a.name} finds them all. Everything you need was objected to, some of it twice. ${rec(7)} <span class="note">Everything was objected to at the time, so the whole appeal is on the table.</span>`; } return `${a.name} finds most of them. There are gaps. You will find out in the reply brief whether they matter.`; } },
        { label: "Call the trial lawyer", hint: "Call the lawyer who lost the trial. He does not want to talk to you, and he knows things about the case that are not in the record. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 10); tire(a, 3); if (t >= 3) { G.f.preservedChecked = true; return `Forty minutes. He is defensive, then helpful. He did object to the jury instruction, in a quiet conference at the judge's bench during trial, and he can point to the page of the transcript where it happened. That is what you needed. ${rec(8)}`; } if (t >= 2) return `He is polite and remembers nothing useful.`; G.pat -= 4; return `He tells your client you called him "to assign blame." <span class="warn">Patience −4.</span>`; } },
      ] },
    { title: "The client", text: () => `Your client wants to know if ${SK.cl.she} will win. ${SK.cl.He} has already lost once, expensively.`,
      options: [
        { label: "Tell her the odds honestly", hint: "Tell the client that most appeals lose. It lowers her patience and it is true, and a client who knows the odds does not feel betrayed by a loss. Drafting to say it well.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 2); G.f.honest = true; G.pat += t >= 2 ? 6 : 2; return `${a.name}: "Most appeals lose. This one has ${["ap_instruction", "ap_evidence", "ap_statute"].filter(k => G.f[k]).length} real issue${["ap_instruction", "ap_evidence", "ap_statute"].filter(k => G.f[k]).length === 1 ? "" : "s"}, which is more than most." Your client is reassured. <span class="good">Patience +${t >= 2 ? 6 : 2}.</span>`; } },
        { label: "Tell her it's strong", hint: "Tell her the appeal is strong. It might be. She will be a calmer client, and this is the sentence she remembers if it fails. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); G.f.promised = true; G.pat += t >= 2 ? 10 : 4; return `${a.name} projects confidence. Your client is relieved for the first time in a year. <span class="good">Patience +${t >= 2 ? 10 : 4}.</span> <span class="note">You promised, and appeals are the worst place to have made one.</span>`; } },
      ] },
  ] };
const AP_BRIEF = { title: "The brief", kind: "paper", room: "The brief is the written argument. Appeals are mostly decided on paper, so this is most of the case.", intro: () => `You get thirty pages, a word limit, and a court that reads the first three and decides whether to read the rest.`,
  beats: () => [
    { title: "Which argument goes first", text: () => `You have ${["ap_instruction", "ap_evidence", "ap_statute"].filter(k => G.f[k]).length || "no"} real issue${["ap_instruction", "ap_evidence", "ap_statute"].filter(k => G.f[k]).length === 1 ? "" : "s"}. The court will read one of them carefully.`,
      options: [
        { label: "Lead with the statute", hint: "Lead the brief with the statute. Appellate judges like deciding what the law means, and a pure question of law gets a fresh look with no deference to the trial judge. Drafting.", stat: "dra", who: "any", when: () => G.f.ap_statute, lock: "You did not find a statutory error in the record.", run: a => { tire(a, 6); G.f.ledStatute = true; return dealhit(a, 8, p => `${a.name} opens with three pages on what "${SK.statuteWord}" means. It reads like a dictionary entry written by someone angry. ${press(p + 4)}`, p => `${a.name} leads with the statute and cites what the legislature said when it wrote the statute, which nobody at trial bothered to read. ${press(p + 4)}`, p => `${a.name}'s first sentence is the whole case in eleven words. The rest is footnotes. ${press(p + 7)} ${rec(5)}`, () => `${a.name} leads with the statute. It is correct and dull.`, () => `${a.name} leads with the statute and overstates it. ${OC.last}'s brief will quote the overstatement. ${kess(5)}`); } },
        { label: "Lead with the instruction", hint: "Lead with the jury instruction. If the jury was told the wrong law, the verdict cannot stand. It only works if the trial lawyer objected to the instruction at the time. Drafting.", stat: "dra", who: "any", when: () => G.f.ap_instruction, lock: "You did not find an error in the jury instructions.", run: a => { tire(a, 6); G.f.ledInstruction = true; if (G.f.ap_waiver) { kess(8); return `${a.name} leads with the instruction. ${OC.last}'s response brief points out, in its first paragraph, that nobody objected. The panel will read that paragraph. <span class="k">${OC.last} +8.</span>`; } return dealhit(a, 8, p => `${a.name} walks the three judges who will hear the appeal through what the jury was told the law was and what it should have been told, and how the wrong version made the verdict easier to reach. ${press(p + 3)}`, p => `${a.name} puts what the judge told the jury the law was next to what the statute actually says, and then stops writing. Side by side, the difference is obvious, and the panel will see it without being told. ${press(p + 3)}`, p => `${a.name} finds three cases reversing on this exact instruction. ${press(p + 6)} ${rec(5)}`, () => `It is a competent argument about a real error.`, () => `${a.name} argues the instruction and ${OC.last} finds a case saying the error was "harmless." It might have been. ${kess(5)}`); } },
        { label: "Lead with the excluded evidence", hint: "Lead with the evidence the judge kept out. Show the appeals court what the jury never saw and argue it would have changed the result. Drafting.", stat: "dra", who: "any", when: () => G.f.ap_evidence, lock: "You did not find an evidentiary error in the record.", run: a => { tire(a, 6); return dealhit(a, 9, p => `${a.name} describes ${SK.excluded} in one paragraph and lets the panel imagine the trial with it in. ${press(p + 2)}`, p => `${a.name} attaches the excluded exhibit. Judges are curious. ${press(p + 2)}`, p => `${a.name}: "The jury decided this case without the one document that answers it." ${press(p + 5)}`, () => `A fair argument. Evidence rulings are hard to overturn.`, () => `${a.name} overstates what the evidence would have shown. ${OC.last} has the exhibit and it is less than promised. ${kess(6)}`); } },
        { label: "Argue everything, in order of page number", hint: "Argue every error in the order it happened. It is what you do when you do not have a lead issue, and appellate judges can tell; nothing is left out, and nothing stands out. Drafting.", stat: "dra", who: "any", when: () => !G.f.ap_statute && !G.f.ap_instruction && !G.f.ap_evidence, hide: true, run: a => { tire(a, 6); kess(6); return `${a.name} writes a brief that reads like a list of complaints. It is thirty pages and it is accurate. <span class="k">${OC.last} +6.</span>`; } },
      ] },
    { title: "How hard will the appeals court look?", text: () => `Appeals courts do not redo the trial. They take the trial judge's word on most things and only step in where the judge got the law itself wrong. So the first fight in every appeal is over how closely the court will look at each mistake. ${OC.last}'s brief will say the trial judge deserves the benefit of the doubt on everything. Yours has to explain why not.`,
      options: [
        { label: "Argue the judge got the law wrong, not the facts", hint: "Present each mistake as the trial judge misreading the law, rather than making a judgment call. Appeals courts give the trial judge the benefit of the doubt on judgment calls, and none on the law, so this is how you get a fresh look. It takes research to find cases that back the framing. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); const p = [0, 2, 5, 8, 11][t]; press(p); return `${a.name} finds cases treating each of your issues as a mistake about the law, the kind an appeals court looks at fresh. ${t >= 2 ? "The framing holds." : OC.last + " will argue they were judgment calls all along."} <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
        { label: "Admit the court will give the judge the benefit of the doubt, and win anyway", hint: "Admit up front that the appeals court will lean toward the trial judge, and argue the mistakes were bad enough to matter even so. Judges notice a brief that does not pretend, and trust the rest of it more. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); if (t >= 3) { press(7); G.judge = clamp((G.judge || 0) + 1, -3, 3); return `${a.name} admits in one sentence that the court will lean toward the trial judge, then spends ten pages showing the mistakes were bad enough to matter anyway. The panel, which reads a hundred briefs pretending otherwise, notices. <span class="good">${CASE.lbl.you} +7.</span> <span class="note">Credibility with the bench.</span>`; } if (t >= 2) { press(3); return `${a.name} admits the court will lean toward the trial judge and argues the mistakes matter anyway. The panel has no reason to doubt it. <span class="good">${CASE.lbl.you} +3.</span>`; } kess(4); return `${a.name} gives away more than needed. The brief reads like it expects to lose. <span class="k">${OC.last} +4.</span>`; } },
      ] },
    { title: "The reply", text: () => `${OC.last}'s response brief arrives. It is good. It ${G.f.ap_waiver && G.f.ledInstruction ? "leads with the objection nobody made" : "argues on every point that the mistake made no difference to the verdict"}. You have fifteen pages to answer it.`,
      options: [
        { label: "Answer the strongest point first", hint: "Answer the other side's strongest point first. A brief that hides from its weakest issue tells the court where to look. Drafting.", stat: "dra", who: "any", run: a => { tire(a, 5); return dealhit(a, 9, p => `${a.name} takes ${OC.last}'s best argument apart in the first two pages and spends the rest on yours. ${press(p)}`, p => `${a.name}'s reply is eleven pages. Every one of them is a response to something ${OC.last} actually said. ${press(p)}`, p => `${a.name} finds a case ${OC.last} cited that, read to the end, holds the opposite. Page one. ${press(p + 5)} ${rec(4)}`, () => `A reply that replies. Nothing more.`, () => `${a.name} spends the reply re-arguing the opening brief. The panel has read the opening brief. ${kess(5)}`); } },
        { label: "Keep it to five pages", hint: "Reply in five pages. A short reply says you are not worried, and judges read short things carefully. Charm, on paper.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 3) { press(8); return `Five pages. The last sentence is "We rest on our opening brief." Judges love a lawyer who stops talking. <span class="good">${CASE.lbl.you} +8.</span>`; } if (t >= 2) { press(3); return `Five pages, and every one of them earns its place. <span class="good">${CASE.lbl.you} +3.</span>`; } kess(5); return `Five pages, and one of ${OC.last}'s points goes unanswered. The panel will ask about it. <span class="k">${OC.last} +5.</span>`; } },
      ] },
  ] };
const AP_ARGUMENT = { title: "Oral argument", kind: "hearing", room: "Oral argument is fifteen minutes in front of three judges who have read the briefs and have questions. You are there to answer them, not to give a speech.", intro: () => `There are three judges, fifteen minutes a side, and a red light that means stop. Judge Fairbanks, in the middle seat, runs the argument and has already written a draft opinion. You are here to change one mind.`,
  beats: () => [
    { title: "The first question", text: () => `${team.lead.name} gets nine words in before Judge Fairbanks interrupts: "Counsel, was this objection preserved?" ${G.f.preservedChecked ? "You know the answer." : "You are about to find out if you know the answer."}`,
      options: [
        { label: "Answer in one sentence with a page number", hint: "Answer the judge's question in one sentence and the page of the record where it happened. The only right way to answer an appellate judge; anything longer sounds like avoiding it. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 7); const bonus = G.f.preservedChecked ? 4 : 0; return attack(a, 10, p => `${a.name}: "Yes, Your Honor, at page 1,412." The judge flips to it and nods. ${press(p + bonus)}`, p => `${a.name} answers and then, smartly, stops. The judge asks a follow-up that is about who should win, which is where you want her. ${press(p + bonus)}`, p => `${a.name}: "Twice, Your Honor. At the bench conference and again on the record. Pages 1,412 and 1,418." The judge looks at ${OC.last}. ${press(p + bonus + 4)}`, () => `${a.name} answers in a paragraph. The judge waits for the sentence in it.`, () => `${a.name} says "I believe so." Appellate judges do not want to know what you believe. ${kess(7)}`); } },
        { label: "Argue from the record", hint: "Argue from the record, page numbers from memory, no notes. It shows the court you know the case better than anyone, and it only works if the team read everything. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 8); const bonus = G.f.preservedChecked ? 5 : 0; return attack(a, 10, p => `${a.name} knows the record cold and it shows, page numbers from memory, no notes. ${press(p + bonus)}`, p => `${a.name} answers the preservation question and then corrects the judge's page number, politely. The judge checks. ${a.name} is right. ${press(p + bonus)}`, p => `${a.name} answers a question the judge had not quite asked, and it was the one that mattered. Judge Fairbanks writes something down. ${press(p + bonus + 3)}`, () => `Careful, accurate, forgettable.`, () => `${a.name} loses the thread and ${OC.last}, given the last word, is kind about it. ${kess(6)}`); } },
      ] },
    { title: "The red light", text: () => `Two minutes left. Judge Ashdown, who has said nothing, leans forward: "If we agree with you, what happens next? A new trial? Judgment?"`,
      options: [
        { label: "Ask for judgment", hint: "Ask the court to decide the case for your client outright, not just order a new trial. Bold, and courts rarely do it, and asking frames what a new trial would look like. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 5); const bonus = G.f.ap_statute ? 4 : 0; return attack(a, 11, p => `${a.name}: "Judgment, Your Honor. The statute means what it says, and under what it says, ${SK.cl.last} wins." ${press(p + bonus)}`, p => `${a.name} asks for judgment and, when pressed, concedes a new trial "would also correct the error." ${press(p + bonus)}`, p => `${a.name}: "Judgment. There is nothing for a jury to decide once the law is read correctly." Judge Fairbanks is persuaded and stops writing. ${press(p + bonus + 5)}`, () => `${a.name} asks for judgment. The panel looks skeptical. A new trial is the likely floor.`, () => `${a.name} asks for judgment on a record that does not support it, and Judge Ashdown says so. ${kess(6)}`); } },
        { label: "Ask for a new trial", hint: "Ask for a new trial. It is the most an appeals court usually gives, so asking for it looks realistic, and winning it means trying the whole case again. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); const p = [0, 3, 6, 8, 10][t]; press(p); return `${a.name} asks for a new trial with the right instruction and the right evidence. Judge Ashdown nods. It is the answer she wanted. <span class="good">${CASE.lbl.you} +${p}.</span>`; } },
      ] },
  ] };

      { enc: () => MG_REMEDY, beat: { title: "The firewall", text: () => `The Agency's deputy director says, unprompted, that the Agency "has no confidence in firewalls." Your client has offered one anyway. The room has the feel of a conversation both sides have had before, in other cases, with other people.`,

        { label: "Tell him everyone loses", hint: "True. He knows.", stat: null, who: null, run: () => { tire(a, 3); return `"Everyone loses." "Yes," he says, "everyone does." He goes back in. <span class="warn">${a.name} Burnout +3.</span>`; } }] }) },
    { when: (a, r) => a.level >= 20, make: (a, r) => ({ title: "The second one", text: () => `Late, after a long day, ${a.name} tells you the second loss without being asked. A client who lied to him. He found out in closing argument, from the look on the client's face, and finished the closing anyway. "I was very good that day," he says. "I hated every word."`,

        { label: "Say nothing", hint: "Some stories don't want a response.", stat: null, who: null, run: () => `You say nothing. He nods, as if you had said the right thing.` }] }) },
    { when: (a, r) => a.level >= 30, make: (a, r) => ({ title: "The third", text: () => `${a.name} asks to take the key moments on this one. Not because he is the best on it. Because it looks like the third loss, the one he never talks about, and he wants to see if he is different now.`,
      options: [{ label: "Give him the key moments", hint: "The big beats are his for the rest of this matter. Permanent +1 Advocacy either way it ends.", stat: null, who: null, run: () => { addTrait(r, "Faced it: +1 Advocacy, and he tells all three stories now"); bonus(r, "adv", 1); return `You give him the key moments. He does not tell you how the third one ended until the case is over, and then he tells the whole room, and it is not the story anyone expected. <span class="good">${a.name}: permanent +1 Advocacy.</span>`; } },
        { label: "Keep the plan", hint: "The matter comes first. He gains 'Steady' instead.", stat: null, who: null, run: () => { addTrait(r, "Steady: whole team's Burnout costs drop by 1"); return `"We stick to the plan." He nods. He is excellent in his role, as always, and the third story stays where it is. <span class="good">${a.name}: new trait, Steady.</span>`; } }] }) },

  oksana: { beats: [
    { when: (a, r) => a.lastTier >= 3 || a.level >= 12, make: (a, r) => ({ title: "The law school", text: () => `A junior at the other firm recognizes ${a.name}'s name from a casebook. "We studied your purchase agreement in Contracts." ${a.name}: "Which draft?" The junior does not know there were drafts.`,
      options: [{ label: "Enjoy it for her", hint: "She won't.", stat: null, who: null, run: () => `You tell her that's a compliment. "It's a footnote," she says. "In a casebook nobody finishes." She is, very slightly, pleased.` },
        { label: "Ask which draft it was", hint: "Research. She knows.", stat: null, who: null, run: () => { G.rec += 4; r.arcFlags.draft = true; return `"Draft six. Draft nine was better." She explains why for ten minutes and two of the points apply to this deal. ${rec(0)}<span class="note">Into the memo it goes.</span>`; } }] }) },
    { when: (a, r) => a.level >= 20, make: (a, r) => ({ title: "The offer from the other side", text: () => `${OC.firm} has made ${a.name} an offer. Partner, immediately, corporate group. She tells you the same afternoon, which is more than most would do. "I haven't decided," she says. She has decided something.`,

        { label: "Tell her to take it if it's right", hint: "Honest. Flight risk.", stat: null, who: null, run: () => { r.flight = true; r.arcFlags.freedO = true; return `"If it's right, take it." She looks at you like you have said something in a language she did not expect. <span class="warn">Flight risk.</span> <span class="note">She stays, and she is watching.</span>`; } }] }) },
    { when: (a, r) => a.level >= 30, make: (a, r) => ({ title: "Draft nine", text: () => `${a.name} has written the definitive version of the agreement this practice uses. Eighty pages, every clause annotated. She could publish it and become the standard. Or keep it in the firm and become the edge.`,
      options: [{ label: "Publish it", hint: "Reputation +6. Every firm gets it. She becomes a name.", stat: null, who: null, run: () => { F.rep = clamp(F.rep + 6, 0, REP_CAP()); addTrait(r, "Published: +1 Charm, and opposing deal counsel quote her at her"); bonus(r, "cha", 1); return `It is published in the spring and cited within a month. Opposing counsel start quoting her drafts to her, which she finds hilarious. <span class="good">Reputation +6. ${a.name}: permanent +1 Charm.</span>`; } },
        { label: "Keep it in-house", hint: "The whole team drafts better. Permanent +1 Drafting for her.", stat: null, who: null, run: () => { addTrait(r, "The form: +1 Drafting, and teammates get +1 Drafting on deals"); bonus(r, "dra", 1); return `It stays in the firm's system. Every deal team uses it. Nobody outside knows why Whitlock's agreements are suddenly so clean. <span class="good">${a.name}: permanent +1 Drafting. Teammates draft better on deals.</span>`; } }] }) },
  ] },
  desmond: { beats: [
    { when: (a, r) => a.lastTier >= 3 || a.level >= 12, kinds: ["depo", "trial", "hearing", "paper", "deal"], make: (a, r) => ({ title: "How's your mother", text: () => `${a.name} greets ${OC.last} by first name and asks about ${OC.hers} mother. ${OC.last} answers, at length. ${a.name} knew the answer. He always knows the answer.`,
      options: [{ label: "Ask how he does it", hint: "He'll show you.", stat: null, who: null, run: () => { r.arcFlags.showed = true; return `"I read the alumni magazines. All of them. Every law school. It takes a Sunday." He is completely serious. <span class="note">He reads the alumni magazines.</span>`; } },
        { label: "Let him work", hint: "Don't look at the magician's hands.", stat: null, who: null, run: () => { press(2); return `${OC.last} is measurably warmer for the rest of the day. <span class="good">${CASE.lbl.you} +2.</span>`; } }] }) },
    { when: (a, r) => a.level >= 20, make: (a, r) => ({ title: "His own", text: () => `${a.name}'s mother is ill. He mentions it once, in passing, in the same tone he uses for weather, and does not mention it again. He is on time for everything. He is, for the first time you have seen, slightly less charming.`,
      options: [{ label: "Bench him for the rest of the matter, with pay", hint: "The team loses him. He goes to Lagos.", stat: null, who: null, run: () => { a.out = true; r.leave = 1; r.arcFlags.sent = true; return `"Go." He argues for four minutes and then does not. He is gone six weeks. He calls twice, both times to ask about the case. <span class="note">${a.name} is off this matter and the next.</span>`; } },
        { label: "Keep him, lighten his load", hint: "He stays. He'd rather.", stat: null, who: null, run: () => { r.arcFlags.stayedD = true; tire(a, 4); return `He stays. You give him the easy beats. He does them perfectly and does not thank you for it. <span class="warn">${a.name} Burnout +4.</span>`; } }] }) },
    { when: (a, r) => a.level >= 30, kinds: ["depo", "trial", "hearing", "paper", "deal", "closing"], make: (a, r) => ({ title: "The funeral", text: () => `${a.name} comes back from the funeral and, on his first day, ${OC.last} asks about his mother. He had asked about ${OC.hers}, once, years ago. ${OC.last} remembered. He stands in the hallway for a moment afterward.`,
      options: [{ label: "Give him the day", hint: "Permanent: he settles matters more generously for the firm.", stat: null, who: null, run: () => { addTrait(r, "Remembered: settlement offers 15% richer when he is on the matter"); return `He takes the day. He comes back the next morning and is, somehow, more himself than before. Opposing counsel settle with him because they like him, and now they know why they like him. <span class="good">${a.name}: new trait.</span>`; } },
        { label: "Put him straight back to work", hint: "It's what he'd ask for. Permanent +1 Charm.", stat: null, who: null, run: () => { addTrait(r, "Kept moving: +1 Charm"); bonus(r, "cha", 1); return `"What do you need?" he says. You tell him. He does it. He is grateful, in the way of people who would rather not be asked how they are. <span class="good">${a.name}: permanent +1 Charm.</span>`; } }] }) },
  ] },
});

/* ---------------- template arcs, keyed by quirk ---------------- */
const TEMPLATE_ARCS = {
  footnotes: { beats: [

    { when: a => a.level >= 10, make: (a, r) => { const P = PRO(a); return { title: "The treatise", text: () => `${a.name} has been writing a treatise chapter on the side. Two hundred footnotes. ${P.She} shows you the draft like it is contraband.`, options: [{ label: "Read it", hint: "Budget −1. Two of the footnotes matter to this case.", stat: null, who: null, run: () => { G.hrs -= 1; G.rec += 5; return `Two footnotes apply. ${rec(0)}<span class="note">Filed away.</span> Budget −1.`; } }, { label: "Tell ${her} to publish it".replace("${her}", P.her), hint: "Reputation +1.", stat: null, who: null, run: () => { F.rep = clamp(F.rep + 1, 0, REP_CAP()); return `${P.She} publishes it. Nobody reads treatises. Three judges do. <span class="good">Reputation +1.</span>`; } }] }; } },
    { when: a => a.level >= 16, kinds: ["paper", "depo", "trial", "hearing"], make: (a, r) => { const P = PRO(a); return { title: "The one nobody read", text: () => `${a.name} finds the thing that decides this case in a footnote to a footnote. ${P.She} could tell the team. Or ${P.she} could tell you, quietly, and let you be the one who found it.`, options: [{ label: "Give ${her} the room".replace("${her}", P.her), hint: "Permanent +1 Research. The team knows who found it.", stat: null, who: null, run: () => { addTrait(r, "Read forty-one: +1 Research"); bonus(r, "res", 1); press(4); return `${P.She} tells the room. The room is impressed. <span class="good">${a.name}: permanent +1 Research. ${CASE.lbl.you} +4.</span>`; } }, { label: "Take it to the client yourself", hint: "Patience +8. ${She} remembers.".replace("${She}", P.She), stat: null, who: null, run: () => { G.pat += 8; addTrait(r, "Uncredited: works alone more, +1 Drafting"); bonus(r, "dra", 1); return `The client is thrilled with you. ${a.name} goes back to the footnotes. <span class="good">Patience +8. ${a.name}: permanent +1 Drafting.</span>`; } }] }; } },
  ] },
  nightowl: { beats: [
    { when: a => a.burn / a.max >= 0.5 || a.level >= 6, make: (a, r) => { const P = PRO(a); return { title: "2 a.m.", text: () => `${a.name}'s emails arrive between one and four in the morning. They are excellent. ${P.She} looks, at nine, like someone who has been awake since one.`, options: [{ label: "Ask when ${she} sleeps".replace("${she}", P.she), hint: "Charm.", stat: null, who: null, run: () => { return `"Afternoons." ${P.She} is not joking. <span class="note">${P.She} is not going to change.</span>`; } }, { label: "Move ${hers} deadlines to noon".replace("${hers}", P.hers), hint: "Small kindness.", stat: null, who: null, run: () => { a.burn = Math.max(0, a.burn - 6); return `${P.She} notices. ${P.She} does not mention it. <span class="good">${a.name} Burnout −6.</span>`; } }] }; } },
    { when: a => a.level >= 10, make: (a, r) => { const P = PRO(a); return { title: "The building", text: () => `Security calls. ${a.name} is asleep in a conference room at 7 a.m. and there is a client breakfast in it at 8.`, options: [{ label: "Let ${her} sleep, move the breakfast".replace("${her}", P.her), hint: "Patience −3.", stat: null, who: null, run: () => { G.pat -= 3; a.burn = Math.max(0, a.burn - 10); return `The breakfast moves. The client asks why. <span class="warn">Patience −3.</span> <span class="good">${a.name} Burnout −10.</span>`; } }, { label: "Wake ${her} up".replace("${her}", P.her), hint: "${She} is mortified.".replace("${She}", P.She), stat: null, who: null, run: () => { tire(a, 5); return `${P.She} is dressed and at ${P.hers} desk in four minutes and does not make eye contact for a day. <span class="warn">${a.name} Burnout +5.</span>`; } }] }; } },
    { when: a => a.level >= 16, make: (a, r) => { const P = PRO(a); return { title: "Daylight", text: () => `${a.name} asks, awkwardly, whether ${P.she} could work a different schedule. Officially. Noon to whenever. ${P.She} has never asked for anything.`, options: [{ label: "Yes", hint: "Permanent: Burnout costs drop for ${her}. The committee raises an eyebrow.".replace("${her}", P.her), stat: null, who: null, run: () => { addTrait(r, "Noon start: all Burnout hits 2 lighter"); F.rep = clamp(F.rep - 1, 0, REP_CAP()); return `Yes. The committee sends a one-line email about "optics." ${a.name}'s work gets better. <span class="good">${a.name}: new trait.</span> <span class="warn">Reputation −1.</span>`; } }, { label: "No, but", hint: "Permanent +1 Research, and ${she} keeps the 2 a.m. emails.".replace("${she}", P.she), stat: null, who: null, run: () => { addTrait(r, "Kept the hours: +1 Research"); bonus(r, "res", 1); return `"No. But nobody will check when you leave." ${P.She} understands exactly what that means. <span class="good">${a.name}: permanent +1 Research.</span>`; } }] }; } },
  ] },
  flight: { beats: [
    { when: a => a.level >= 5, make: (a, r) => { const P = PRO(a); return { title: "The call", text: () => `${a.name} takes a call in the hall. Recruiter. ${P.She} comes back and says nothing about it, which tells you ${P.she} is thinking about leaving.`, options: [{ label: "Say nothing back", hint: "It's ${hers} to raise.".replace("${hers}", P.hers), stat: null, who: null, run: () => `You say nothing. ${P.She} looks relieved and slightly disappointed.` }, { label: "Ask what they offered", hint: "Charm.", stat: null, who: null, run: () => { r.arcFlags.askedF = true; return `${P.She} tells you. It is a lot. <span class="note">${P.She} appreciates being asked.</span>`; } }] }; } },
    { when: a => a.level >= 10, make: (a, r) => { const P = PRO(a); return { title: "The counteroffer", text: () => `${a.name} has a written offer now. ${P.She} puts it on your desk, which is a question.`, options: [{ label: "Go to the committee", hint: "Reputation −1. ${She} stays for now.".replace("${She}", P.She), stat: null, who: null, run: () => { F.rep = clamp(F.rep - 1, 0, REP_CAP()); r.arcFlags.countered = true; return `The committee matches most of it. ${P.She} stays. <span class="warn">Reputation −1.</span>`; } }, { label: "Tell ${her} the truth about the other firm".replace("${her}", P.her), hint: "You know people there. Charm.", stat: null, who: null, run: () => { r.arcFlags.warned = true; return `You tell ${P.her} three things about the other firm. Two are unflattering and true. ${P.She} tears up the offer, literally, which is dramatic. <span class="note">${P.She} stays, for reasons.</span>`; } }] }; } },
    { when: a => a.level >= 16, make: (a, r) => { const P = PRO(a); return { title: "The last call", text: () => `A third offer. Better than the others. ${a.name} does not put this one on your desk. ${P.She} tells you at the end of a long day, in the elevator, like it is a confession.`, options: [{ label: "Let ${her} go well".replace("${her}", P.her), hint: "${She} leaves. Reputation +2 for how you handled it. ${She} may send you clients.".replace(/\$\{She\}/g, P.She), stat: null, who: null, run: () => { departs(r, a, null); F.rep = clamp(F.rep + 2, 0, REP_CAP()); return `"Go. Do well." ${P.She} does. Two years later a client shows up with ${P.hers} name in the referral line. <span class="good">Reputation +2.</span> <span class="note">${a.name} is off the roster.</span>`; } }, { label: "Ask ${her} to stay one more year".replace("${her}", P.her), hint: "${She} stays. Flight risk cured. Permanent +1 to ${hers} best stat.".replace("${She}", P.She).replace("${hers}", P.hers), stat: null, who: null, run: () => { r.flight = false; const st = statsOf(r); const best = Object.keys(st).filter(k => k !== "sta").sort((x, y) => st[y] - st[x])[0]; addTrait(r, "Stayed the year: rooted, and better at what " + P.she + " does"); bonus(r, best, 1); return `"One more year." ${P.She} thinks about it for the length of the elevator ride. "Okay." ${P.She} stays longer than a year. <span class="good">${a.name}: flight risk gone, permanent +1 ${STAT[best]}.</span>`; } }] }; } },

  grinder: { beats: [
    { when: a => a.burn / a.max >= 0.6 || a.level >= 8, make: (a, r) => { const P = PRO(a); return { title: "The wall", text: () => `${a.name} has never been tired before. ${P.She} is now. ${P.She} does not seem to know what to do with it.`, options: [{ label: "Send ${her} home".replace("${her}", P.her), hint: "${She} argues.".replace("${She}", P.She), stat: null, who: null, run: () => { a.burn = Math.max(0, a.burn - 12); return `${P.She} argues for three minutes and goes. <span class="good">${a.name} Burnout −12.</span>`; } }, { label: "Give ${her} the hardest beat".replace("${her}", P.her), hint: "${She} wants it.".replace("${She}", P.She), stat: null, who: null, run: () => { press(3); tire(a, 6); return `${P.She} does it. Well. ${P.She} looks worse. <span class="good">${CASE.lbl.you} +3.</span> <span class="warn">${a.name} Burnout +6.</span>`; } }] }; } },
    { when: a => a.level >= 10, make: (a, r) => { const P = PRO(a); return { title: "The marathon", text: () => `${a.name} ran a marathon Sunday and is at ${P.hers} desk Monday at seven. ${P.She} mentions the time. It was a good time.`, options: [{ label: "Congratulate ${her}".replace("${her}", P.her), hint: "Small.", stat: null, who: null, run: () => { a.burn = Math.max(0, a.burn - 4); return `${P.She} is pleased for exactly four seconds. <span class="good">${a.name} Burnout −4.</span>`; } }, { label: "Ask why", hint: "${She} thinks about it.".replace("${She}", P.She), stat: null, who: null, run: () => { r.arcFlags.why = true; return `"I don't know how to not." ${P.She} says it like a diagnosis. <span class="note">${P.She} heard ${P.her}self say it.</span>`; } }] }; } },
    { when: a => a.level >= 16, make: (a, r) => { const P = PRO(a); return { title: "The month off", text: () => `${a.name} asks for a month. ${P.She} has never taken more than three days. ${P.She} asks like ${P.she} expects to be told no.`, options: [{ label: "Yes", hint: "Off the roster one matter. Permanent +10 max Burnout.", stat: null, who: null, run: () => { r.leave = 1; addTrait(r, "Took the month: +10 max Burnout"); bonus(r, "sta", 1); return `${P.She} goes somewhere without email. ${P.She} comes back and is, for the first time, sustainable. <span class="good">${a.name}: permanent +10 max Burnout. Off the next matter.</span>`; } }, { label: "After this matter", hint: "${She} nods. Permanent +1 Drafting, and ${she} never asks again.".replace("${She}", P.She).replace("${she}", P.she), stat: null, who: null, run: () => { addTrait(r, "Never asked again: +1 Drafting"); bonus(r, "dra", 1); return `"After this one." ${P.She} nods. After this one there is another one. ${P.She} does not ask again. <span class="good">${a.name}: permanent +1 Drafting.</span>`; } }] }; } },

  quiet: { beats: [

    { when: a => a.level >= 10, make: (a, r) => { const P = PRO(a); return { title: "The review", text: () => `${a.name}'s annual review. The committee has written "who?" in the margin, and not as a joke.`, options: [{ label: "Write three pages about ${her}".replace("${her}", P.her), hint: "Budget −1. Reputation +1.", stat: null, who: null, run: () => { G.hrs -= 1; F.rep = clamp(F.rep + 1, 0, REP_CAP()); return `You write it. The committee reads it. "Who?" is crossed out. <span class="good">Reputation +1.</span> Budget −1.`; } }, { label: "Let the work speak", hint: "It doesn't, to committees.", stat: null, who: null, run: () => { tire(a, 4); return `The review is fine. ${P.She} reads the margin. <span class="warn">${a.name} Burnout +4.</span>`; } }] }; } },
    { when: a => a.level >= 16, kinds: ["office", "deal", "paper", "closing"], make: (a, r) => { const P = PRO(a); return { title: "The room", text: () => `A client meeting where the client only talks to the loudest person. The loudest person is wrong. ${a.name} knows the answer and is waiting to be asked.`, options: [{ label: "Ask ${her}, in front of everyone".replace("${her}", P.her), hint: "Permanent +1 Charm. The quiet stays but it's chosen now.", stat: null, who: null, run: () => { addTrait(r, "Asked: +1 Charm, still quiet, on purpose"); bonus(r, "cha", 1); press(5); return `"${a.name}, what do you think?" ${P.She} tells them. It takes forty seconds and it is right. <span class="good">${a.name}: permanent +1 Charm. ${CASE.lbl.you} +5.</span>`; } }, { label: "Let ${her} stay invisible".replace("${her}", P.her), hint: "Permanent: untouchable to opposing counsel, ever.", stat: null, who: null, run: () => { addTrait(r, "Invisible: opposing counsel never targets " + P.her); return `${P.She} stays quiet. Opposing counsel forget ${P.she} exists, permanently, which is a superpower in this business. <span class="good">${a.name}: new trait.</span>`; } }] }; } },

  const ok = EVENTS.filter(e => !["feud2", "raid2", "raid3", "reg2", "reg3", "referral", "mp_junior", "mp_hearing"].includes(e.id) && e.when());

  { id: "liar", t: "The letter", d: "Lie to a client and live with what follows.", test: c => c.f.lied },
  { id: "partner_deal", t: "A partner, not a check", d: "Close a Series B with the investor as a partner.", test: c => c.structure === "seriesb" && c.credit >= 130 * c.mult },
  { id: "reversed", t: "Reversed", d: "Win an appeal outright.", test: c => c.structure === "appeal" && c.credit >= 120 * c.mult },

  { id: "ofcounsel", t: "Of Counsel", d: "Lose three in a row and be demoted to Of Counsel.", test: c => F.runs.some(r => r.ending === "ofcounsel") },
  { id: "survived", t: "Not today", d: "Talk the executive committee out of demoting you.", test: c => !!F.everSurvived },
  { id: "second_run", t: "A new partner", d: "Start a second run.", test: c => F.run.n >= 2 },
  { id: "credit1000", t: "Rainmaker", d: "Earn 1,000 origination credit in total.", test: c => (F.totalCredit || 0) >= 1000 },
];
function checkAchievements(ctx) {
  F.ach = F.ach || {}; const got = [];
  ACHIEVEMENTS.forEach(a => { if (F.ach[a.id]) return; let ok = false; try { ok = a.test(ctx); } catch (e) { ok = false; } if (ok) { F.ach[a.id] = F.cases; got.push(a); } });
  return got;
}
function showRecord(tab) {
  showCaseUI(false); const u = $("firmUI"); const log = F.log || []; const earned = Object.keys(F.ach || {}).length;
  u.innerHTML = `<h2>The Record</h2><div class="row"><button class="btn ${tab !== "ach" ? "primary" : ""}" id="tabLog">Case Log (${log.length})</button><button class="btn ${tab === "ach" ? "primary" : ""}" id="tabAch">Achievements (${earned} of ${ACHIEVEMENTS.length})</button></div>`;
  if (tab === "ach") {
    ACHIEVEMENTS.forEach(a => { const has = F.ach && F.ach[a.id]; const c = document.createElement("div"); c.className = "card" + (has ? "" : " dim"); c.innerHTML = has ? `<div class="top"><span class="nm">${a.t}</span><span class="rar">Matter ${has}</span></div><div class="q">${typeof a.d === "function" ? "Finish an associate's story." : a.d}</div>` : `<div class="top"><span class="nm" style="opacity:.5">Not yet</span></div><div class="q" style="opacity:.6">${typeof a.d === "function" ? "Finish an associate's story." : a.d}</div>`; u.appendChild(c); });
  } else {
    if (!log.length) { const p = document.createElement("p"); p.className = "note"; p.textContent = "No matters yet."; u.appendChild(p); }
    log.slice().reverse().forEach(e => { const c = document.createElement("div"); c.className = "card"; c.innerHTML = `<div class="top"><span class="nm">${e.caption}</span><span class="rar">Run ${e.run} · ${["", "Routine", "Demanding", "Bet the Firm"][e.tier] || ""}</span></div><div class="q"><b>${e.result}</b></div><div class="st">${e.team.join(", ")} · against ${e.oc} · ${e.credit} credit</div>`; u.appendChild(c); });
  }
  const back = document.createElement("button"); back.className = "btn primary"; back.style.marginTop = "12px"; back.textContent = "Back to the Firm"; back.onclick = showFirm; u.appendChild(back);
  $("tabLog").onclick = () => showRecord("log"); $("tabAch").onclick = () => showRecord("ach"); window.scrollTo(0, 0);
}


/* ---------------- how to play ---------------- */
function showHelp() {
  showCaseUI(false); const u = $("firmUI");
  const sec = (t, body, open) => `<details ${open ? "open" : ""} style="border-top:1px solid var(--rule);padding:10px 0"><summary style="font:600 17px 'Source Serif 4',Georgia,serif;cursor:pointer;color:var(--ink)">${t}</summary><div class="reveal" style="font-size:15px;margin-top:8px">${body}</div></details>`;
  u.innerHTML = `<h2>How to Play</h2><div class="meta" style="font-size:15px;line-height:1.5">You are a partner at Whitlock, Sterne &amp; Grieve, a New York law firm. You run a small group of associates. You take matters, win or lose them, build a reputation, and try to get your name on the door before the executive committee loses patience with you.</div>` +
  sec("How a run works", `<p>The long game is the firm. The first partner who reaches reputation 100 puts a name on the door and hands the group to a successor. The successor carries the reputation forward and needs 200 for the second name. The third name, at 300, wins the game and the managing partner's chair.</p><p>A run is one partner's tenure. It ends when your name goes on the letterhead, or when you lose three matters in a row and the executive committee demotes you to Of Counsel. When you hand off the group you choose who takes it, and some choices decide the next name for you. Three straight losses gets you a hearing, not an automatic demotion; your reputation decides most of it and you get one argument.</p><p><b>Reputation</b> is the score. Wins raise it. Losses cost it, every time. Your roster and your reputation carry over to your successor; a demotion resets reputation.</p><p>From the second run on, each new partner picks a <b>specialty</b>: Litigator, Dealmaker, Reformer, or none. When the group passes to a new partner, the run just finished leaves something behind: a clean sheet, every mandate met, nobody broken or walked out, and the originals still together each earn the new partner a bonus. It changes which matters come to you and on what terms, not the story.</p><p>The committee gives you a <b>mandate</b>: a goal and a few matters to hit it. Some mandates take more than one matter to complete. Meet it and there is a bonus and a new one. Miss it and the committee sends a note. At reputation 30 and 60 they review you and offer something.</p>`, true) +
  sec("Taking a matter", `<p>Three offers at a time. Each card tells you the client, who you represent, the other side's lawyer, and the size: <b>Routine</b>, <b>Demanding</b>, or <b>Bet the Firm</b>. Bigger matters start with the other side ahead, pay more, and unlock as your reputation grows. Each matter can be taken once.</p><p><b>Litigation</b> is a lawsuit. <b>Corporate</b> is a deal. Some matters are fast, some run for months, and appeals happen entirely on paper.</p><p>You pick three associates. Any of them can be sent on any beat, so who you bring decides what you can do well. The staffing screen marks who <b>fits</b> the matter; it does not say why. The least experienced is the <b>junior</b>, marked on every beat, and a few things in every matter are the junior's to do. Choices you did not earn show up greyed out with the reason, so you can see what an earlier decision cost you.</p>`) +
  sec("Inside a matter", `<p>A matter is a series of encounters: a deposition, a hearing, a term sheet, a closing. Each encounter is a few beats. A beat is a situation, two or three choices, and an associate to send.</p><p><b>The race.</b> Litigation tracks your <b>Pressure</b> against the other side's number. Deals track <b>Terms</b>. Get ahead and stay ahead. How the matter ends depends on the gap and on what you found along the way. Every matter ends as a <b>win</b>, a <b>loss</b>, or a <b>mixed result</b>. A settlement or a closed deal is not automatically a win; the terms decide, and the ending tells you which it was. Walking a client away from a bad deal can be a win.</p><p><b>Client patience.</b> Falls when you are behind, rises when you are ahead, and moves with your choices. At zero, you are fired. Some matters have two clients with separate patience, and they will not always want the same thing.</p><p><b>Budget.</b> Hours. Run out and everyone on the team gets tired.</p><p><b>The record.</b> Some of what you do builds a hidden record (the label changes with the matter: Record, Diligence, Clean-up, Groundwork). It pays off at trial or closing. The prose will tell you when something goes into it. It will not tell you the number.</p><p><b>Dice.</b> Every action rolls. Five outcomes: backfire, miss, okay, good, great. Better associates roll better. Tired ones roll worse.</p><p><b>Offers.</b> Between encounters the other side may propose a settlement or, in a deal, a handshake on the terms as they stand. Take it and the matter ends early, graded on the terms. Decline and press on. Counter if you are ahead. In a government merger case the choices are wider: sell something, promise something, or pay to make the states go away.</p><p><b>Twists.</b> Something unplanned happens once or twice a matter.</p><p><b>Who's who.</b> The pill in the header lists everyone in the matter and whose side they are on.</p>`) +
  sec("Associates", `<p>Five stats. <b>Research</b> finds things. <b>Drafting</b> writes and structures deals. <b>Advocacy</b> argues and cross-examines. <b>Charm</b> handles people: clients, witnesses, opposing counsel. <b>Stamina</b> is how much they can take.</p><p><b>Burnout.</b> Every action tires them. Hit the limit and they are out for the rest of the matter; afterward they may come back changed, take leave, or leave the firm. Sitting a matter out recovers some; two in a row clears it. The bar on their card tells you how close they are. Where the limit is, you will learn.</p><p><b>Levels.</b> Associates earn experience and level up on their own. Every level lets them take a little more before they burn out. Some levels do more: better dice at 5, 15, 25, and 35, new traits as their rarity allows (Uncommons gain a second at level 10, Rares a third at 15, Legendaries a fourth at 20, and a Rare or Legendary signature is always the last one), and a capstone at 40 for those who can reach it. Rarity caps how far they go: Common, Uncommon, Rare, Legendary.</p><p><b>Quirks</b> are who they are. <b>Traits</b> are earned. <b>Signature abilities</b> on rares and legendaries fire once a matter on their own.</p><p><b>Recruiting.</b> Spend origination credit at three channels with different odds. Legendary associates only join a firm with a name on the door; the recruiting screen shows who is waiting. A duplicate of a recruit counts toward promoting them to the next rarity. Your three original associates never appear in recruiting; they grow another way. When the roster is full you choose: keep a recruit as a spare, or let someone go to make room. Three spares of a tier make one duplicate of any associate at that tier, and nine spares make one duplicate of an associate one tier up, so spare Uncommons can feed a Rare. You can let anyone go from their card.</p><p>Associates have stories. Your three original associates have the longest, and their stories are how they grow. Keep them working and pay attention. Early on the group is small by design; the roster grows as your reputation does.</p>`) +

<b>Budget</b>: hours left on the matter.<br>
<b>Record / Diligence / Clean-up / Groundwork</b>: the hidden work that pays off at the end.<br>
<b>Burnout</b>: how tired an associate is. Too much and they break.<br>
<b>Origination credit</b>: what matters pay the firm. Spend it recruiting.<br>
<b>Reputation</b>: the score. 100 puts the first name on the door, 200 the second, 300 wins.<br>
<b>Mandate</b>: the committee's current ask, on a clock.<br>
<b>Routine / Demanding / Bet the Firm</b>: how hard a matter is.<br>
<b>Settlement / Handshake</b>: ending a matter early by agreement. Graded on the terms.<br>
<b>Win / Loss / Mixed</b>: how every matter is scored, whatever way it ended.<br>

<b>Common / Uncommon / Rare / Legendary</b>: associate rarity, which sets their ceiling.<br>
<b>Quirk / Trait / Signature</b>: what an associate is, what they have earned, what fires on its own.<br>
<b>Duplicates / Spares / Promotion</b>: pulling the same recruit again moves them up a rarity. The original three grow through their stories instead.<br>

<b>Twist</b>: the thing nobody planned for.<br>
<b>Executive committee</b>: the partners who decide whether you keep your group.<br>
<b>Letterhead</b>: your name on the door. The win.<br>
<b>Of Counsel</b>: where partners go after three losses in a row. The other ending.</div>`);
