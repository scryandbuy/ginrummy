/* =====================================================================
   STRUCTURE 8: the defamation trial. A famous actor sues his ex-wife over an op-ed. Jury, cameras, and a client who is also the witness.
   Findings (3 of 4 live): dv_texts, dv_audio, dv_editor, dv_studio. Hazard, always live: your client's own messages.
   ===================================================================== */
const PIECE = () => SK.piece || "essay"; const BOND = () => SK.bond || "marriage"; const REL = () => SK.relation || "ex-wife"; const SRC = () => SK.source || "newspaper"; const SRCWHO = () => SK.sourceWho || "editors"; const SRCONE = () => SK.sourceOne || "editor"; const LOSS = () => SK.lossWord || "franchise"; const SPLIT = () => SK.splitWord || "divorce"; const SENT = () => SK.sentences || "nine sentences";
const exMood = () => [[`${SK.ex} is hostile and answering in as few words as possible.`,`${SK.ex} is guarded and giving nothing away.`,`${SK.ex} is still hostile.`],[`${SK.ex} is careful, and checks with her lawyer before every answer.`,`${SK.ex} is careful.`,`${SK.ex} is being careful with every word.`],[`${SK.ex} is composed.`,`${SK.ex} is calm.`,`${SK.ex} is steady.`],[`${SK.ex} is getting comfortable and talking more than she needs to.`,`${SK.ex} is relaxed now, and volunteering things.`,`${SK.ex} is talking freely.`],[`${SK.ex} is rattled.`,`${SK.ex} is nervous and it is affecting her answers.`,`${SK.ex} is flustered.`]][G.mood + 2][G.step % 3];
const DV_INTAKE = { title: "Intake", kind: "office", room: "Intake is the first meeting with a new client. This one is famous, which changes how the meeting goes and nothing about what you need from it.",
  intro: () => SK.dvIntro || `Your conference room, with the blinds down because there is a photographer across the street. Your client has not been on a set in two years. His ${REL()}, ${SK.ex}, wrote an ${PIECE()} for a national ${SRC()} about surviving a ${BOND()}. It did not name him. Everyone knew.`,
  beats: () => [
    { title: () => `The ${PIECE()}`, text: () => `Your client has the ${PIECE()} printed out. He has underlined ${SENT()}. "She didn't say my name," he says, "and I lost a ${LOSS()} the week it ran." He wants to know if that is a case.`,
      options: [
        { label: "Tell him it is, and it is hard", hint: "Defamation means a false statement of fact that hurt him. Opinion is protected, and so is a true story. Tell him the truth about that before he spends a year of his life on it. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 2); G.f.honest = true; G.pat += t >= 2 ? 5 : 1; return `${a.name} explains what he would have to prove, which is that the ${PIECE()} was about him, that what it implied was false, and that it cost him. He listens, which his agent says he never does. <span class="good">Patience +${t >= 2 ? 5 : 1}.</span>`; } },
        { label: "Tell him it is strong", hint: "He wants to hear that he was wronged. Saying so makes him a happier client today and a harder one to manage later, when the case turns out to be about him too. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); G.f.promised = true; G.pat += t >= 2 ? 10 : 4; return `${a.name} tells him what he came to hear. He relaxes for the first time since he sat down. <span class="good">Patience +${t >= 2 ? 10 : 4}.</span> <span class="note">You promised him something. Remember that at his deposition.</span>`; } },
        { label: "Ask him what he wants the jury to say", hint: "A defamation case is really about a verdict people can read as a sentence. Find out what sentence he needs, because it decides how you try this. Research.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 3); if (t >= 2) { G.f.knowsWhy = true; return `${a.name} asks. He is quiet for a while. "That it wasn't true." Not money, not the ${LOSS()}. That sentence. <span class="note">You know what he is here for, and it is not the number.</span>`; } return `${a.name} asks. He says "everything," which is not an answer a jury can give.`; } },
      ] },
    { title: "The other side of the story", text: () => `Before anything else, you need to know what she will say about him. Your client says there is nothing. His agent, in the hallway afterward, says there are texts.`,
      options: [
        { label: "Make him hand over every message", hint: () => `Whatever he sent her during the ${BOND()} will come out in discovery whether he likes it or not. Reading it now means you are never surprised in front of a jury. Costs budget. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 5); G.hrs -= 3; G.f.readTexts = true; if (t >= 2) { press(3); return `${a.name} spends two days with four years of messages. Some of them are ugly. All of them are now known, which is the point. <span class="good">${CASE.lbl.you} +3.</span> ${rec(6)} Budget −3.`; } return `${a.name} reads them. There is a lot, and some of it is the kind of thing a jury will not forget. ${rec(3)} Budget −3.`; } },
        { label: "Take his word for it", hint: "Move faster and trust the client. If the agent is right, the other side will show you the texts at his deposition, on camera.", stat: null, who: null, run: () => { G.pat += 5; return `You take his word. He is grateful. <span class="good">Patience +5.</span> <span class="note">The agent looked at the floor.</span>`; } },
        { label: "Ask the agent, not the client", hint: "The people around a famous person often know more than he does about what he said. A quiet conversation with the agent is cheaper than a surprise. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); if (t >= 2) { G.f.readTexts = true; return `The agent, over coffee, describes the three messages she is most worried about. Now you know which ones. <span class="note">Not everything, but the worst of it.</span> ${rec(4)}`; } return `The agent is loyal and says nothing useful.`; } },
      ] },
    { title: "The other side", text: () => `${SK.ex}'s lawyer, ${OC.name} of ${OC.firm}, files papers with the court the same afternoon. ${counselIntroLine()}`,
      options: [
        { label: () => `Brief the team on ${OC.her}`, hint: () => `Every opposing lawyer has habits. An hour learning ${OC.hers} means ${OC.hers} favorite move lands softer when ${OC.she} uses it, and in a case this public ${OC.she} will use everything. Research.`, stat: "res", who: "any", run: a => { tire(a, 3); G.f.knowOC = true; if (OC.id === "kessler") G.f.knowKessler = true; if (OC.id === "pruitt") G.hrs += 4; if (OC.id === "sayle") G.judge = (G.judge || 0) + 1; if (OC.id === "voss") Object.values(team).forEach(x => x.hooks.battle = true); return `${a.name} walks the team through ${OC.last}'s last three trials. <span class="note">${OC.style}. ${OC.know}</span>`; } },
        { label: "Ask the judge to ban press comment", hint: "Ask the judge to order both sides to stop talking to the press until the trial is over. It protects your client from himself as much as from her, and judges in famous cases often say yes. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 3); if (t >= 2) { G.f.gag = true; press(3); return `The judge grants it in a day. Nobody may talk about the case outside the courtroom, including a movie star with a phone. <span class="good">${CASE.lbl.you} +3.</span> <span class="note">Fewer twists from the press.</span>`; } return `The judge declines. "This case is already public, counsel."`; } },
        { label: "Get to work", hint: "Skip the ceremony and open the file.", stat: null, who: null, run: () => `You open the ${PIECE()} again and start marking the ${SENT()}.` },
      ] },
  ] };
const DV_DISCOVERY = { title: "Discovery", kind: "paper", room: () => `Discovery is when both sides have to hand over their messages, emails, and recordings. In a case about a ${BOND()}, this is where the ${BOND()} comes out.`,
  intro: () => `The documents go back and forth for six months. Both sides have phones full of things they wish they had not written. The question is who controls how they come out.`,
  beats: () => [
    { title: "Her messages", text: () => `${SK.ex}'s lawyers hand over her texts. Most of them are what you expected. A few of them, sent after the ${SPLIT()}, are warm, even affectionate. They do not read like messages to the man in the ${PIECE()}.`,
      options: [
        { label: "Build the timeline around them", hint: () => `If she wrote to him kindly after the events she describes, a jury will wonder about the ${PIECE()}. Line the messages up against the dates in it. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 4); if (!live("dv_texts")) return `${a.name} lines them up. The warm messages all come from before the period the ${PIECE()} describes, so they prove nothing. ${rec(2)}`; if (t >= 2) { G.f.dv_texts = true; press(7); return `${a.name} finds three messages sent weeks after the last incident in the ${PIECE()}, each one fond. Put next to the ${PIECE()}'s dates, they ask a question the jury will want answered. <span class="good">${CASE.lbl.you} +7.</span> ${rec(6)}`; } return `${a.name} builds the timeline. The messages are warm but the dates are muddled. ${rec(2)}`; } },
        { label: "Save them for cross-examination", hint: "Do not show your hand in the papers. Hold the messages for when she is on the stand and cannot prepare an answer. Riskier, because a surprise can misfire. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 2); if (!live("dv_texts")) return `${a.name} files them away. On a second read, they are less useful than they looked.`; if (t >= 2) { G.f.dv_texts = true; G.f.savedTexts = true; return `${a.name} marks them and says nothing in the filings. <span class="note">She will see them for the first time in front of the jury.</span> ${rec(4)}`; } return `${a.name} marks them. ${OC.last}'s own filing quotes two of them first, with an explanation. The surprise is gone.`; } },
      ] },
    { title: "The recording", text: () => `Your client mentions, as if it were nothing, that he recorded some of their arguments. On his phone. There are eleven files.`,
      options: [
        { label: "Listen to all of them before anyone else does", hint: "Recordings can help or destroy him, and you cannot know which until you hear them. If there is something useful, you want to find it; if there is something terrible, you want to be the first to know. Research. Tiring.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 6); if (!live("dv_audio")) return `${a.name} listens to all eleven, hours of two people being cruel to each other. Nothing in it helps, and some of it hurts. ${rec(2)} <span class="warn">Do not play these for a jury.</span>`; if (t >= 2) { G.f.dv_audio = true; press(8); return `File nine. ${SK.ex}, laughing, tells him she made up a story for a friend "because it was a better story." It is not about the ${PIECE()}, but it is about how she tells stories. <span class="good">${CASE.lbl.you} +8.</span> ${rec(8)} <span class="note">Use it carefully. A jury can turn on a man who records his wife.</span>`; } return `${a.name} listens. The recordings mostly show two people who should not have been married. ${rec(3)}`; } },
        { label: "Hand over every recording, untouched", hint: "The safe legal move is to hand everything over now, so nobody can later say he hid or erased anything. You lose control of what the jury hears first. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 7); tire(a, 3); G.f.producedAudio = true; if (!live("dv_audio")) return `All eleven files go out. ${OC.last} listens to them with more patience than you did.`; G.f.dv_audio = true; press(3); return `All eleven go out. ${OC.last} now knows about file nine too, but so does the judge, and it is in the case. <span class="good">${CASE.lbl.you} +3.</span> ${rec(4)}`; } },
      ] },
    { title: () => `The ${SRC()}`, text: () => `The ${PIECE()} was edited. Somebody at the paper decided which sentences stayed. The paper says its ${SRCWHO()}' emails are none of your business.`,
      options: [
        { label: () => `Fight for the ${SRCONE()}'s emails`, hint: () => `If the ${SRCWHO()} discussed whom the ${PIECE()} was about, that proves the point the other side denies: that it was about him. Newspapers fight hard to keep this private. Costs budget. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 5); G.hrs -= 3; if (!live("dv_editor")) return `The judge orders the emails produced. They are about commas. ${rec(2)} Budget −3.`; if (t >= 2) { G.f.dv_editor = true; press(9); return `The judge orders the emails produced. One of them, from the ${SRCONE()} to a colleague: "readers will know exactly who this is." <span class="good">${CASE.lbl.you} +9.</span> ${rec(8)} Budget −3.`; } return `The judge splits it: some emails, heavily redacted. Nothing you can read is useful. Budget −3.`; } },
        { label: "Prove it with the readers instead", hint: () => `You do not need the ${SRCWHO()} if you can show that the public connected the ${PIECE()} to him through headlines, comments and a talk-show joke the next morning. Cheaper and more public. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 4); const p = [0, 2, 5, 7, 9][t]; press(p); return `${a.name} collects forty headlines from the week the ${PIECE()} ran. Thirty-one name him. <span class="good">${CASE.lbl.you} +${p}.</span> ${rec(3)}`; } },
      ] },
    { title: "The studio", text: () => `Your client says the ${LOSS()} dropped him because of the ${PIECE()}. The studio says it was "a creative decision." Somebody at the studio put the real reason in writing, or nobody did.`,
      options: [
        { label: "Subpoena the studio", hint: () => `Damages are the money the ${PIECE()} cost him, and the ${LOSS()} is most of it. Make the studio hand over the emails about why he was replaced. Studios hate this, and it costs time. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); G.hrs -= 2; if (!live("dv_studio")) return `The studio produces its emails. The decision was about his last two films' box office, and the emails say so plainly. <span class="warn">That is not the damages story he told you.</span> Budget −2.`; if (t >= 2) { G.f.dv_studio = true; press(8); return `An executive's email, the Monday after the ${PIECE()}: "We can't have him on the poster now." <span class="good">${CASE.lbl.you} +8.</span> ${rec(7)} Budget −2.`; } return `The studio produces a thousand pages and the useful sentence, if it exists, is not in them. Budget −2.`; } },
        { label: "Use his agent as the witness", hint: "The agent was on the phone when the studio called. Her account is secondhand, which is weaker than an email, but it is quick and it is free. Charm to get her to testify.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 3); if (t >= 2) { press(4); return `The agent agrees to testify about the phone call. She remembers the exact words. She is also his agent, which the jury will notice. <span class="good">${CASE.lbl.you} +4.</span> ${rec(3)}`; } return `The agent would rather not. Studios have long memories.`; } },
      ] },
  ] };
const DV_HERDEPO = { title: () => `Deposition of ${SK.ex}`, kind: "depo", room: () => `A deposition is questioning the other side under oath, before trial, with a court reporter typing every word. Here the witness is the woman who wrote the ${PIECE()}.`,
  intro: () => `A conference room with too many lawyers in it. ${SK.ex} arrives with two of her own and a publicist who is asked to wait outside. She does not look at your client's chair, which is empty on purpose.`,
  beats: () => [
    { title: () => `The ${PIECE()}, line by line`, text: () => `${SK.ex} is sworn in. ${exMood()} You have the ${PIECE()} with ${SENT()} underlined.`,
      options: [
        { label: "Ask who each sentence is about", hint: () => `The whole case turns on whether the ${PIECE()} was about him. Make her say, sentence by sentence, whom she meant. She will try to say 'no one in particular.' Advocacy.`, stat: "adv", who: "any", run: a => { tire(a, 6); return attack(a, 9, p => `${SK.sentencesCap || "Nine sentences"}, nine answers. Five of them are "my former husband." She catches herself on the sixth. ${press(p)} ${rec(4)}`, p => `${a.name} asks the same question nine times in nine different ways. By the seventh she has stopped pretending it could be anyone else. ${press(p)} ${rec(5)}`, p => `${a.name}: "Who is the man in this sentence?" ${SK.ex}: "You know who." "I need you to say it." She says it. ${press(p + 4)} ${rec(6)}`, () => `${SK.ex}: "It's about my experience." Nine times. ${OC.last} looks pleased.`, () => `${a.name} pushes and ${SK.ex} gives a long, quiet answer about why she wrote it that the court reporter takes down word for word, and that a jury would find moving. ${kess(6)}`); } },
        { label: "Start with the timeline instead", hint: () => `Do not fight about the ${PIECE()} yet. Pin her to dates: when things happened, when she wrote, when she sent the warm messages. Contradictions come later and hit harder. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { G.f.timeline = true; return `${a.name} gets dates for everything in the ${PIECE()} and everything after it. Some of them do not sit well together. ${rec(8)} <span class="note">The dates are fixed on the record now.</span>`; } return `${SK.ex} is vague about dates in a way that sounds practiced. ${OC.last} lets her be.`; } },
        { label: "Let her talk", hint: "Ask open questions and let her fill the silence. Angry witnesses say more than they planned to. So do sympathetic ones, which is the risk. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 3) { mood(1); press(6); return `${a.name} asks about the writing of it and says nothing else for four minutes. In minute three she mentions an ${SRCONE()} "who wanted it sharper." <span class="good">${CASE.lbl.you} +6.</span> ${rec(4)}`; } if (t >= 2) { mood(1); return `She talks. Nothing useful, but she is warmer now, and warm witnesses make mistakes later.`; } mood(-1); kess(4); return `She talks about being afraid of him, and she does it well. Even the court reporter slows down. <span class="k">${OC.last} +4.</span>`; } },
      ] },
    { title: "The warm messages", text: () => G.f.dv_texts ? `You have the messages she sent him after the ${SPLIT()}, the fond ones. ${exMood()}` : `You do not have anything that contradicts her. ${exMood()} This is the part of the day where you wish you did.`,

const KN_DISCOVERY = { title: "Discovery", kind: "paper", room: "Discovery is when the company has to hand over its internal files. In a case about what a company knew, this is the whole war.",

        { label: "Search for the people who would have written it", hint: "Do not read everything. Work out who in the company would have raised the alarm, and demand their files specifically. Faster, and it misses whatever was written by someone you did not think of. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 4); if (!live("kn_memo")) return `${a.name} names four people. Their files are dull. Not this time.`; if (t >= 3) { G.f.kn_memo = true; press(8); return `${a.name} names four people. The third one's files contain ${SK.memoShort} <span class="good">${CASE.lbl.you} +8.</span> ${rec(7)}`; } return `${a.name} names four people. Two have left the company and their files were "not retained."`; } },

const KN_DEPO = { title: () => `Deposition of ${SK.exec}`, kind: "depo", witness: () => SK.execLast, room: "A deposition is questioning the other side's witness under oath before trial. Here the witness is the executive who was in the room when the decisions were made.",
  intro: () => `${SK.exec}, ${SK.execTitle}, arrives with ${OC.last} and a bottle of water ${XP().she} does not open. ${XP().He} has been prepared for a week. ${(n => n === 0 ? `You have nothing yet that ${XP().she} does not know about.` : n === 1 ? `You have one thing ${XP().she} does not know you have.` : `You have ${["", "", "two", "three", "four"][n]} things ${XP().she} does not know you have.`)(["kn_log", "kn_memo", "kn_test", "kn_money"].filter(k => G.f[k]).length)}`,

      ] },
    { title: "The files", text: () => `${execMood()} ${G.f.kn_memo ? "The memo is in your folder." : ""} ${G.f.kn_log ? "So is the complaint log." : ""}`,
      options: [
        { label: () => `Show ${XP().her} the memo`, hint: () => `Put the internal warning in front of ${XP().her} and ask whether ${XP().she} read it. Whatever ${XP().she} says hurts ${XP().her}, because either ${XP().she} read it and did nothing, or ${XP().she} did not read what ${XP().hers} own people wrote. Advocacy.`, stat: "adv", who: "any", when: () => G.f.kn_memo, lock: "You did not find the internal memo in discovery.", run: a => { tire(a, 6); return attack(a, 9, p => `${SK.exec} reads it. "I don't recall this document." "It's addressed to you." "I receive a great many documents." ${press(p)} ${rec(4)}`, p => `${SK.exec} reads it twice. ${OC.last} is rattled and asks for a break. It is not granted, because you are not the one who grants breaks. ${press(p)} ${rec(5)}`, p => `${SK.exec}: "We took it under consideration." ${a.name}: "For how long?" ${SK.dateLine || `The date on the memo and the date of your client's ${SK.harmWord} are fourteen months apart.`} ${press(p + 4)} ${rec(6)}`, () => `${SK.exec} has an answer prepared for this exact document. It is a good answer.`, () => `${a.name} pushes and ${SK.exec} delivers a calm, detailed account of everything the company did in response, most of it true. ${kess(6)}`); } },

        { label: "Ask about the money", hint: () => `If you found the cost analysis, ask ${XP().her} what fixing it would have cost, then what they spent instead. Make ${XP().her} do the arithmetic on the record. Advocacy.`, stat: "adv", who: "any", when: () => G.f.kn_money, lock: "You did not find the cost analysis.", run: a => { tire(a, 6); return attack(a, 9, p => `${a.name} asks what the fix would have cost. ${XP().He} says the number. It is smaller than ${XP().hers} bonus. ${press(p)} ${rec(5)}`, p => `${SK.exec}: "Every business weighs costs." ${a.name}: "Against what?" Silence. ${press(p)} ${rec(5)}`, p => `${a.name} puts the cost analysis in front of ${XP().her} and asks ${XP().her} to read the last line. ${XP().He} reads it. The court reporter looks up. ${press(p + 5)} ${rec(7)}`, () => `${SK.exec} explains cost-benefit analysis patiently. It sounds reasonable in a conference room.`, () => `${a.name} asks about money and ${SK.exec} turns it into a speech about jobs and shareholders that ${OC.last} did not have to write for ${XP().her}. ${kess(6)}`); } },

const KN_MOTION = { title: "The motion", kind: "paper", room: "A motion asks the judge to decide something without a trial. Here the company asks the judge to throw the case out before a jury ever hears it.",
  intro: () => `${OC.last} files a two-hundred-page motion arguing that the company owed ${SK.pl || SK.cl.last} nothing, and that even if it did, ${SK.theirDefense} Judge Amsel sets argument for a Thursday.`,

        { label: "Answer on the law", hint: "Argue that the company's legal theory is wrong regardless of the facts: find the earlier decisions that say a company that knows must act. Hours of reading, and it can end the motion outright. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); G.hrs -= 2; if (t >= 3) { press(11); return `${a.name} finds a decision from the same courthouse, nine years ago, on almost the same facts. The judge wrote it. <span class="good">${CASE.lbl.you} +11.</span> Budget −2.`; } if (t >= 2) { press(5); return `${a.name} finds three decisions that help. ${OC.last} finds two that do not. <span class="good">${CASE.lbl.you} +5.</span> Budget −2.`; } return `${a.name} finds the law. It is closer than you would like. Budget −2.`; } },

      ] },
  ] };
const KN_TRIAL = { title: "Trial", kind: "trial", room: "Trial is where a jury decides whether the company is responsible and what that is worth. In a case like this, the jury can also decide to punish the company for what it knew.",
  intro: () => `Courtroom 7. The company has sent three lawyers and a vice president who sits very still. ${SK.cl.last} sits at your table with ${SK.cl.her} hands folded. The jury is nine women and three men.`,
  beats: () => [
    { title: "Opening", text: () => `${OC.last} opens on an unfortunate event, a responsible company, and a lawsuit looking for someone to blame. Then you open.`,
      options: [
        { label: "Open on what they knew", hint: "Tell the jury the story in the company's own words: the complaints, the memo, the decision. Make it about knowledge, not injury. Strongest with more findings. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 7); const found = ["kn_log", "kn_memo", "kn_test", "kn_money"].filter(k => G.f[k]).length; return attack(a, 9, p => `${a.name} tells the jury what the company knew and when. ${found >= 2 ? "The dates do most of the work." : "It is a thinner story than you would like."} ${press(p + found * 2)}`, p => `${a.name} opens with a single sentence from the company's files and builds the case out from it. ${press(p + found * 2)}`, p => `${a.name}: "They knew. They wrote it down. They did the math. ${SK.walkLine || `Then ${SK.cl.last} walked in.`}" The room is silent. ${press(p + found * 2 + 4)}`, () => `It is an opening the jury has heard versions of, and it does its job.`, () => `${a.name} opens angry and the jury, who have not yet seen the documents, see only the anger. ${kess(6)}`); } },
        { label: () => SK.openLabel || "Open on the client", hint: () => SK.openHint || "Start with the person, not the paper, so who they were before, what happened and what it took. Sympathy first, then knowledge. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 5); if (t >= 3) { press(9); return `${a.name} tells the jury about ${SK.victim || "your client"} for six minutes without mentioning the company once. Then mentions the company. <span class="good">${CASE.lbl.you} +9.</span>`; } if (t >= 2) { press(4); return `${a.name} opens on ${SK.victim || "your client"}. Warm, a little long. <span class="good">${CASE.lbl.you} +4.</span>`; } kess(5); return `${a.name} opens on ${SK.victim || "your client"} and it tips into sentiment. Two jurors look away. <span class="k">${OC.last} +5.</span>`; } },

    { title: "The executive on the stand", text: () => `${SK.exec} testifies for the company. ${OC.last} walks ${XP().her} through the company's safety program, its values, its people. Then you cross-examine ${XP().her}.`,

        { label: () => `Read ${XP().her} ${XP().hers} own deposition`, hint: () => `Everything ${XP().she} said under oath months ago is on a transcript. Where ${XP().hers} trial testimony differs, read ${XP().her} the earlier answer. Juries do not forgive a witness who changes ${XP().hers} story. Advocacy.`, stat: "adv", who: "any", run: a => { tire(a, 7); const bonus = (G.f.timeline ? 3 : 0) + (G.f.execCare ? 3 : 0); return attack(a, 9, p => `${a.name} reads ${XP().her} three answers from the deposition. Two do not match today. ${press(p + bonus)}`, p => `"Page 212, line 4. Do you need me to read it again?" ${XP().He} does not. ${press(p + bonus)}`, p => `${a.name} reads ${XP().her} the six sentences about safety from the deposition, then hands the jury the complaint log. Nobody needs to explain the gap. ${press(p + bonus + 5)}`, () => `${SK.exec} has been prepared for this and holds ${XP().hers} story together.`, () => `${a.name} reads a passage that, in context, helps ${XP().her}, and ${OC.last} lets the jury hear the context. ${kess(6)}`); } },
        { label: "The memo, in front of the jury", hint: () => `Put the internal warning on the screen and make ${XP().her} read it aloud to twelve people. It is the single strongest thing you have. Only if you found it. Advocacy.`, stat: "adv", who: "any", when: () => G.f.kn_memo, lock: "You did not find the internal memo in discovery.", run: a => { tire(a, 7); return attack(a, 8, p => `The memo goes on the screen. ${SK.exec} reads it aloud, slowly. Juror 5 writes something down. ${press(p + 4)}`, p => `${a.name} asks ${XP().her} to read the date, then the subject line, then the last paragraph. ${press(p + 4)}`, p => `${a.name} asks ${XP().her} to read the memo and then asks nothing else. The jury reads it again on their own. ${press(p + 8)}`, () => `${SK.exec} reads it and explains it. The explanation is not bad.`, () => `${a.name} overreads the memo and the judge asks you to move on. ${kess(5)}`); } },
        { label: "The number", hint: () => `If you found the cost analysis, make ${XP().her} tell the jury what the fix would have cost and what they chose instead. Juries punish companies that did the math. Only if you found it. Advocacy.`, stat: "adv", who: "any", when: () => G.f.kn_money, lock: "You did not find the cost analysis.", run: a => { tire(a, 7); return attack(a, 8, p => `${a.name} asks the number. ${XP().He} says it. Twelve people do the comparison in their heads. ${press(p + 4)}`, p => `"And what did the company spend on the recall it did not do?" "Nothing." "Thank you." ${press(p + 4)}`, p => `${a.name} writes the two numbers on the easel and sits down. ${press(p + 8)}`, () => `${SK.exec} explains that every business weighs costs. Some jurors nod.`, () => `${a.name} asks about the money and ${SK.exec} talks about the jobs it protects. The jury includes people with jobs. ${kess(6)}`); } },

    { title: "Their expert", text: () => `${SK.oppShort}'s expert, ${SK.expert}, testifies that ${SK.expertLine} ${EP().He} has testified for companies like this forty times.`,
      options: [
        { label: "Cross on the forty times", hint: () => `Ask how often ${EP().she} testifies, for whom, and for how much. A jury that learns an expert always says the same thing for the same side stops listening to ${EP().her}. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 4); if (t >= 3) { press(8); return `Forty times, always for the company, always the same conclusion, at ${d(3) + 5} hundred dollars an hour. The jury is done listening to ${EP().her}. <span class="good">${CASE.lbl.you} +8.</span>`; } if (t >= 2) { press(3); return `The fee comes out. The jury has seen this before. <span class="good">${CASE.lbl.you} +3.</span>`; } return `${EP().He} has a graceful answer about independence that ${EP().she} has given forty times.`; } },
        { label: "Cross on your own test", hint: () => `If you have a test, make ${EP().her} explain why ${EP().hers} conclusion is different from what the test shows. Experts do not like disagreeing with data. Research.`, stat: "res", who: "any", when: () => G.f.kn_test, lock: "You did not get the test results.", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (t >= 2) { press(8); return `${a.name} puts the test results next to ${EP().hers} conclusion and asks ${EP().her} to reconcile them. ${EP().He} tries. <span class="good">${CASE.lbl.you} +8.</span>`; } return `${a.name} shows ${EP().her} the test. ${EP().He} has a methodological objection that takes ten minutes to explain.`; } },
        { label: () => `Let ${EP().her} talk`, hint: () => `Paid experts bore juries. Let ${EP().her} go on, ask three short questions, and sit down. Cheap and patient.`, stat: null, who: null, run: () => { press(2); return `${EP().He} testifies for two hours. By the second, the jury is looking at the clock. <span class="good">${CASE.lbl.you} +2.</span>`; } },
      ] },
    { title: "Closing", text: () => `${OC.last} closes on a tragedy, a good company, and a plaintiff's lawyer who wants the jury to send a message with someone else's money. Judge Amsel gives you forty minutes.`,

        { label: "Ask the jury to say what the company knew", hint: "Close on knowledge, not sympathy. Walk the jury through the documents in order, then ask them to answer one question: did the company know? Everything you found pays here. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 7); const found = ["kn_log", "kn_memo", "kn_test", "kn_money"].filter(k => G.f[k]).length; return attack(a, 9, p => `${a.name} goes through the documents in date order and asks the jury one question. ${press(p + found * 3)}`, p => `${a.name} closes with the company's own words and none of ${SK.victimPoss || "your client's"}. ${press(p + found * 3)}`, p => `${a.name} puts the memo on the screen one last time, reads the date, and says: "${SK.walkLine2 || `${SK.cl.last} walked in fourteen months later.`} Decide what that is worth." ${press(p + found * 3 + 5)}`, () => `The closing repeats the opening. The jury has heard it.`, () => `${a.name} closes on outrage and ${OC.last}, given the last word, asks the jury to decide on evidence instead. ${kess(6)}`); } },
        { label: "You close", hint: "The partner gives the closing. Steady, familiar, and the associates learn nothing from watching.", stat: null, who: null, run: () => { press(7); G.pat += 3; const lead = G.you - G.them; return `${lead > 8 ? "You close, and you do a great job." : lead < -8 ? "You close, but not well enough." : "You close just well enough."} Your client watches the jury the whole time. <span class="good">${CASE.lbl.you} +7, Patience +3.</span>`; } },
      ] },
  ] };


/* =====================================================================
   STRUCTURE 10: the merger. Your client is buying a competitor. The government has sued to stop it. Discovery is the second request, the witnesses are economists and the target's CEO, and a judge decides whether the deal closes.
   Findings (3 of 4 live): mg_entry (new competitors are coming), mg_customers (the customers want the deal), mg_efficiencies (the savings are real and documented), mg_context (the hot documents have an innocent reading).
   ===================================================================== */
const econMood = () => (SK.econShe === "he" ? [[`${SK.econ} is hostile and answering questions with questions.`,`${SK.econ} is guarded and giving nothing away.`,`${SK.econ} is still hostile.`],[`${SK.econ} is careful, and checks with ${OC.last} before every number.`,`${SK.econ} is careful.`,`${SK.econ} is being careful with every number.`],[`${SK.econ} is composed.`,`${SK.econ} is calm.`,`${SK.econ} is steady.`],[`${SK.econ} is comfortable and has started lecturing.`,`${SK.econ} is relaxed now, and explaining more than he was asked.`,`${SK.econ} is talking freely.`],[`${SK.econ} is irritated and conceding small points to end the exchange.`,`${SK.econ} is rattled.`,`${SK.econ} is flustered.`]] : [[`${SK.econ} is hostile and answering questions with questions.`,`${SK.econ} is guarded and giving nothing away.`,`${SK.econ} is still hostile.`],[`${SK.econ} is careful, and checks with ${OC.last} before every number.`,`${SK.econ} is careful.`,`${SK.econ} is being careful with every number.`],[`${SK.econ} is composed.`,`${SK.econ} is calm.`,`${SK.econ} is steady.`],[`${SK.econ} is comfortable and has started lecturing.`,`${SK.econ} is relaxed now, and explaining more than she was asked.`,`${SK.econ} is talking freely.`],[`${SK.econ} is irritated and conceding small points to end the exchange.`,`${SK.econ} is rattled.`,`${SK.econ} is flustered.`]])[G.mood + 2][G.step % 3];
const MG_KICKOFF = { title: "Kickoff", kind: "office", room: "Kickoff is the first meeting after the government signals it will fight the deal. It covers who your client is, what the deal is, and why the Agency thinks it should not happen. Nothing has been filed in court yet.",
  intro: () => (typeof SK.introLine === "function" ? SK.introLine() : SK.introLine) + ` The Agency's trial team is led by ${OC.name}.`,
  beats: () => [
    { title: "The complaint", text: () => `The Agency's complaint runs ${SK.pages} pages, and it comes down to one claim. ${SK.theirLine} Your client says that is not how the business works, and wants to know what you are going to do about it.`,
      options: [
        { label: "Tell your client what the case is about", hint: "Merger cases turn on one question, what the market is. If it is as small as the Agency says, your client loses; if it is bigger, the Agency's numbers mean nothing. Explain that now, so your client stops arguing about the deal's merits and starts helping you define the market. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 2); G.f.honest = true; G.pat += t >= 2 ? 6 : 2; return `${a.name} explains that the fight is over the word "market." Your client is quiet, then starts naming competitors the complaint left out. <span class="good">Patience +${t >= 2 ? 6 : 2}.</span> ${rec(3)}`; } },
        { label: "Tell your client the deal will close", hint: "Reassure the CEO and the board. It steadies a client who has a stock price to think about, and it is a promise you will be held to at every bad turn. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); G.f.promised = true; G.pat += t >= 2 ? 10 : 4; return `${a.name} says the deal will close. Your client repeats it on the investor call an hour later. <span class="good">Patience +${t >= 2 ? 10 : 4}.</span>`; } },
        { label: () => SK.rivalsLabel || "Ask who else sells what they sell", hint: () => SK.rivalsHint || `The complaint names two companies. Your client knows every firm that has ever taken a customer from ${SK.co}. Get the list now, because every name on it makes the Agency's market bigger. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 3); if (t >= 2) { G.f.competitorList = true; return `${a.name} comes out of the meeting with a list of ${d(6) + 8} companies the complaint never mentions. Some are small. All of them sell ${SK.product}. ${rec(6)}`; } return `${a.name} gets a list. Half the names on it are companies ${SK.target} already owns, which makes them the same company after the deal. ${rec(2)}`; } },
      ] },
    { title: "The outside date", text: () => `The merger agreement gives the deal until ${SK.outsideDate} to close. After that, either side can walk, and ${SK.target}'s board has other suitors. The Agency knows the date. ${OC.last} has already asked the court for a schedule that runs past it.`,
      options: [
        { label: "Pin the Agency to a timetable", hint: "Put a schedule in writing and make the Agency agree to it, covering when documents go in and when it decides. A deal dies if the review drags, and the calendar is the Agency's favorite weapon. It costs the team sleep and takes that weapon away. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); if (t >= 2) { press(6); G.f.fastTrack = true; return `The Agency agrees to a timetable that ends in ${SK.hearingMonth}, inside the date the deal has to close by. ${OC.last} pushes back and loses. <span class="good">${CASE.lbl.you} +6.</span>`; } kess(3); return `${OC.last} splits the difference. The timetable ends a week before the deal's deadline, which is a week too close. <span class="k">${OC.last} +3.</span>`; } },
        { label: "Get the outside date extended", hint: "Ask your client to go back to the target and push the date. It costs a fee to the target, usually a large one, and buys the case room to breathe. Charm to make the ask.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 2) { G.pat += 4; G.f.dateExtended = true; return `The target agrees to four more months for a ${d(3) + 1} percent bump in the price. Your client is annoyed and relieved. <span class="good">Patience +4.</span> <span class="note">The calendar is no longer a weapon.</span>`; } G.pat -= 5; return `${SK.targetCeo} says no. The target likes having a deadline. <span class="warn">Patience −5.</span>`; } },
        { label: "Live with the date", hint: "Leave the schedule alone and win on the merits. It keeps the target happy and the fee where it is, and every delay from here on is a delay your client cannot afford.", stat: null, who: null, run: () => `You leave the calendar where it is and circle the date on the wall.` },
      ] },
    { title: "The other side", text: () => `${OC.last} signed the complaint. ${counselIntroLine()}`,
      options: [
        { label: () => `Brief the team on ${OC.her}`, hint: () => `Every government trial lawyer has a way of trying these. An hour on ${OC.hers} means ${OC.hers} favorite move lands softer when ${OC.she} uses it. Research.`, stat: "res", who: "any", run: a => { tire(a, 3); G.f.knowOC = true; return `${a.name} walks the team through ${OC.last}'s last three merger cases. <span class="note">${OC.style}. ${OC.know}</span>`; } },
        { label: "Open a channel to the Agency", hint: "Call the Agency's senior staff and say your client is willing to talk about selling something to settle the case. It costs nothing and it tells them your client might sell something, which is what they wanted to hear. Patience up, a little ground lost.", stat: null, who: null, run: () => { G.pat += 4; kess(3); G.f.channel = true; return `The Agency's deputy director takes the call and says, warmly, that they are "always open to constructive proposals." <span class="good">Patience +4.</span> <span class="k">${OC.last} +3.</span>`; } },
        { label: "Get to work", hint: "Skip the courtesies and open the second request.", stat: null, who: null, run: () => `You open the second request. It is longer than the complaint.` },
      ] },
  ] };
const MG_SECOND = { title: "The second request", kind: "paper", room: "The second request is the government's demand for documents, meaning every email, every board deck, and every forecast. What your client wrote before the deal is the government's evidence, and the work is knowing it before they do.",
  intro: () => `${SK.co} has produced ${SK.docCount} documents. The Agency has read them with a team of forty. Somewhere in there are the emails ${OC.last} will build the case on, and the ones you will.`,
  beats: () => [
    { title: "The hot documents", text: () => `Every merging company has them, the strategy deck that calls the target "our only real competitor," and the email that jokes about raising prices. ${SK.co} has ${SK.hotCount}. ${OC.last} has found at least two.`,
      options: [
        { label: "Find every one before they do", hint: "Have the team read the produced documents the way the Agency is reading them, looking for the worst sentence on every page. Weeks of work and it wears everyone down, and it means no document surprises you at the hearing. Research. Tiring.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); alive().forEach(x => tire(x, 5)); G.hrs -= 3; if (t >= 2) { G.f.hotList = true; press(7); return `It takes three weeks. ${a.name} has a list of ${SK.hotCount} documents, ranked by how bad they sound out loud, with the context for each. <span class="good">${CASE.lbl.you} +7.</span> ${rec(7)} <span class="warn">Everyone Burnout +5.</span> Budget −3.`; } return `It takes three weeks. ${a.name} has most of them, and the ones missed are the ones ${OC.last} will read aloud. ${rec(3)} <span class="warn">Everyone Burnout +5.</span> Budget −3.`; } },
        { label: "Interview the people who wrote them", hint: "Skip the reading and sit down with the executives whose emails matter. Ask what they meant. It is faster, and a witness who has explained the email to you once can explain it to the Agency later; it misses whatever was written by someone you did not think to ask. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 4); if (!live("mg_context")) return `${a.name} interviews six executives. The emails meant what they say. ${rec(2)}`; if (t >= 2) { G.f.mg_context = true; press(8); return `${a.name} sits with the head of strategy for two hours. "Our only real competitor" was written the week ${SK.rival} launched, and the next sentence, which nobody quotes, is about ${SK.rival}. <span class="good">${CASE.lbl.you} +8.</span> ${rec(7)}`; } return `The executives are defensive and vague. Two of them ask whether they need their own lawyers. ${rec(2)}`; } },
      ] },
    { title: () => `The ${SK.custWord || "customers"}`, text: () => `The Agency has interviewed the ${SK.custWord || "customers"} who pay ${SK.co}. Some of them have said, on the record, that they are worried. Others have not been asked.`,
      options: [
        { label: () => `Get the ${SK.custWord || "customers"} on paper`, hint: () => `Have your client's ${SK.salesTeam || "sales team"} call the big ${SK.custWord || "customers"} and ask whether they will sign a declaration (a written statement made under oath) supporting the deal. ${ucf(SK.custWord || "customers")} who want it are the best evidence there is, because they are the people the Agency says it is protecting. It costs your client relationships if the answer is no. Charm.`, stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 4); if (!live("mg_customers")) return `Eleven ${SK.custWord || "customers"} are called. Nine say they would rather not get involved. ${rec(2)}`; if (t >= 2) { G.f.mg_customers = true; press(9); return `Seven of ${SK.co}'s ten biggest ${SK.custWord || "customers"} sign declarations. Two say the deal will lower their costs. One says ${SK.target} was never a real alternative. <span class="good">${CASE.lbl.you} +9.</span> ${rec(8)}`; } return `Three ${SK.custWord || "customers"} sign. Four say they will "think about it," which means no. ${rec(3)}`; } },
        { label: () => `Find out what the ${SK.custWord || "customers"} told the Agency`, hint: () => `The Agency has to disclose its witness interviews. Read them, find the ${SK.custWord || "customers"} who are complaining, and find out why: one with a grudge or a pending price dispute is a witness with a reason. Research.`, stat: "res", who: "any", run: a => { const t = roll(a, "res", 8); tire(a, 4); if (t >= 2) { press(6); G.f.custMotives = true; return `${a.name} reads forty interview memos. The three loudest ${SK.custWord || "customers"} are all in a pricing dispute with ${SK.co} that predates the deal. <span class="good">${CASE.lbl.you} +6.</span> ${rec(5)}`; } return `The memos are heavily redacted. What is left is worried ${SK.custWord || "customers"}.`; } },
      ] },
    { title: "The efficiencies", text: () => `Your client says the deal will save ${SK.savings} a year and that the savings will reach customers. Judges hear that in every merger case and believe it in almost none.`,
      options: [
        { label: "Prove the savings, line by line", hint: "Have the team and the client's finance people build the efficiencies case the way the Agency's economists need it, with each saving named, sourced, and tied to a document written before the lawsuit. Slow, and only savings that are specific to this deal count. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 9); tire(a, 5); G.hrs -= 2; if (!live("mg_efficiencies")) return `The savings are real and they are the kind any buyer could get. The Agency will not count them. Budget −2.`; if (t >= 2) { G.f.mg_efficiencies = true; press(8); return `${a.name}'s efficiencies report is ${d(40) + 60} pages, and every number in it points to a document dated before the complaint. <span class="good">${CASE.lbl.you} +8.</span> ${rec(7)} Budget −2.`; } return `The report is thick and half the numbers trace back to a banker's deck written to sell the deal. ${rec(2)} Budget −2.`; } },
        { label: "Drop the efficiencies argument", hint: "Do not lead with savings. Courts rarely let them carry a merger, and a weak efficiencies case makes the strong parts of your case look like an afterthought. Saves the hours; nothing gained.", stat: null, who: null, run: () => `You tell your client the savings stay in the press release and out of the brief. ${SK.cl.He} does not love it.` },
      ] },
    { title: "The next competitor", text: () => `${SK.entrantSetup}`,
      options: [
        { label: "Build the entry story", hint: "Show the judge that new competitors are coming: the startups, the foreign firms, the customers building their own. If the market is about to get more crowded, two companies becoming one matters less. Research, and the evidence has to be real, because the Agency will call every entrant a hope.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 4); if (!live("mg_entry")) return `${a.name} finds three would-be entrants. Two have no product and one has no customers. ${rec(2)}`; if (t >= 2) { G.f.mg_entry = true; press(9); return `${a.name} finds it: ${SK.entrantLine} <span class="good">${CASE.lbl.you} +9.</span> ${rec(8)}`; } return `${a.name} finds entrants. Their combined share of the market is small enough that ${OC.last} will call it nothing at all.`; } },
        { label: "Subpoena the rival", hint: () => `Send ${SK.rival} a court order (a subpoena) demanding its own forecasts. If the rival is planning to take ${SK.co}'s customers, its documents say so, and a competitor's internal plans are evidence the Agency cannot wave away. The rival will fight the subpoena, which costs weeks. Drafting.`, stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 4); G.hrs -= 2; if (t >= 2) { press(6); G.f.rivalDocs = true; return `${SK.rival} fights the subpoena and loses. Its five-year plan has a slide titled "Taking share from ${SK.co}." <span class="good">${CASE.lbl.you} +6.</span> ${rec(5)} Budget −2.`; } return `${SK.rival}'s lawyers produce a thin file and a letter about burden. Budget −2.`; } },
      ] },
  ] };
const MG_DEPO = { title: () => `Deposition of ${SK.econ}`, kind: "depo", witness: () => SK.econLast, room: "The Agency has now sued to block the deal, and this is a deposition of its economist. The whole case runs through this witness, who supplies the market definition, the shares, and the predicted price effects. Every concession here is one the judge will hear about.",
  intro: () => `${SK.econ}, ${SK.econTitle}, has testified for the Agency ${d(6) + 6} times and been on the losing side ${d(3)}. ${OC.last} sits beside ${SK.econShe === "he" ? "him" : "her"} with a copy of the expert report and a highlighter. ${(n => n === 0 ? "You have nothing yet that the report does not account for." : n === 1 ? "You have one thing the report does not account for." : `You have ${["", "", "two", "three", "four"][n]} things the report does not account for.`)(["mg_entry", "mg_customers", "mg_efficiencies", "mg_context"].filter(k => G.f[k]).length)}`,
  beats: () => [
    { title: "The market", text: () => `${econMood()} The report defines the market as ${SK.market}. Everything else in it depends on that sentence.`,
      options: [
        { label: "Walk the edges of the definition", hint: "Ask about every product and every company that sits just outside the market as defined. Each time the economist admits a customer could switch to something outside the line, the line moves, and the shares inside it shrink. Slow, patient questioning. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "res", 9); tire(a, 5); if (t >= 3) { press(10); G.f.marketDented = true; return `Two hours at the edge of the market. ${SK.econ} concedes that ${SK.substitute} is "a partial substitute for some customers." ${a.name} asks how many. "Some." <span class="good">${CASE.lbl.you} +10.</span> ${rec(6)}`; } if (t >= 2) { press(4); return `${SK.econ} holds the line, mostly, and admits the line was drawn "with judgment." <span class="good">${CASE.lbl.you} +4.</span> ${rec(3)}`; } return `${SK.econ} has defined this market in three prior cases and knows every question. The line holds.`; } },
        { label: "Use your competitor list", hint: "Read the economist the list of companies your client says it competes with, one at a time, and ask why each is outside the market. Only works if you got the list at kickoff, and it forces a yes-or-no on every name. Advocacy.", stat: "adv", who: "any", when: () => G.f.competitorList, lock: "You did not get the competitor list from your client at kickoff.", run: a => { tire(a, 6); return attack(a, 9, p => `${a.name} reads eleven names. ${SK.econ} excludes each one with a reason. The reasons start to repeat. ${press(p)} ${rec(4)}`, p => `Name seven is a company ${SK.econ} has never heard of. It has forty thousand customers. ${press(p)} ${rec(5)}`, p => `${a.name} reads the list and then asks ${SK.econ} to read, from ${SK.econShe === "he" ? "his" : "her"} own report, the sentence that says the market "may be broader than defined here." ${press(p + 5)} ${rec(7)}`, () => `${SK.econ} has an answer for every name.`, () => `${a.name} reads too many names and ${SK.econ} turns the list into a lecture on why none of them matter, which the reporter takes down word for word. ${kess(6)}`); } },
      ] },
    { title: "The numbers", text: () => `${econMood()} The report predicts prices will rise ${SK.priceRise} after the deal. The prediction comes from a model.`,
      options: [
        { label: "Take the model apart", hint: "Ask what goes into the model and what comes out if you change one input. Economists build models on assumptions, and a model that predicts a price increase with one set of assumptions predicts none with another. Research, and the associate has to understand the math.", stat: "res", who: "any", run: a => { const t = roll(a, "res", 10); tire(a, 6); if (t >= 3) { press(9); G.f.modelBroken = true; return `${a.name} changes one input, the one about how easily customers switch, and asks what the model says now. ${SK.econ}: "It would depend." "On what?" "On the input." <span class="good">${CASE.lbl.you} +9.</span> ${rec(7)}`; } if (t >= 2) { press(4); return `${a.name} finds two assumptions that are generous to the Agency. ${SK.econ} calls them "standard." <span class="good">${CASE.lbl.you} +4.</span> ${rec(3)}`; } return `The model has more moving parts than ${a.name} has hours.`; } },
        { label: "Show the economist the customer declarations", hint: "Put the declarations from your client's customers in front of the witness and ask why the people the model says will be hurt are asking for the deal. Only if you got the customers on paper. Advocacy.", stat: "adv", who: "any", when: () => G.f.mg_customers, lock: "You did not get the customers to sign declarations.", run: a => { tire(a, 5); return attack(a, 9, p => `${SK.econ} reads the declarations. "Customers are not always well positioned to evaluate long-run effects." ${a.name} writes that down. ${press(p)} ${rec(4)}`, p => `${SK.econ}: "Stated preferences and revealed preferences differ." ${a.name}: "So the customers are wrong about their own business." There is a pause. ${press(p)} ${rec(5)}`, p => `${a.name} hands over the declaration from ${SK.bigCustomer} and asks whether the model included them. It did not. They are the largest buyer in the market. ${press(p + 5)} ${rec(7)}`, () => `${SK.econ} has a paragraph about why customer testimony is unreliable.`, () => `${a.name} pushes and ${SK.econ} explains, patiently and well, why customers cannot see a price increase coming until it comes. ${kess(6)}`); } },
        { label: "Ask about the efficiencies", hint: "If you built the efficiencies report, ask the economist whether the model accounts for the savings. It never does, and making the witness say so puts a hole in the report the judge can see. Only if you built the report. Advocacy.", stat: "adv", who: "any", when: () => G.f.mg_efficiencies, lock: "You did not build the efficiencies report.", run: a => { tire(a, 5); return attack(a, 8, p => `"Does your model account for ${SK.savings} in annual savings?" "I was not asked to evaluate claimed efficiencies." ${press(p)} ${rec(4)}`, p => `${SK.econ} says efficiencies are "outside the scope of my engagement." ${a.name}: "So the model assumes there are none." "The model is silent." ${press(p)} ${rec(4)}`, p => `${a.name} puts the report on the table and asks whether the witness has read it. ${SK.econ} has not. It has been in the record for six weeks. ${press(p + 4)} ${rec(6)}`, () => `${SK.econ} explains that efficiencies are rarely credited and rarely real. The judge may agree.`, () => `${a.name} argues the savings with the witness, who knows more about them than ${a.name} does. ${kess(5)}`); } },
      ] },

    options: [{ label: "Object to the late production", hint: "The other side just produced documents they should have handed over months ago. Object, and ask the judge to keep them out. It works if you have already built a record of them holding things back. Advocacy.", stat: "adv", who: "any", run: a => { const t = roll(a, "dra", G.rec >= 20 ? 7 : 9); tire(a, 4); if (t >= 2) { press(4); return `${a.name} objects and the document is limited to "background." <span class="good">${CASE.lbl.you} +4.</span> ${rec(3)}`; } kess(8); return `${a.name} objects. It comes in anyway. <span class="k">${OC.last} +8.</span>`; } },
      { label: "Absorb it", hint: "Accept the late documents and read them. The fight over timing costs hours you may not have, and the documents are in the case either way.", stat: null, who: null, run: () => { kess(6); return `You read it, sigh, and move on. <span class="k">${OC.last} +6.</span>`; } }] },
  { title: "Someone's phone", text: () => `${tiredest().name}'s phone rings during a meeting. It is a recruiter. ${tiredest().name} takes the call in the hall and comes back looking thoughtful.`,
    options: [{ label: "Talk to them tonight", hint: "An associate is being recruited. Take them out tonight yourself, before the offer becomes a decision. An hour of the partner's attention is what keeps people. Costs two hours of budget.", stat: null, who: null, run: () => { const tt = tiredest(); G.hrs -= 2; tt.burn = Math.max(0, tt.burn - 10); return `You take ${tt.name} for a drink and listen. ${tt.name} stays, for now. <span class="good">${tt.name} Burnout −10.</span> Budget −2.`; } },
      { label: "Not now", hint: "Deal with it after the matter. There is a case on, and people who are being recruited can wait a week. Sometimes.", stat: null, who: null, run: () => { const tt = tiredest(); tire(tt, 6); return `You have a ${CASE.kind === "deal" ? "deal" : "case"} on. ${tt.name} notices that you noticed. <span class="warn">${tt.name} Burnout +6.</span>`; } }] },
  { title: "The budget meeting", when: () => clientIsOrg(), text: () => `${CL().last} has a budget meeting Thursday and needs to explain your bills. ${G.hrs < 20 ? "The bills are large." : "The bills are fine, but budget meetings are not about facts."}`,

      { label: "Send a one-page summary of what the money bought", hint: "The client is questioning the bill. Send one page that says what each block of hours produced. Clients who see what they paid for stop asking. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 2); const g = [0, 3, 7, 10, 12][t]; G.pat += g; return `${a.name} writes one page. ${CL().last} reads it aloud in the meeting. <span class="good">Patience +${g}.</span>`; } }] },

/* ---------------- the predecessor's shadow ---------------- */
function shadowBeat() {
  const prior = priorPartnerName(); if (!prior) return null;
  const pool = [
    { title: "The old style", text: () => `${CL().last} asks, halfway through a sentence, what ${prior} would have done here. Not unkindly. ${CL().He} liked ${prior}.`,
      options: [{ label: `Tell ${CL().her} what ${prior} would have done, then do something else`, hint: "Honest. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 8); tire(a, 2); if (t >= 2) { G.pat += 6; return `${a.name} answers the question and then explains why this matter is different. ${CL().last} is satisfied. <span class="good">Patience +6.</span>`; } G.pat -= 3; return `${a.name} answers. ${CL().last} looks like someone comparing. <span class="warn">Patience −3.</span>`; } },
        { label: "Do what the old partner would have done", hint: "Run the matter the way your predecessor did. Safe and familiar, and their way lost this client once.", stat: null, who: null, run: () => { G.pat += 4; kess(3); return `You do it ${prior}'s way. ${CL().last} relaxes. ${OC.last}, who has seen ${prior}'s way before, does not. <span class="good">Patience +4.</span> <span class="k">${OC.last} +3.</span>`; } }] },
    { title: "The phone call", text: () => { const t = tiredest(); return `${t.name} is on the phone in the hall, quietly. It is ${prior}. ${t.name} is asking for advice on this matter, from the partner who used to run it.`; },
      options: [{ label: "Let it happen", hint: "A former partner is offering your associate advice on the case. Let it happen. Whatever the advice is, it is free, and the associate hears a second voice.", stat: null, who: null, run: () => { const t = tiredest(); G.rec += 4; t.burn = Math.max(0, t.burn - 4); return `${t.name} comes back with a page of notes and does not say where it came from. ${rec(0)}<span class="good">${t.name} Burnout −4.</span>`; } },
        { label: "Have a word about it afterward", hint: "Let the conversation finish, then tell the associate quietly that the strategy is yours. This is your group now, and it has one voice. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 2); const tt = tiredest(); if (t >= 2) { return `${a.name} says it lightly: "Ask me first. Then ask ${prior}." ${tt.name} laughs and does. <span class="note">Loyalty, arriving.</span>`; } tire(tt, 5); return `${a.name} says it and it lands heavier than intended. <span class="warn">${tt.name} Burnout +5.</span>`; } }] },
    { title: "The old playbook", text: () => CASE.kind === "deal" ? `${OC.last} has closed deals against this group before, when ${prior} ran it, and knows how ${prior} negotiated: open high, hold the price, give ground on everything else. ${OC.last} has walked in expecting that, and has a counter ready for it. You can run ${prior}'s playbook into a prepared answer, or run your own.` : `${OC.last} has tried cases against this group before, when ${prior} ran it, and knows how ${prior} tried them: lead with the documents, save the witness for last. ${OC.last} has prepared for exactly that. You can run ${prior}'s playbook into a prepared answer, or run your own.`,
      options: [{ label: "Run your own playbook", hint: () => CASE.kind === "deal" ? "Open on structure instead of price, and let the number come last. It is not what this group has ever done, so the other side's prepared counter is aimed at the wrong thing. It also means your client, who liked the old way, is watching you improvise. Drafting." : "Lead with the witness instead of the documents. It is not what this group has ever done, so the other side's preparation is aimed at the wrong thing, and it means going into the room without the safety net your predecessor always used. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 3); if (t >= 2) { press(8); return `${a.name} does it a way ${prior} never did. ${OC.last}'s prepared counter sits in ${OC.hers} folder, unused, and ${OC.she} spends the afternoon catching up. <span class="good">${CASE.lbl.you} +8.</span>`; } press(3); return `${a.name} tries it a new way and ${OC.last} adjusts before the afternoon is out. <span class="good">${CASE.lbl.you} +3.</span>`; } },
        { label: `Run ${prior}'s playbook, sharper`, hint: () => CASE.kind === "deal" ? "Open high and hold the price, the way the group always has, but with the counter already answered. If you have anticipated the other side's response, it is the strongest position at the table. If you have not, they have been waiting for you. Charm." : "Lead with the documents, the way the group always has, but with the other side's response already answered. If you anticipated it, it is the strongest thing you have. If you did not, they have been waiting for you. Advocacy.", stat: CASE.kind === "deal" ? "cha" : "adv", who: "any", run: a => { tire(a, 5); return attack(a, 10, p => `${a.name} runs ${prior}'s playbook and ${OC.last}'s counter is ready, but ${a.name} was ready for the counter. ${press(p)}`, p => `${a.name} runs it a beat earlier than ${prior} would have. ${OC.last} is a beat late. ${press(p)}`, p => `${a.name} runs it, absorbs the counter, and turns it. ${OC.last} looks at ${OC.hers} notes as if they have betrayed ${OC.her}. ${press(p + 4)}`, () => `${a.name} runs the old playbook. ${OC.last} runs ${OC.hers}. A wash.`, () => `${a.name} runs the old playbook and ${OC.last}'s counter, prepared for weeks, lands exactly as designed. ${kess(7)}`); } }] },
  ];
  return pick(pool);
}
/* ---------------- optional encounters: appear about half the time ---------------- */
const OPT_MEDIATION = { title: "Mediation", kind: "mediation", room: "Mediation is a settlement meeting run by a neutral, usually a retired judge. Nobody decides anything; the mediator tries to get both sides to a number.", intro: () => `The court orders a day of mediation before trial. A retired judge named Feld, a conference room, and a plate of cookies nobody touches.`,
  beats: () => [
    { title: "Opening statements", text: () => `Judge Feld asks each side to "say where you are." ${OC.last} goes first and says where ${OC.she} is at length.`,
      options: [{ label: "Be reasonable in the room, firm in the number", hint: "Be agreeable about everything except the number. Mediators push hardest on the side that seems unreasonable, and a pleasant lawyer with an immovable figure gets the mediator working on the other room. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 9); tire(a, 3); if (t >= 2) { press(6); G.f.civil = true; return `${a.name} is measured and specific. Feld nods more at your table. <span class="good">${CASE.lbl.you} +6.</span> <span class="note">Settlement talks just got easier.</span>`; } return `${a.name} says where you are. Feld writes it down without expression.`; } },
        { label: "Show them what trial looks like", hint: "Walk the other side through what a trial would look like: the documents, the witnesses, the exhibits you have built. Mediation is a preview, and a strong record shortens it. Advocacy.", stat: "adv", who: "any", run: a => { tire(a, 5); return attack(a, 9, p => `${a.name} previews the cross. ${OC.last}'s client shifts in ${OC.hers} seat. ${press(p)}`, p => `${a.name} reads two lines of transcript. Feld looks at ${OC.last}. ${press(p)}`, p => `${a.name} lays out the trial in four minutes and sits down. Feld: "Well." ${press(p + 3)}`, () => `${a.name} previews. ${OC.last} is unmoved.`, () => `${a.name} overplays and Feld, who has seen this before, says so. ${kess(5)}`); } }] },
    { title: "The number", text: () => `Feld shuttles between rooms for four hours. At 5 p.m. he comes back with a face.`,
      options: [{ label: "Hold your number", hint: "Hold your number and say nothing more. Either they move or you are going to trial. Costs nothing but patience.", stat: null, who: null, run: () => { press(3); G.pat -= 3; return `You hold the number and Feld sighs and goes back down the hall to say so. <span class="good">${CASE.lbl.you} +3.</span> <span class="warn">Patience −3.</span>`; } },
        { label: "Move a little, ask for a lot", hint: "Move a small amount and ask for a large one. It signals you can be moved and sets the frame for the next round. Drafting.", stat: "dra", who: "any", run: a => { const t = roll(a, "dra", 8); tire(a, 2); if (t >= 2) { G.f.civil = true; press(2); return `${a.name} moves the number by an inch and asks for a mile. Feld likes it. <span class="good">${CASE.lbl.you} +2.</span> <span class="note">The next offer will be better.</span>`; } return `${a.name} moves. Nobody else does.`; } }] },
  ] };
const OPT_REGULATORS = { title: "The regulators", kind: "deal", room: "The government reviews big deals. A letter with questions is normal; how you answer it decides whether it stays normal.", intro: () => `The government has questions about the deal. Not many. Enough.`,
  beats: () => [
    { title: "The letter", text: () => `A regulator's letter asks for "additional information" about how the combined company would price. ${G.f.hohw ? "You promised to close no matter what they say. That promise is now doing a lot of work." : "You kept the right to walk if this got bad. Good."}`,

        { label: "Suggest one of them get their own lawyer now", hint: "Tell one of them to get their own lawyer now. The honest advice, and it halves your fee. Clients who hear it remember it. Charm.", stat: "cha", who: "any", run: a => { const t = roll(a, "cha", 10); tire(a, 3); if (t >= 3) { G.f.earlySeparate = true; G.pat += 8; G.pat2 += 8; return `${a.name} explains why two lawyers now is cheaper than a fight later. They both nod, and both decide to stay with you anyway, having heard it. <span class="good">Both +8.</span> <span class="note">You told them. It counts.</span>`; } G.pat2 -= 6; return `${a.name} suggests it. ${SK.cl2.last} hears "you don't trust me." <span class="warn">${SK.cl2.last} −6.</span>`; } },
